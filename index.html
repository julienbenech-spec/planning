function planRow(e, dates){
  const tr = el("tr");
  const home = restoById(e.restaurantId);
  const st = contractStatus(e);
  const nameCell = el("td",{class:"emp"},
    el("button",{class:"empname empname-btn",title:"Voir la fiche planning de "+empName(e),
      onclick:()=>ouvrirFiche(e)}, empName(e)),
    el("div",{class:"emprole"}, (e.role||"—") + " · " + contratLabel(e.contractType) + " " + (e.weeklyHours||0) + "h"),
    enEssai(e) ? el("span",{class:"pill accent",style:"margin-top:4px",
      title:"Période d'essai jusqu'au "+frDate(e.essaiFin)},"Essai → "+frDate(e.essaiFin)) : null,
    (st.cls==="crit"||st.cls==="warn") ? el("span",{class:"pill "+st.cls,style:"margin-top:4px"}, st.label) : null
  );
  tr.appendChild(nameCell);

  let planned = 0;
  for (const d of dates){
    const day = Store.dayOf(e.id, d);
    if (day && day.kind==="work") planned += dayPlannedHours(day);
    tr.appendChild(planCell(e, d, day, home));
  }
  const contract = Number(e.weeklyHours)||0;
  const pct = contract ? Math.min(100, planned/contract*100) : 0;
  const over = contract && planned > contract + .01;
  const under = contract && planned < contract - .01;
  const tot = el("td",{class:"total"},
    el("div",{class:"mono",style:"font-weight:600;font-size:13px"}, fmtHshort(planned)+" h"),
    el("div",{class:"mono",style:"font-size:10.5px;color:var(--muted)"}, "/ "+contract+" h"),
    contract ? el("div",{class:"hbar"}, el("i",{class:over?"over":(under?"under":""),style:"width:"+(over?100:pct)+"%"})) : null
  );
  tr.appendChild(tot);
  return tr;
}
function planCell(e, date, day, home){
  const hors = raisonHorsContrat(e, date);
  const td = el("td",{class:"cell"+(hors?" hors":"")});
  const btn = el("button",{class:"cellbtn",onclick:()=>openDayModal(e,date)});
  btn.setAttribute("aria-label", empName(e)+" — "+frDateLong(date)+(hors?" — hors contrat":""));
  if (hors) { btn.title = "Hors contrat — "+hors; td.classList.toggle("hors", !day); }
  if (estDernierJour(e, date)){
    td.classList.add("fincontrat");
    btn.title = "Dernier jour de contrat — "+contratLabel(e.contractType)+" terminé le "+frDate(e.endDate);
    btn.appendChild(el("span",{class:"chip fin"},
      el("span",{class:"tag"},"! Dernier jour"), contratLabel(e.contractType)+" terminé"));
  }
  if (!day){
    if (!hors && reposHabituel(e, date)) btn.appendChild(el("span",{class:"reposhab"},"repos"));
    else btn.appendChild(el("span",{class:"plus"},"+"));
  }
  else if (day.kind === "absence"){
    /* le motif est enregistré mais volontairement masqué sur le planning */
    btn.appendChild(el("span",{class:"chip abs"}, "Absence"));
  } else {
    if (hors) btn.appendChild(el("span",{class:"chip hors"},
      el("span",{class:"tag"},"Hors contrat"), hors));
    for (const s of (day.services||[])){
      const ailleurs = s.restaurantId && home && s.restaurantId !== home.id;
      const chip = el("span",{class:"chip "+(ailleurs?"renfort":"work")});
      if (ailleurs) chip.appendChild(el("span",{class:"tag"},"↔ "+restoName(s.restaurantId)));
      chip.appendChild(document.createTextNode(s.start+"–"+s.end + (s.breakMin?" ·"+s.breakMin+"m":"")));
      btn.appendChild(chip);
    }
    if (day.actual !== null && day.actual !== undefined && day.actual !== ""){
      const diff = Number(day.actual) - dayPlannedHours(day);
      btn.appendChild(el("span",{class:"mono",style:"font-size:10px;color:"+(Math.abs(diff)<.01?"var(--muted)":"var(--warn)")},
        "réel "+fmtHshort(Number(day.actual))+" h"+(Math.abs(diff)>=.01?(diff>0?" (+"+fmtHshort(diff)+")":" ("+fmtHshort(diff)+")"):"")));
    }
  }
  td.appendChild(btn);
  return td;
}

/* ---------- modale : équipe type d'un restaurant ---------- */
/* un service fermé tous les jours ne conserve aucune plage horaire */
function nettoyerFenetres(d){
  const ferme = servId => {
    for (let j=0;j<7;j++){
      const v = ((d.cible||{})[String(j)]||{})[servId];
      if (!v || !v.ferme) return false;
    }
    return true;
  };
  if (ferme("midi")) { d.midiStart = ""; d.midiEnd = ""; }
  if (ferme("soir")) { d.soirStart = ""; d.soirEnd = ""; }
  return d;
}
function openCibleModal(restoId){
  const r = restoById(restoId);
  if (!r) return toast("Choisissez d'abord un restaurant.");
  const d = {
    midiStart: r.midiStart || "11:00", midiEnd: r.midiEnd || "15:00",
    soirStart: r.soirStart || "18:00", soirEnd: r.soirEnd || "23:30",
    cible: JSON.parse(JSON.stringify(r.cible || {}))
  };
  const val = (j, s, k) => { const v = ((d.cible[String(j)]||{})[s]||{}); return v[k]; };
  const set = (j, s, k, x) => {
    d.cible[String(j)] = d.cible[String(j)] || {};
    d.cible[String(j)][s] = d.cible[String(j)][s] || {cui:0, sal:0, ferme:false};
    d.cible[String(j)][s][k] = x;
  };

  const body = el("div",{style:"display:flex;flex-direction:column;gap:14px"});

  /* fenêtres de service : masquées dès que le service est fermé tous les jours */
  const champsFenetre = {};
  const blocFenetre = (servId, titre, kStart, kEnd) => {
    const a = inp("time", d[kStart], v=>d[kStart]=v);
    const b = inp("time", d[kEnd],   v=>d[kEnd]=v);
    const ligne = el("div",{class:"row",style:"flex-wrap:nowrap;gap:8px"}, a, el("span",{class:"note"},"→"), b);
    const ferme = el("div",{class:"note",style:"padding:8px 0"},"Fermé toute la semaine — aucun horaire à renseigner.");
    const bloc = el("div",null, el("div",{class:"eyebrow",style:"margin-bottom:6px"}, titre), ligne, ferme);
    champsFenetre[servId] = {ligne, ferme};
    return bloc;
  };
  body.appendChild(el("div",{class:"grid2"},
    blocFenetre("midi","Fenêtre du service de midi","midiStart","midiEnd"),
    blocFenetre("soir","Fenêtre du service du soir","soirStart","soirEnd")));
  function majFenetres(){
    for (const s of SERVICES){
      let ouvert = false;
      for (let j=0;j<7;j++) if (!val(j, s.id, "ferme")) { ouvert = true; break; }
      const c = champsFenetre[s.id];
      if (!c) continue;
      c.ligne.hidden = !ouvert;
      c.ferme.hidden = ouvert;
    }
  }
  body.appendChild(el("p",{class:"note",style:"margin:0"},
    "Un salarié compte pour un service si son horaire chevauche la fenêtre d'au moins une heure. Une coupure compte donc dans les deux, et un renfort venu d'un autre restaurant compte ici."));

  const tab = el("table",{class:"cibletab"});
  const th = el("tr",null,
    el("th",{style:"text-align:left"},"Jour"),
    el("th",{class:"sep",colspan:3},"Midi"),
    el("th",{class:"sep",colspan:3},"Soir"));
  const th2 = el("tr",null, el("th",null,""),
    el("th",{class:"sep"},"Fermé"), el("th",null,"Cuisine"), el("th",null,"Salle"),
    el("th",{class:"sep"},"Fermé"), el("th",null,"Cuisine"), el("th",null,"Salle"));
  tab.appendChild(el("thead",null, th, th2));
  const tb = el("tbody");
  const cases = [];
  JOURS.forEach((nom, j) => {
    const tr = el("tr",null, el("td",{style:"font-weight:600;text-transform:capitalize"}, nom));
    SERVICES.forEach(s => {
      const nums = [];
      const ferme = el("input",{type:"checkbox"});
      ferme.checked = !!val(j, s.id, "ferme");
      const majEtat = () => nums.forEach(i => { i.disabled = ferme.checked; i.style.opacity = ferme.checked ? ".35" : "1"; });
      ferme.onchange = ev => { set(j, s.id, "ferme", ev.target.checked); majEtat(); majFenetres(); };
      tr.appendChild(el("td",{class:"sep",style:"text-align:center"}, ferme));
      ["cui","sal"].forEach(k => {
        const i = inp("number", val(j,s.id,k) || 0, v => set(j, s.id, k, Math.max(0, Number(v)||0)));
        i.min = "0"; i.max = "30";
        nums.push(i);
        cases.push({j, s:s.id, k, i});
        tr.appendChild(el("td",null, i));
      });
      cases.push({j, s:s.id, k:"ferme", c:ferme, majEtat});
      majEtat();
    });
    tb.appendChild(tr);
  });
  tab.appendChild(tb);
  body.appendChild(el("div",{class:"tablewrap",style:"border:0"}, tab));
  majFenetres();
  body.appendChild(el("p",{class:"note",style:"margin:0"},
    "Cochez « Fermé » pour un service que ce restaurant n'assure pas : il ne sera jamais signalé comme incomplet. Une ligne laissée à zéro sans être cochée n'est simplement pas contrôlée."));

  const rafraichir = () => {
    for (const c of cases){
      if (c.i) c.i.value = val(c.j, c.s, c.k) || 0;
      if (c.c) c.c.checked = !!val(c.j, c.s, c.k);
    }
    for (const c of cases) if (c.majEtat) c.majEtat();
    majFenetres();
  };
  const fermerSi = (test) => {
    for (let j=0;j<7;j++) for (const s of SERVICES) if (test(j, s.id)) set(j, s.id, "ferme", true);
    rafraichir();
  };
  body.appendChild(el("div",{class:"row"},
    el("button",{class:"btn",onclick:()=>{
      d.cible = deduireCible(restoId); rafraichir();
      toast("Équipe type déduite des semaines chargées — les services jamais travaillés sont marqués fermés.");
    }},"Déduire du planning existant"),
    el("button",{class:"btn sm",onclick:()=>{ fermerSi((j,s)=> s==="soir"); toast("Tous les soirs marqués fermés."); }},"Fermer tous les soirs"),
    el("button",{class:"btn sm",onclick:()=>{ fermerSi((j)=> j>=5); toast("Samedi et dimanche marqués fermés."); }},"Fermer le week-end"),
    el("button",{class:"btn ghost sm",onclick:()=>{ d.cible = {}; rafraichir(); toast("Grille remise à zéro."); }},"Tout remettre à zéro")));

  openModal({
    title:"Équipe type — "+r.name,
    sub:"Combien de personnes il faut sur chaque service",
    wide:true,
    body,
    actions:[
      {label:"Appliquer aux 8 restaurants", cls:"btn", act: async close => {
        if (!await ask("Copier cette équipe type et ces horaires de service sur les "+S.restaurants.length+" restaurants ? Leurs réglages actuels seront remplacés.","Appliquer partout")) return;
        nettoyerFenetres(d);
        for (const x of S.restaurants) await Store.saveResto(Object.assign({id:x.id}, d));
        close(); render(); toast("Équipe type appliquée à tous les restaurants.");
      }},
      {label:"Annuler", cls:"btn", act:c=>c()},
      {label:"Enregistrer", cls:"btn primary", act: async close => {
        nettoyerFenetres(d);
        await Store.saveResto(Object.assign({id:restoId}, d));
        close(); render(); toast("Équipe type enregistrée pour "+r.name+".");
      }}
    ]
  });
}

/* ---------- vue : planning au mois ---------- */
function dayCode(day, homeId){
  if (!day) return null;
  /* le motif est enregistré mais volontairement masqué sur le planning */
  if (day.kind === "absence") return {txt:"ABS", cls:"abs", title:"Absence"};
  const svc = day.services || [];
  if (!svc.length) return null;
  const ailleurs = svc.some(s => s.restaurantId && s.restaurantId !== homeId);
  const txt = svc.length >= 2 ? "C" : (toMin(svc[0].start) < 15*60 ? "M" : "S");
  const detail = svc.map(s => s.start+"–"+s.end + (s.restaurantId!==homeId ? " @"+restoName(s.restaurantId) : "")).join(" / ");
  return {txt, cls: ailleurs ? "renfort" : "work", title: detail+" · "+fmtHshort(dayPlannedHours(day))+" h"};
}
function monthDates(mk){
  const [y,m] = mk.split("-").map(Number);
  const n = new Date(y, m, 0).getDate();
  return Array.from({length:n}, (_,i) => y+"-"+pad(m)+"-"+pad(i+1));
}

/* ---------- copier la semaine précédente ---------- */
async function dupliquerSemaine(){
  const cible = weekDates(S.weekStart);
  const source = weekDates(ymd(addDays(parseYmd(S.weekStart), -7)));
  const concernes = activeEmployees().filter(e => matchRestoPlanning(e.restaurantId));
  let n = 0, ignores = 0, horsC = 0;
  const plan = [];
  for (const e of concernes){
    const byMonth = {};
    for (let i=0;i<7;i++){
      const src = Store.dayOf(e.id, source[i]);
      if (!src || src.kind !== "work") continue;
      if (!contratCouvre(e, cible[i])) { horsC++; continue; }
      if (Store.dayOf(e.id, cible[i])) { ignores++; continue; }
      const mk = monthKeyOf(cible[i]);
      (byMonth[mk] = byMonth[mk] || {})[cible[i]] = {
        kind:"work", services: JSON.parse(JSON.stringify(src.services||[])),
        actual:null, validated:false, note: src.note||"", absenceType:""
      };
      n++;
    }
    if (Object.keys(byMonth).length) plan.push({e, byMonth});
  }
  if (!n) return toast(ignores ? "Rien à copier : ces journées sont déjà remplies."
    : horsC ? "Rien à copier : ces journées tombent hors contrat."
    : "Aucun service à copier sur la semaine précédente.");
  const ok = await ask(n+" journée"+(n>1?"s":"")+" seront recopiées depuis la semaine du "+frDate(source[0])+"."+
    (ignores ? " "+ignores+" journée(s) déjà remplie(s) seront laissées telles quelles." : "")+
    (horsC ? " "+horsC+" journée(s) hors contrat seront ignorées." : ""), "Copier");
  if (!ok) return;
  for (const p of plan) for (const mk of Object.keys(p.byMonth)) await Store.setDays(p.e.id, mk, p.byMonth[mk]);
  render();
  toast(n+" journée"+(n>1?"s":"")+" copiée"+(n>1?"s":"")+(horsC ? " — "+horsC+" hors contrat ignorée(s)." : "."));
}

function openDayModal(e, date){
  const existing = Store.dayOf(e.id, date);
  const state = existing
    ? JSON.parse(JSON.stringify(existing))
    : {kind:"work", services:[{start:"11:00", end:"15:00", breakMin:0, restaurantId:e.restaurantId}], actual:null, validated:false, absenceType:"CP", note:""};
  if (!state.services || !state.services.length) state.services=[{start:"11:00",end:"15:00",breakMin:0,restaurantId:e.restaurantId}];

  const horsContrat = raisonHorsContrat(e, date);
  const body = el("div");
  if (!horsContrat && reposHabituel(e, date)){
    body.appendChild(el("p",{class:"note",style:"margin:0 0 12px;color:var(--accent-ink)"},
      "Le "+JOURS[(parseYmd(date).getDay()+6)%7]+" n'est pas un jour travaillé pour "+empName(e)+"."));
  }
  if (horsContrat){
    body.appendChild(el("div",{class:"banner",style:"border-color:var(--crit-line);background:var(--crit-soft);color:var(--crit)"},
      el("div",null,
        el("strong",null,"Journée hors contrat."), " ", horsContrat, ". ",
        "Planifier ce jour-là reste possible, mais la saisie vous demandera confirmation. ",
        el("button",{class:"btn sm",style:"margin-left:4px",onclick:()=>{closeModal();openEmpModal(e);}},"Modifier le contrat"))));
  }
  const kindSeg = el("div",{class:"seg"});
  const kinds = [["work","Service"],["absence","Absence"],["off","Repos"]];
  const curKind = existing ? (existing.kind==="absence"?"absence":"work") : "work";
  let kind = curKind;
  function paint(){
    [...kindSeg.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.k===kind ? "true":"false"));
    workBox.hidden = kind!=="work";
    absBox.hidden  = kind!=="absence";
    offBox.hidden  = kind!=="off";
  }
  for (const [k,l] of kinds){
    const b = el("button",{type:"button",onclick:()=>{kind=k;paint();}}, l);
    b.dataset.k = k; kindSeg.appendChild(b);
  }

  /* services */
  const svcList = el("div",{style:"display:flex;flex-direction:column;gap:10px"});
  function renderSvc(){
    svcList.innerHTML="";
    state.services.forEach((s,i)=>{
      const box = el("div",{class:"svcbox"});
      box.append(el("div",{class:"row",style:"justify-content:space-between"},
        el("span",{class:"eyebrow"}, i===0?"Service 1":"Service "+(i+1)+" (coupure)"),
        state.services.length>1 ? el("button",{class:"btn ghost sm",onclick:()=>{state.services.splice(i,1);renderSvc();}},"Retirer") : null
      ));
      const g = el("div",{class:"grid3"});
      g.append(
        fld("Début", inp("time", s.start, v=>s.start=v)),
        fld("Fin", inp("time", s.end, v=>s.end=v)),
        fld("Pause (min)", inp("number", s.breakMin||0, v=>s.breakMin=Number(v)||0))
      );
      box.append(g);
      const sel = el("select",{onchange:ev=>{s.restaurantId=ev.target.value;}});
      S.restaurants.forEach(r=>{
        const o=el("option",{value:r.id}, r.name + (r.id===e.restaurantId?" (rattachement)":""));
        if ((s.restaurantId||e.restaurantId)===r.id) o.selected=true;
        sel.appendChild(o);
      });
      box.append(fld("Restaurant", sel));
      svcList.appendChild(box);
    });
  }
  renderSvc();
  /* répétition sur plusieurs jours / semaines */
  const jourIdx = (parseYmd(date).getDay()+6)%7;
  const lundi = startOfWeek(parseYmd(date));
  const rep = {jours:new Set([jourIdx]), jusqu: ymd(addDays(lundi, 6))};
  const repDays = el("div",{class:"row",style:"gap:4px"});
  JOURS.forEach((j,i)=>{
    const b = el("button",{type:"button",class:"daytog","aria-pressed": i===jourIdx?"true":"false",
      title: j.charAt(0).toUpperCase()+j.slice(1)}, JOURS_ABR[i]);
    b.onclick = () => {
      if (i===jourIdx) return;
      if (rep.jours.has(i)) rep.jours.delete(i); else rep.jours.add(i);
      b.setAttribute("aria-pressed", rep.jours.has(i)?"true":"false");
      majCount();
    };
    if (i===jourIdx) b.classList.add("locked");
    repDays.appendChild(b);
  });
  const jusquInp = inp("date", rep.jusqu, v=>{ rep.jusqu = v; majCount(); });
  jusquInp.classList.add("repjusq");
  jusquInp.min = date;
  jusquInp.max = ymd(addDays(parseYmd(date), 366));
  if (e.endDate && e.endDate > jusquInp.max) jusquInp.max = e.endDate;
  const raccourcis = el("div",{class:"row",style:"gap:6px;margin-top:6px"});
  const poser = (label, d) => raccourcis.appendChild(el("button",{class:"btn ghost sm",
    onclick:()=>{ rep.jusqu = d; jusquInp.value = d; majCount(); }}, label));
  poser("Cette semaine", ymd(addDays(lundi, 6)));
  poser("Ce mois-ci", (()=>{ const dd = parseYmd(date); return ymd(new Date(dd.getFullYear(), dd.getMonth()+1, 0)); })());
  if (e.endDate && e.endDate > date) poser("Jusqu'à la fin du contrat", e.endDate);
  const repCount = el("div",{class:"note"});

  /* toutes les dates candidates, de la semaine en cours jusqu'à l'échéance */
  function repDates(){
    const out = new Set([date]);
    if (rep.jusqu && rep.jusqu >= date){
      let d = new Date(lundi.getTime()); const fin = parseYmd(rep.jusqu); let garde = 0;
      while (d <= fin && garde++ < 400){
        if (rep.jours.has((d.getDay()+6)%7) && ymd(d) <= rep.jusqu) out.add(ymd(d));
        d = addDays(d, 1);
      }
    }
    return [...out].sort();
  }
  /* une journée validée ou une absence n'est jamais écrasée par une répétition */
  function repTri(){
    const res = {ecrire:[], validees:0, absences:0, horsContrat:0, remplaces:0};
    for (const d of repDates()){
      if (d !== date){
        if (!contratCouvre(e, d)) { res.horsContrat++; continue; }
        const j = Store.dayOf(e.id, d);
        if (j && j.kind === "absence") { res.absences++; continue; }
        if (j && j.kind === "work" && j.validated) { res.validees++; continue; }
        if (j) res.remplaces++;
      }
      res.ecrire.push(d);
    }
    return res;
  }
  function majCount(){
    const r = repTri();
    const n = r.ecrire.length;
    const bouts = [n === 1 ? "Cette journée uniquement." : n+" journées seront enregistrées."];
    if (r.remplaces) bouts.push(r.remplaces+" journée(s) déjà remplie(s) seront remplacée(s).");
    if (r.validees) bouts.push(r.validees+" journée(s) validée(s) laissée(s) intacte(s).");
    if (r.absences) bouts.push(r.absences+" absence(s) préservée(s).");
    if (r.horsContrat) bouts.push(r.horsContrat+" journée(s) hors contrat ignorée(s).");
    repCount.textContent = bouts.join(" ");
  }
  majCount();
  const repBox = el("div",{class:"svcbox",style:"background:transparent"},
    el("div",{class:"eyebrow"},"Répéter ce service"),
    el("div",{class:"row",style:"gap:14px;align-items:flex-end"},
      el("label",{class:"fld"}, el("span",null,"Jours de la semaine"), repDays),
      el("label",{class:"fld"}, el("span",null,"Jusqu'au"), jusquInp)),
    raccourcis, repCount);

  const workBox = el("div",{style:"display:flex;flex-direction:column;gap:12px"});
  workBox.append(svcList,
    el("button",{class:"btn sm",style:"align-self:flex-start",onclick:()=>{state.services.push({start:"19:00",end:"23:00",breakMin:0,restaurantId:e.restaurantId});renderSvc();}},"+ Ajouter une coupure"),
    (()=> {
      const actInp = inp("number", (state.actual===null||state.actual===undefined)?"":state.actual, v=> state.actual = (v===""? null : Number(v)));
      actInp.step="0.25"; actInp.placeholder="laisser vide = conforme au planning";
      const chk = el("input",{type:"checkbox"}); chk.checked=!!state.validated; chk.onchange=ev=>state.validated=ev.target.checked;
      const lab = el("label",{class:"row",style:"gap:8px;font-size:13px;cursor:pointer"}, chk, el("span",null,"Heures vérifiées et validées"));
      return el("div",{class:"grid2"}, fld("Heures réellement effectuées", actInp), el("div",{style:"display:flex;align-items:flex-end"}, lab));
    })(),
    repBox
  );

  const absSel = el("select");
  ABSENCES.forEach(a=>{ const o=el("option",{value:a.id}, a.label+(a.paid?" (payée)":"")); if(state.absenceType===a.id)o.selected=true; absSel.appendChild(o); });
  absSel.onchange = ev => { state.absenceType = ev.target.value; per.toute = absCalendaire(state.absenceType); majAbsence(); };
  const per = {du: date, au: date, toute: absCalendaire(state.absenceType)};
  const absApercu = el("div",{class:"note",style:"grid-column:1/-1"});
  const chkToute = el("input",{type:"checkbox"});
  const labToute = el("label",{class:"row",style:"gap:8px;cursor:pointer;grid-column:1/-1;font-size:13px"},
    chkToute, el("span",null,"Marquer aussi les jours de repos compris dans la période"));
  const majAbsence = () => {
    chkToute.checked = per.toute;
    const j = joursPeriodeAbsence(e, per.du, per.au, per.toute);
    if (!j.calendaires.length){
      absApercu.textContent = per.au < per.du
        ? "La date de fin précède la date de début."
        : j.reposIgnores
          ? "Aucune journée travaillée sur cette période — "+j.reposIgnores+" jour(s) de repos."
          : "Aucune journée couverte par le contrat sur cette période.";
      return;
    }
    const n = j.calendaires.length;
    const bouts = [];
    if (per.toute){
      bouts.push(n+" jour"+(n>1?"s":"")+" calendaire"+(n>1?"s":"")+", dont "+j.perdues+" journée"+(j.perdues>1?"s":"")+" de travail perdue"+(j.perdues>1?"s":""));
    } else {
      bouts.push(n+" journée"+(n>1?"s":"")+" de travail marquée"+(n>1?"s":"")+" absente"+(n>1?"s":""));
      if (j.reposIgnores) bouts.push(j.reposIgnores+" jour"+(j.reposIgnores>1?"s":"")+" de repos ignoré"+(j.reposIgnores>1?"s":""));
    }
    if (j.remplaces) bouts.push(j.remplaces+" service"+(j.remplaces>1?"s":"")+" remplacé"+(j.remplaces>1?"s":""));
    if (j.horsContrat) bouts.push(j.horsContrat+" journée(s) hors contrat ignorée(s)");
    absApercu.textContent = bouts.join(" · ")+".";
  };
  chkToute.onchange = ev => { per.toute = ev.target.checked; majAbsence(); };
  const absDu = inp("date", per.du, v=>{ per.du = v; if (per.au < v) { per.au = v; absAu.value = v; } majAbsence(); });
  const absAu = inp("date", per.au, v=>{ per.au = v; majAbsence(); });
  const absBox = el("div",{class:"grid3"},
    fld("Motif", absSel), fld("Du", absDu), fld("Au", absAu), labToute, absApercu);
  majAbsence();
  const offBox = el("div",{class:"note"},"Le salarié n'est pas planifié ce jour-là. Enregistrer effacera le service ou l'absence existant.");

  const noteInp = el("textarea",{placeholder:"Remarque (optionnel)"}); noteInp.value = state.note||"";
  noteInp.oninput = ev => state.note = ev.target.value;

  body.append(kindSeg, el("div",{style:"height:14px"}), workBox, absBox, offBox, el("div",{style:"height:2px"}), fld("Note", noteInp));
  paint();

  openModal({
    title: empName(e),
    sub: frDateLong(date) + " · " + (restoName(e.restaurantId)),
    body,
    actions: [
      existing ? {label:"Effacer", cls:"btn danger", act: async close => { await Store.setDay(e.id, date, null); close(); toast("Journée effacée."); }} : null,
      {label:"Annuler", cls:"btn", act: close => close()},
      {label:"Enregistrer", cls:"btn primary", act: async close => {
        if (kind==="off"){ await Store.setDay(e.id, date, null); close(); return toast("Repos enregistré."); }
        if (kind==="absence"){
          const j = joursPeriodeAbsence(e, per.du, per.au, per.toute);
          if (!j.calendaires.length) return toast(per.au < per.du
            ? "La date de fin précède la date de début."
            : "Aucune journée de cette période n'est couverte par le contrat.");
          if (j.calendaires.length > 1 && !await ask(
            "Enregistrer une absence du "+frDate(per.du)+" au "+frDate(per.au)+" pour "+empName(e)+" ? "
            + (per.toute
                ? j.calendaires.length+" jours calendaires, dont "+j.perdues+" journée(s) de travail perdue(s)."
                : j.calendaires.length+" journée(s) de travail"+(j.reposIgnores ? ", "+j.reposIgnores+" jour(s) de repos ignoré(s)." : "."))
            + (j.remplaces ? " "+j.remplaces+" service(s) seront remplacés." : ""), "Enregistrer")) return;
          const parMois = {};
          for (const x of j.calendaires){
            const mk = monthKeyOf(x.date);
            (parMois[mk] = parMois[mk] || {})[x.date] = {kind:"absence", absenceType:state.absenceType,
              note:state.note||"", services:[], actual:0, validated:true, perdue: x.perdue};
          }
          for (const mk of Object.keys(parMois)) await Store.setDays(e.id, mk, parMois[mk]);
          render(); close();
          return toast(j.calendaires.length > 1
            ? "Absence du "+frDate(per.du)+" au "+frDate(per.au)+" enregistrée — "+j.perdues+" journée(s) de travail perdue(s)."
              + (j.reposIgnores ? " "+j.reposIgnores+" jour(s) de repos ignoré(s)." : "")
            : "Absence enregistrée."
            + (j.horsContrat ? " "+j.horsContrat+" journée(s) hors contrat ignorée(s)." : ""));
        }
        for (const s of state.services){
          if (!s.start || !s.end) return toast("Renseignez les heures de début et de fin.");
          if (!s.restaurantId) s.restaurantId = e.restaurantId;
        }
        const entry = {kind:"work", services:state.services, actual: state.actual, validated: !!state.validated, note: state.note||"", absenceType:""};
        const tri = repTri();
        const toutes = tri.ecrire;
        if (toutes.length <= 1){
          if (horsContrat && !await ask(
            "Le contrat de "+empName(e)+" ne couvre pas le "+frDateLong(date)+" ("+horsContrat+"). Planifier ce service quand même ?","Planifier")) return;
          await Store.setDay(e.id, date, entry);
          close(); return toast("Service enregistré.");
        }
        const cibles = toutes;
        /* la journée éditée garde ses heures réelles ; les autres repartent à zéro */
        const byMonth = {};
        for (const d of cibles){
          const mk = monthKeyOf(d);
          (byMonth[mk] = byMonth[mk] || {})[d] = d === date
            ? entry
            : {kind:"work", services: JSON.parse(JSON.stringify(state.services)), actual:null, validated:false, note: state.note||"", absenceType:""};
        }
        for (const mk of Object.keys(byMonth)) await Store.setDays(e.id, mk, byMonth[mk]);
        render();
        const gardees = [];
        if (tri.validees) gardees.push(tri.validees+" validée(s)");
        if (tri.absences) gardees.push(tri.absences+" absence(s)");
        if (tri.horsContrat) gardees.push(tri.horsContrat+" hors contrat");
        close(); toast(cibles.length+" journées enregistrées"
          + (gardees.length ? " — "+gardees.join(", ")+" laissée(s) intacte(s)." : "."));
      }}
    ].filter(Boolean)
  });
}

/* Liste déroulante à cases. Générique : le planning et la paie ont chacun
   leur propre sélection, filtrer la paie ne touche pas le planning. */
function restoDropdown(cfg){
  const tout = !cfg.ids.length || cfg.ids.includes("all");
  const sel = tout ? S.restaurants.map(r => r.id)
                   : cfg.ids.filter(id => S.restaurants.some(r => r.id === id));
  const tousLabel = cfg.tousLabel || "Tous les restaurants";
  const unLabel = cfg.unLabel || "restaurant";
  const wrap = el("div",{class:"restodrop"});
  const etiquette = tout ? tousLabel
    : sel.length === 0 ? "Aucun "+unLabel
    : sel.length === 1 ? ((restoById(sel[0])||{}).name || "1 "+unLabel)
    : sel.length+" "+unLabel+"s";
  wrap.appendChild(el("button",{class:"btn restodrop-btn",type:"button",
    "aria-expanded": cfg.open ? "true" : "false",
    onclick: ev => { ev.stopPropagation(); cfg.setOpen(!cfg.open); }},
    el("span",null, etiquette),
    el("span",{class:"restodrop-caret"}, cfg.open ? "▲" : "▼")));
  if (!cfg.open) return wrap;

  const panneau = el("div",{class:"restodrop-panel",role:"group","aria-label":tousLabel,
    onclick: ev => ev.stopPropagation()});
  const all = el("input",{type:"checkbox"});
  all.checked = tout;
  all.onchange = ev => cfg.setIds(ev.target.checked ? ["all"] : []);
  panneau.appendChild(el("label",{class:"restodrop-item tous"}, all, el("span",null, tousLabel)));
  S.restaurants.forEach(r => {
    const chk = el("input",{type:"checkbox"});
    chk.checked = sel.includes(r.id);
    chk.onchange = ev => {
      const next = ev.target.checked ? sel.concat(r.id) : sel.filter(id => id !== r.id);
      cfg.setIds(next.length === S.restaurants.length ? ["all"] : next);
    };
    panneau.appendChild(el("label",{class:"restodrop-item"}, chk, el("span",null, r.name)));
  });
  panneau.appendChild(el("div",{class:"restodrop-foot"},
    el("button",{class:"btn ghost sm",onclick:()=>cfg.setIds(["all"])},"Tout cocher"),
    el("button",{class:"btn ghost sm",onclick:()=>cfg.setIds([])},"Tout décocher"),
    el("button",{class:"btn sm",style:"margin-left:auto",onclick:()=>cfg.setOpen(false)},"Fermer")));
  wrap.appendChild(panneau);
  return wrap;
}
function restoChecks(){
  if (!Array.isArray(S.filterRestos) || !S.filterRestos.length) S.filterRestos = ["all"];
  return restoDropdown({
    ids: S.filterRestos,

  });
}

  });

/* suffixe de nom de fichier : le restaurant quand il n'y en a qu'un */
function suffixePaie(){
  const sel = payRestosSel();
  const tous = !Array.isArray(S.payRestos) || !S.payRestos.length || S.payRestos.includes("all");
  if (tous || sel.length !== 1) return "";
  return "-" + sel[0].name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

async function archiver(e){
  if (!await ask("Archiver "+empName(e)+" ? Il disparaîtra du planning, des remplacements et du récap de paie. "+
    "Son historique est conservé et vous pourrez le réactiver depuis sa fiche.", "Archiver")) return;
  await Store.saveEmp(Object.assign({}, e, {active:false}));
  render(); toast(empName(e)+" archivé.");
}
async function archiverTous(liste){
  if (!await ask("Archiver "+liste.length+" salarié(s) dont le contrat est arrivé à terme ? "+
    "Leur historique est conservé.", "Tout archiver")) return;
  for (const e of liste) await Store.saveEmp(Object.assign({}, e, {active:false}));
  render(); toast(liste.length+" salarié(s) archivé(s).");
}

async function retirerHorsContrat(e, dates){
  if (!await ask("Retirer "+dates.length+" service(s) du planning de "+empName(e)+
    ", planifié(s) en dehors de son contrat ?", "Retirer")) return;
  const parMois = {};
  for (const d of dates) (parMois[monthKeyOf(d)] = parMois[monthKeyOf(d)] || []).push(d);
  let n = 0;
  for (const mk of Object.keys(parMois)) n += await Store.removeDays(e.id, mk, parMois[mk]);
  render();
  toast(n+" service(s) retiré(s) du planning.");
}

/* ============================================================
   Planning d'alternance : rythme, import de fichier, texte collé
   ============================================================ */
const MOIS_ABR = {"janv":0,"jan":0,"févr":1,"fev":1,"fév":1,"mars":2,"avr":3,"mai":4,"juin":5,
  "juil":6,"jui":6,"août":7,"aout":7,"sept":8,"sep":8,"oct":9,"nov":10,"déc":11,"dec":11};

/* Repère toutes les dates d'un texte, dans l'ordre de lecture.
   L'année manquante est déduite du contexte : dès qu'un mois recule par rapport
   au précédent, on bascule sur l'année suivante — un calendrier scolaire qui va
   de septembre à juin est donc réparti correctement sur deux années civiles.
   Une ligne contenant deux dates et un marqueur d'intervalle est développée. */
function parseDatesFromText(text, anneeDefaut){
  const MOISPAT = "janv|jan|févr|fev|fév|mars|avr|mai|juin|juil|jui|août|aout|sept|sep|oct|nov|déc|dec";
  const RE_PLAGE = new RegExp("(\\d{1,2})(?:er)?\\s*(?:au|à|-|–|—|→|->)\\s*(\\d{1,2})(?:er)?\\s+("+MOISPAT+")[a-zéû.]*\\.?\\s*(\\d{4})?", "gi");
  const RE_MOIS  = new RegExp("(\\d{1,2})(?:er)?\\s+("+MOISPAT+")[a-zéû.]*\\.?\\s*(\\d{4})?", "gi");
  const RE_ISO   = /\b(\d{4})-(\d{2})-(\d{2})\b/g;
  const RE_NUM   = /(?<![\d\/.\-])(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/g;
  const RE_NUM2  = /(?<![\d\/.\-])(\d{1,2})[\/\-.](\d{1,2})(?![\/\-.]?\d)/g;

  const etat = {annee: Number(anneeDefaut) || new Date().getFullYear(), dernierMois: null};
  const resoudre = (mois, anneeExplicite) => {
    if (anneeExplicite) etat.annee = anneeExplicite;
    else if (etat.dernierMois !== null && mois < etat.dernierMois) etat.annee++;
    etat.dernierMois = mois;
    return etat.annee;
  };
  const out = new Set();
  const ajouter = (annee, mois, jour) => {
    if (jour < 1 || jour > 31 || mois < 0 || mois > 11) return;
    const dt = new Date(annee, mois, jour);
    if (dt.getMonth() !== mois || dt.getDate() !== jour) return; /* 30 février, etc. */
    out.add(ymd(dt));
  };

  for (const ligne of String(text||"").split(/[\r\n]+/)){
    let m, traiteParPlage = false;

    RE_PLAGE.lastIndex = 0;
    while ((m = RE_PLAGE.exec(ligne))){
      const mois = MOIS_ABR[m[3].toLowerCase()];
      if (mois === undefined) continue;
      const j1 = Number(m[1]), j2 = Number(m[2]);
      if (j2 < j1) continue;
      const a = resoudre(mois, m[4] ? Number(m[4]) : null);
      for (let j = j1; j <= j2; j++) ajouter(a, mois, j);
      traiteParPlage = true;
    }
    if (traiteParPlage) continue;

    const jetons = [], couvert = [];
    RE_ISO.lastIndex = 0;
    while ((m = RE_ISO.exec(ligne))){
      jetons.push({pos:m.index, jour:Number(m[3]), mois:Number(m[2])-1, annee:Number(m[1])});
      couvert.push([m.index, m.index + m[0].length]);
    }
    RE_NUM.lastIndex = 0;
    while ((m = RE_NUM.exec(ligne))){
      let a = Number(m[3]); if (a < 100) a += a < 70 ? 2000 : 1900;
      jetons.push({pos:m.index, jour:Number(m[1]), mois:Number(m[2])-1, annee:a});
      couvert.push([m.index, m.index + m[0].length]);
    }
    RE_NUM2.lastIndex = 0;
    while ((m = RE_NUM2.exec(ligne))){
      if (couvert.some(([d0,f0]) => m.index >= d0 && m.index < f0)) continue;
      jetons.push({pos:m.index, jour:Number(m[1]), mois:Number(m[2])-1, annee:null});
    }
    RE_MOIS.lastIndex = 0;
    while ((m = RE_MOIS.exec(ligne))){
      const mois = MOIS_ABR[m[2].toLowerCase()];
      if (mois === undefined) continue;
      if (couvert.some(([d0,f0]) => m.index >= d0 && m.index < f0)) continue;
      jetons.push({pos:m.index, jour:Number(m[1]), mois, annee: m[3] ? Number(m[3]) : null});
    }

    const propres = [];
    jetons.sort((a,b)=>a.pos-b.pos);
    for (const j of jetons){
      if (j.jour < 1 || j.jour > 31 || j.mois < 0 || j.mois > 11) continue;
      if (propres.some(p => Math.abs(p.pos - j.pos) < 2)) continue;
      propres.push(j);
    }
    if (!propres.length) continue;

    const marqueur = /\b(?:au|à|jusqu\w*)\b|->|→|–|—|\s-\s/i.test(ligne);
    if (marqueur && propres.length >= 2){
      const p0 = propres[0], p1 = propres[propres.length-1];
      const a0 = resoudre(p0.mois, p0.annee);
      const a1 = resoudre(p1.mois, p1.annee);
      let d = new Date(a0, p0.mois, p0.jour);
      const fin = new Date(a1, p1.mois, p1.jour);
      let garde = 0;
      while (d <= fin && garde++ < 400){ out.add(ymd(d)); d = addDays(d,1); }
    } else {
      for (const p of propres) ajouter(resoudre(p.mois, p.annee), p.mois, p.jour);
    }
  }
  return [...out].sort();
}

/* Regroupe une liste de dates en plages lisibles */
function grouperPlages(dates){
  const out = [];
  let i = 0;
  while (i < dates.length){
    let j = i;
    while (j+1 < dates.length && daysBetween(dates[j], dates[j+1]) === 1) j++;
    out.push(i === j ? frDate(dates[i]) : "du "+frDate(dates[i])+" au "+frDate(dates[j]));
    i = j+1;
  }
  return out;
}

function openAlternanceModal(empPre){
  const apprentis = activeEmployees().slice().sort((a,b)=>
    (a.contractType==="APPR"?0:1)-(b.contractType==="APPR"?0:1) || empName(a).localeCompare(empName(b)));
  if (!apprentis.length){
    return toast("Ajoutez d'abord un salarié dans « Équipe & contrats ».");
  }
  const A = {
    empId: (empPre && empPre.id) || apprentis[0].id,
    mode: "rythme",
    dates: [],
    source: "",
    debut: ymd(new Date()),
    fin: ymd(new Date(new Date().getFullYear()+1, 5, 30)),
    jours: new Set([0,1]),
    anneeBase: new Date().getFullYear(),
    rythme: "jours",
    semEcole: 1, semEntreprise: 3, premiereSemaine: ymd(startOfWeek(new Date()))
  };

  const body = el("div",{style:"display:flex;flex-direction:column;gap:14px"});

  /* salarié */
  const empSel = el("select");
  apprentis.forEach(e => {
    const o = el("option",{value:e.id}, empName(e)+" — "+contratLabel(e.contractType)+" · "+restoName(e.restaurantId));
    if (e.id === A.empId) o.selected = true;
    empSel.appendChild(o);
  });
  const dejaBox = el("div",{class:"note"});
  function majDeja(){
    let n = 0;
    for (const mk of Object.keys(S.months)){
      const rec = (S.months[mk]||{})[A.empId];
      if (!rec || !rec.days) continue;
      for (const d in rec.days) if (rec.days[d].absenceType === "FORM") n++;
    }
    dejaBox.innerHTML = "";
    dejaBox.append(n
      ? document.createTextNode(n+" journée"+(n>1?"s":"")+" de formation déjà enregistrée"+(n>1?"s":"")+" pour ce salarié sur les mois chargés.")
      : document.createTextNode("Aucune journée de formation enregistrée pour ce salarié."));
    if (n) dejaBox.append(" ", el("button",{class:"btn sm",style:"margin-left:4px",onclick:()=>supprimerFormation(A.empId)},"Les supprimer"));
  }
  empSel.onchange = ev => { A.empId = ev.target.value; majDeja(); majApercu(); };
  majDeja();
  body.append(fld("Salarié", empSel), dejaBox);

  /* onglets */
  const seg = el("div",{class:"seg"});
  const boxes = {};
  [["rythme","Rythme régulier"],["texte","Coller le calendrier"]].forEach(([k,l])=>{
    const b = el("button",{type:"button",onclick:()=>{A.mode=k;peindre();}}, l);
    b.dataset.k = k; seg.appendChild(b);
  });
  function peindre(){
    [...seg.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.k===A.mode ? "true":"false"));
    for (const k in boxes) boxes[k].hidden = (k !== A.mode);
  }

  /* --- mode rythme --- */
  const jourBtns = el("div",{class:"row",style:"gap:4px"});
  JOURS.forEach((j,i)=>{
    const b = el("button",{type:"button",class:"daytog","aria-pressed":A.jours.has(i)?"true":"false",title:j}, JOURS_ABR[i]);
    b.onclick = () => { A.jours.has(i) ? A.jours.delete(i) : A.jours.add(i);
      b.setAttribute("aria-pressed", A.jours.has(i)?"true":"false"); calculerRythme(); };
    jourBtns.appendChild(b);
  });
  const segRythme = el("div",{class:"seg"});
  [["jours","Jours fixes chaque semaine"],["semaines","Semaines alternées"]].forEach(([k,l])=>{
    const b = el("button",{type:"button",onclick:()=>{A.rythme=k;peindreRythme();calculerRythme();}}, l);
    b.dataset.r = k; segRythme.appendChild(b);
  });
  const boxJours = el("div",null, fld("Jours passés à l'école", jourBtns));
  const inEcole = inp("number", A.semEcole, v=>{A.semEcole=Math.max(1,Number(v)||1);calculerRythme();});
  const inEntr  = inp("number", A.semEntreprise, v=>{A.semEntreprise=Math.max(0,Number(v)||0);calculerRythme();});
  inEcole.min = "1"; inEntr.min = "0";
  const boxSem = el("div",{class:"grid3"},
    fld("Semaines à l'école", inEcole),
    fld("Puis semaines en entreprise", inEntr),
    fld("1re semaine d'école (lundi)", inp("date", A.premiereSemaine, v=>{A.premiereSemaine=ymd(startOfWeek(parseYmd(v)));calculerRythme();})));
  function peindreRythme(){
    [...segRythme.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.r===A.rythme ? "true":"false"));
    boxJours.hidden = A.rythme !== "jours";
    boxSem.hidden   = A.rythme !== "semaines";
  }
  function calculerRythme(){
    const d0 = parseYmd(A.debut), d1 = parseYmd(A.fin);
    const out = [];
    if (d1 < d0){ A.dates = []; A.source = "Période invalide."; return majApercu(); }
    if (A.rythme === "jours"){
      let d = new Date(d0.getTime()), garde = 0;
      while (d <= d1 && garde++ < 800){
        if (A.jours.has((d.getDay()+6)%7)) out.push(ymd(d));
        d = addDays(d,1);
      }
      A.source = "Rythme : "+[...A.jours].sort().map(i=>JOURS[i]).join(", ")+" chaque semaine.";
    } else {
      const cycle = A.semEcole + A.semEntreprise;
      const base = parseYmd(A.premiereSemaine);
      let d = new Date(d0.getTime()), garde = 0;
      while (d <= d1 && garde++ < 800){
        const semIdx = Math.floor(daysBetween(ymd(base), ymd(startOfWeek(d))) / 7);
        const pos = ((semIdx % cycle) + cycle) % cycle;
        if (pos < A.semEcole && (d.getDay()+6)%7 < 5) out.push(ymd(d));
        d = addDays(d,1);
      }
      A.source = "Rythme : "+A.semEcole+" semaine(s) école / "+A.semEntreprise+" semaine(s) entreprise, du lundi au vendredi.";
    }
    A.dates = out;
    majApercu();
  }
  boxes.rythme = el("div",{style:"display:flex;flex-direction:column;gap:12px"},
    el("div",{class:"grid2"},
      fld("Du", inp("date", A.debut, v=>{A.debut=v;calculerRythme();})),
      fld("Au", inp("date", A.fin, v=>{A.fin=v;calculerRythme();}))),
    segRythme, boxJours, boxSem);

  /* --- mode fichier --- */
  /* --- mode texte --- */
  const ta = el("textarea",{rows:7,placeholder:"Collez ici les périodes d'école, une par ligne :\n07/09/2026 au 11/09/2026\ndu 5 au 9 octobre 2026\n16 nov. 2026 – 20 nov. 2026\n14/12/2026"});
  ta.style.minHeight = "150px";
  const txtEtat = el("div",{class:"note"});
  const anneeInp = inp("number", A.anneeBase, v=>{ A.anneeBase = Number(v) || new Date().getFullYear(); });
  anneeInp.min = "2020"; anneeInp.max = "2099"; anneeInp.style.width = "110px";
  const btnAnalyser = el("button",{class:"btn",onclick:()=>{
    A.dates = parseDatesFromText(ta.value, A.anneeBase);
    A.source = "Texte collé";
    A.dernierTexte = ta.value;
    txtEtat.textContent = A.dates.length
      ? A.dates.length+" date(s) reconnue(s). Vérifiez les années dans l'aperçu."
      : "Aucune date reconnue. Vérifiez le format, ou essayez l'interprétation par Claude.";
    majApercu();
  }},"Analyser les dates");
  const btnClaude = el("button",{class:"btn",hidden:true},"Interpréter avec Claude");
  const analyserAvecClaude = async (source, etat) => {
    const texte = (source() || "").slice(0, 20000);
    if (!texte.trim()) return toast("Chargez ou collez d'abord le calendrier.");
    btnClaude.disabled = true;
    etat.textContent = "Analyse en cours… cela peut prendre une trentaine de secondes.";
    try {
      const sample = await window.claude.use("sample");
      const r = await sample.json([{role:"user", content:
        "Voici le calendrier d'alternance d'un apprenti, extrait d'un document. Identifie toutes les journées où l'apprenti est À L'ÉCOLE (et non en entreprise).\n"+
        "Réponds UNIQUEMENT par du JSON de la forme {\"jours\":[\"AAAA-MM-JJ\", ...]}, sans commentaire. "+
        "Développe les périodes en journées individuelles, du lundi au vendredi uniquement. "+
        "L'année scolaire commence en septembre "+A.anneeBase+" : les mois de janvier à août sans année précisée appartiennent donc à "+(A.anneeBase+1)+".\n\n---\n"+texte}],
        {modelTier:"default"});
      const jours = (r && Array.isArray(r.jours) ? r.jours : []).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
      A.dates = [...new Set(jours)].sort();
      A.source = "Interprété par Claude — à vérifier";
      etat.textContent = A.dates.length ? A.dates.length+" journée(s) identifiée(s). Vérifiez l'aperçu avant d'écrire." : "Claude n'a identifié aucune journée. Reformulez, ou saisissez le rythme à la main.";
      majApercu();
    } catch(err){
      etat.textContent = "Interprétation indisponible"+(err && err.code ? " ("+err.code+")" : "")+". Utilisez « Analyser les dates » ou l'onglet Rythme.";
    }
    btnClaude.disabled = false;
  };
  btnClaude.onclick = () => analyserAvecClaude(()=> ta.value, txtEtat);
  boxes.texte = el("div",{style:"display:flex;flex-direction:column;gap:10px"},
    ta,
    el("div",{class:"row",style:"align-items:flex-end"},
      fld("Année de la rentrée", anneeInp), btnAnalyser, btnClaude),
    el("div",{class:"note"},"Les périodes sans année écrite sont rattachées à cette rentrée, puis basculent automatiquement sur l'année suivante dès que les mois repartent en janvier."),
    txtEtat);
  (async () => { try { if (window.claude && window.claude.use && await window.claude.use("sample")) btnClaude.hidden = false; } catch(e){} })();

  /* --- aperçu commun --- */
  const apercu = el("div",{class:"card card-pad",style:"background:var(--surface-2)"});
  function majApercu(){
    apercu.innerHTML = "";
    apercu.append(el("div",{class:"eyebrow",style:"margin-bottom:8px"},"Aperçu avant écriture"));
    if (!A.dates.length){
      apercu.append(el("div",{class:"note"},"Aucune journée pour l'instant."));
      valider.disabled = true;
      return;
    }
    valider.disabled = false;
    const emp = empById(A.empId);
    const horsC = A.dates.filter(d => !contratCouvre(emp, d)).length;
    const occupees = A.dates.filter(d => { const x = Store.dayOf(A.empId, d); return x && x.absenceType !== "FORM"; }).length;
    const plages = grouperPlages(A.dates);
    apercu.appendChild(el("div",null,
      el("div",{style:"font-family:var(--display);font-weight:600;font-size:15px"},
        A.dates.length+" journée"+(A.dates.length>1?"s":"")+" d'école, du "+frDate(A.dates[0])+" au "+frDate(A.dates[A.dates.length-1])),
      A.source ? el("div",{class:"note",style:"margin-top:2px"}, A.source) : null,
      el("div",{style:"display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:150px;overflow:auto"},
        plages.slice(0,60).map(p => el("span",{class:"pill neutral"}, p))),
      plages.length > 60 ? el("div",{class:"note",style:"margin-top:6px"}, "… et "+(plages.length-60)+" autres périodes.") : null,
      occupees ? el("div",{class:"note",style:"margin-top:10px;color:var(--warn)"},
        occupees+" de ces journées portent déjà un service ou une autre absence : elles seront remplacées.") : null,
      horsC ? el("div",{class:"note",style:"margin-top:6px;color:var(--crit)"},
        horsC+" de ces journées ne sont pas couvertes par le contrat de "+empName(emp)+" : elles seront ignorées.") : null
    ));
  }

  const valider = el("button",{class:"btn primary",disabled:true},"Écrire dans le planning");
  valider.onclick = async () => {
    if (!A.dates.length) return;
    const emp = empById(A.empId);
    const retenues = A.dates.filter(d => contratCouvre(emp, d));
    const horsC = A.dates.length - retenues.length;
    if (!retenues.length) return toast("Aucune de ces journées n'est couverte par le contrat de "+empName(emp)+".");
    const ok = await ask("Écrire "+retenues.length+" journée(s) de formation dans le planning de "+
      empName(emp)+" ? Les services existants sur ces journées seront remplacés."+
      (horsC ? " "+horsC+" journée(s) hors contrat seront ignorées." : ""), "Écrire");
    if (!ok) return;
    valider.disabled = true; valider.textContent = "Écriture…";
    const byMonth = {};
    for (const d of retenues){
      const mk = monthKeyOf(d);
      (byMonth[mk] = byMonth[mk] || {})[d] = {kind:"absence", absenceType:"FORM", services:[], actual:0, validated:true, note:"École"};
    }
    for (const mk of Object.keys(byMonth)) await Store.setDays(A.empId, mk, byMonth[mk]);
    Store.syncMonths(); render(); closeModal();
    toast(retenues.length+" journée(s) d'école enregistrée(s) pour "+empName(emp)+
      (horsC ? " — "+horsC+" hors contrat ignorée(s)." : "."));
  };

  peindre(); peindreRythme(); calculerRythme();
  body.append(seg, boxes.rythme, boxes.texte, apercu);
  peindre();

  openModal({
    title:"Planning d'alternance",
    sub:"Bloquer d'un coup les journées passées à l'école",
    body,
    actions:[{label:"Fermer", cls:"btn", act:c=>c()}, {el: valider}]
  });
}

async function supprimerFormation(empId){
  const cible = [];
  for (const mk of Object.keys(S.months)){
    const rec = (S.months[mk]||{})[empId];
    if (!rec || !rec.days) continue;
    const dates = Object.keys(rec.days).filter(d => rec.days[d].absenceType === "FORM");
    if (dates.length) cible.push({mk, dates});
  }
  const total = cible.reduce((s,c)=>s+c.dates.length,0);
  if (!total) return toast("Aucune journée de formation à supprimer.");
  const ok = await ask("Supprimer "+total+" journée(s) de formation de "+empName(empById(empId))+
    " ? Seuls les mois actuellement chargés sont concernés.", "Supprimer");
  if (!ok) return;
  for (const c of cible) await Store.removeDays(empId, c.mk, c.dates);
  render(); closeModal();
  toast(total+" journée(s) supprimée(s).");
}

  const autreWrap = fld("Intitulé exact du poste", autreInp);

    if (ev.target.value === "__autre"){ autreWrap.hidden = false; d.role = autreInp.value; autreInp.focus(); }
    else { autreWrap.hidden = true; d.role = ev.target.value;
      const p = POSTES.find(x=>x.label===d.role);

    d.origine ? el("p",{class:"note",style:"margin:0"}, "Origine : "+d.origine) : null,
    fld("Note", noteInp));

  openModal({

    body,

      {label:"Annuler", cls:"btn", act:c=>c()},

async function affecter(e){
  const existing = Store.dayOf(e.id, R.date);
  const svc = {start:R.start, end:R.end, breakMin:0, restaurantId:R.restoId};
  let entry;
  if (existing && existing.kind==="work"){
    entry = Object.assign({}, existing, {services: existing.services.concat([svc])});
  } else {
    entry = {kind:"work", services:[svc], actual:null, validated:false, note:"Renfort "+restoName(R.restoId), absenceType:""};
  }
  await Store.setDay(e.id, R.date, entry);
  toast(empName(e)+" affecté à "+restoName(R.restoId)+" le "+frDate(R.date)+".");
}

function moisDisponibles(){
  const set = new Set(Object.keys(S.months || {}).filter(k => /^\d{4}-\d{2}$/.test(k)));
  const now = new Date();
  for (let i = -12; i <= 2; i++) set.add(monthKey(new Date(now.getFullYear(), now.getMonth()+i, 1)));
  set.add(monthKey(now)); set.add(S.payMonth);
  return [...set].sort();

  const shift = n => { const [y,m]=S.payMonth.split("-").map(Number); aller(monthKey(new Date(y,m-1+n,1))); };
  const sel = el("select",{style:"width:auto;min-width:158px;text-transform:capitalize"});
  moisDisponibles().forEach(mk => {
    const o = el("option",{value:mk}, moisLabel(mk));
    if (mk === S.payMonth) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = ev => aller(ev.target.value);
  const courant = monthKey(new Date());
  /* append() est natif : un null s'y afficherait littéralement */
  box.append(...[
    el("button",{class:"btn sm",onclick:()=>shift(-1),title:"Période précédente"},"◀"),
    sel,
    el("button",{class:"btn sm",onclick:()=>shift(1),title:"Période suivante"},"▶"),
    S.payMonth !== courant
      ? el("button",{class:"btn ghost sm",title:"Revenir à la période en cours",onclick:()=>aller(courant)},"Période en cours")
      : null
  ].filter(Boolean));
  return box;
}

/* ---------- clôture de mois : ce qui se tape dans Staff & Go ---------- */

/* Staff & Go affiche NOM Prénom, des dates en jj/mm/aaaa et des heures décimales à point. */
function nomStaff(e){ return (((e.lastName||"").trim().toUpperCase()+" "+(e.firstName||"").trim()).trim()) || "Sans nom"; }
function fr8(s){ const p = String(s||"").split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : (s||""); }
function fmtStaff(h){ return String(Math.round((h||0)*100)/100); }
function triNom(a,b){ return nomStaff(a).localeCompare(nomStaff(b),"fr"); }

/* Périodes d'absence à déclarer : une ligne par plage, dates calendaires réelles.
   Les jours de repos qui séparent deux journées d'une même absence sont pontés —
   sinon des congés payés à cheval sur un week-end sortiraient en deux morceaux.
   Les journées d'école des alternants (motif interne) sont exclues : c'est du
   temps de travail payé, pas une absence à saisir en paie. */
function absencePeriodes(e, mk){
  const [y,mo] = mk.split("-").map(Number);
  const debutMois = ymd(new Date(y,mo-1,1)), finMois = ymd(new Date(y,mo,0));
  const parMotif = {};
  for (let d=new Date(y,mo-1,1); ymd(d)<=finMois; d=addDays(d,1)){
    const ds = ymd(d), j = Store.dayOf(e.id, ds);
    if (!j || j.kind !== "absence") continue;
    const t = j.absenceType || "";
    if (!t || absInterne(t)) continue;
    (parMotif[t] = parMotif[t] || []).push(ds);
  }
  const out = [];
  for (const t of Object.keys(parMotif)){
    const jours = parMotif[t].sort();
    const memeAbs = ds => { const j = Store.dayOf(e.id, ds); return !!(j && j.kind==="absence" && (j.absenceType||"")===t); };
    const pontable = ds => { const j = Store.dayOf(e.id, ds); return !j && estJourTravaille(e, ds) === false; };
    let i = 0;
    while (i < jours.length){
      let fin = i;
      while (fin+1 < jours.length){
        const ecart = daysBetween(jours[fin], jours[fin+1]);
        if (ecart === 1){ fin++; continue; }
        if (ecart <= 5){
          let pont = true;
          for (let k=1;k<ecart;k++) if (!pontable(ymd(addDays(parseYmd(jours[fin]),k)))){ pont = false; break; }
          if (pont){ fin++; continue; }
        }
        break;
      }
      /* la période peut déborder du mois : on l'étend pour donner les vraies dates */
      let du = jours[i], au = jours[fin], avant = false, apres = false, garde = 0;
      while (garde++ < 200){ const p = ymd(addDays(parseYmd(du),-1)); if (!memeAbs(p)) break; du = p; if (p < debutMois) avant = true; }
      garde = 0;
      while (garde++ < 200){ const p = ymd(addDays(parseYmd(au),1)); if (!memeAbs(p)) break; au = p; if (p > finMois) apres = true; }
      let perdues = 0;
      for (let d=parseYmd(du); ymd(d)<=au; d=addDays(d,1)){
        const j = Store.dayOf(e.id, ymd(d));
        if (j && j.kind==="absence" && j.perdue !== false) perdues++;
      }
      out.push({emp:e, type:t, du, au, perdues, avant, apres, cle: e.id+"|"+t+"|"+du});
      i = fin + 1;
    }
  }
  return out;
}

/* Ce qui empêche de considérer le mois comme fiable */
function anomaliesMois(mk, ids){
  const [y,mo] = mk.split("-").map(Number);
  const finMois = ymd(new Date(y,mo,0));
  const a = {nonValides:0, sansMotif:0, horsContrat:0};
  const garde = ids ? new Set(ids) : null;
  const concernes = garde ? S.employees.filter(e => garde.has(e.restaurantId)) : S.employees;
  for (let d=new Date(y,mo-1,1); ymd(d)<=finMois; d=addDays(d,1)){
    const ds = ymd(d);
    for (const e of concernes){
      const j = Store.dayOf(e.id, ds);
      if (!j) continue;
      if (j.kind === "work" && !j.validated) a.nonValides++;
      if (j.kind === "absence" && !j.absenceType) a.sansMotif++;
      if (!contratCouvre(e, ds)) a.horsContrat++;
    }
  }
  return a;
}

/* ---------- vue : récap paie ---------- */
function buildRecap(mk){
  const [y,mo] = mk.split("-").map(Number);
  const first = new Date(y, mo-1, 1), last = new Date(y, mo, 0);
  const dates = [];
  for (let d=new Date(first); d<=last; d=addDays(d,1)) dates.push(ymd(d));

  /* semaines ISO chevauchant le mois, rattachées au mois de leur lundi */
  const weeks = new Map();
  for (const ds of dates){
    const mon = ymd(startOfWeek(parseYmd(ds)));
    if (!weeks.has(mon)) weeks.set(mon, monthKey(parseYmd(mon)) === mk);
  }

  const rows = [];
  for (const e of S.employees){
    if (e.active===false) continue;
    let worked=0, planned=0, jours=0, nonValid=0;
    const abs = {}; let absDays=0, absPerdues=0;
    const perResto = {};
    for (const ds of dates){
      const day = Store.dayOf(e.id, ds);
      if (!day) continue;
      if (day.kind==="absence"){ abs[day.absenceType]=(abs[day.absenceType]||0)+1; absDays++;
        if (day.perdue !== false) absPerdues++; continue; }
      if (day.kind!=="work") continue;
      const a = dayActualHours(day), p = dayPlannedHours(day);
      worked += a; planned += p; jours++;
      if (!day.validated) nonValid++;
      const parts = day.services||[];
      const tot = parts.reduce((s,x)=>{let d0=toMin(x.end)-toMin(x.start); if(d0<0)d0+=1440; d0-=Number(x.breakMin||0); return s+Math.max(0,d0)/60;},0) || 1;
      for (const s of parts){
        let d0 = toMin(s.end)-toMin(s.start); if(d0<0)d0+=1440; d0-=Number(s.breakMin||0);
        const share = Math.max(0,d0)/60 / tot * a;
        perResto[s.restaurantId] = (perResto[s.restaurantId]||0) + share;
      }
    }
    let hs25=0, hs50=0, compl=0;
    const wdetail = [];
    for (const [mon, inMonth] of weeks){
      const wk = weekHours(e.id, mon);
      if (wk.actual <= 0) continue;
      const ot = overtimeSplit(wk.actual, e.weeklyHours);
      wdetail.push({mon, inMonth, actual:wk.actual, ot});
      if (inMonth){ hs25 += ot.hs25; hs50 += ot.hs50; compl += ot.compl; }
    }
    if (worked===0 && absDays===0) continue;
    /* Staff & Go n'a qu'une colonne « Heures supplémentaires » : les complémentaires
       des temps partiels s'y saisissent aussi, la paie les requalifie à l'édition. */
    rows.push({e, worked, planned, jours, nonValid, abs, absDays, absPerdues, hs25, hs50, compl,
      hsTotal: hs25+hs50+compl, wdetail, perResto});
  }
  rows.sort((a,b)=> restoName(a.e.restaurantId).localeCompare(restoName(b.e.restaurantId)) || empName(a.e).localeCompare(empName(b.e)));
  return rows;
}

/* Impression : un établissement par page, ou un seul si box est fourni.
   Pas de bibliothèque PDF — c'est le navigateur qui produit le fichier,
   ce qui laisse le choix des pages et fonctionne partout. */
function imprimerBloc(box){
  const blocs = [...document.querySelectorAll(".saisiebloc")];
  if (box){ blocs.forEach(n => n.classList.toggle("bloc-seul", n === box)); document.body.classList.add("print-un-bloc"); }
  const nettoyer = () => {
    document.body.classList.remove("print-un-bloc");
    blocs.forEach(n => n.classList.remove("bloc-seul"));
  };
  try { window.print(); }
  catch(e){ nettoyer(); return toast("L'impression est bloquée sur cette vue — utilisez Ctrl+P (⌘P sur Mac)."); }
  setTimeout(nettoyer, 800);
}

/* le contrat du salarié recouvre-t-il au moins un jour du mois ? */
function couvreMois(e, mk){
  const [y,mo] = mk.split("-").map(Number);
  const d1 = ymd(new Date(y,mo-1,1)), d2 = ymd(new Date(y,mo,0));
  if (e.startDate && e.startDate > d2) return false;
  if (e.endDate && e.endDate < d1) return false;
  return true;
}
function valBtn(txt, cls){
  return el("button",{class:cls||"copyval", type:"button", title:"Cliquer pour copier",
    onclick:()=>fallbackCopy(txt, "« "+txt+" » copié.")}, txt);
}

/* ---------- vue : saisie Staff & Go ---------- */
function viewSaisieStaff(){
  const mk = S.payMonth;
  const wrap = el("div");
  const rows = buildRecap(mk).filter(r => payRestoMatch(r.e.restaurantId));
  const parEmp = {}; rows.forEach(r => parEmp[r.e.id] = r);

  /* 1. ce qui rend le mois non fiable */
  const an = anomaliesMois(mk, payRestosSel().map(r => r.id));
  const soucis = [];
  if (an.nonValides) soucis.push({n:an.nonValides,
    txt:"service(s) non vérifié(s) : les heures ci-dessous sont celles du planning, pas le réel",
    label:"Vérifier les heures", go:()=>{S.tab="heures"; S.hoursFilter="todo"; render();}});
  if (an.sansMotif) soucis.push({n:an.sansMotif,
    txt:"journée(s) d'absence sans motif : impossible de choisir un type d'absence dans Staff & Go"});
  if (an.horsContrat) soucis.push({n:an.horsContrat,
    txt:"journée(s) saisie(s) en dehors de la période de contrat"});
  if (soucis.length){
    const inner = el("div",null, el("strong",null,"Le mois n'est pas encore fiable."));
    soucis.forEach(s => inner.appendChild(el("div",{style:"margin-top:4px"},
      s.n+" "+s.txt+". ",
      s.go ? el("button",{class:"btn sm",style:"margin-left:4px",onclick:s.go}, s.label) : null)));
    wrap.appendChild(el("div",{class:"banner noprint"},
      el("span",{class:"dot",style:"background:currentColor;margin-top:6px"}), inner));
  }

  /* 2. constitution des blocs, un par établissement */
  const restos = payRestosSel().slice().sort((a,b)=>(a.order||0)-(b.order||0) || a.name.localeCompare(b.name));
  const blocs = [];
  let nTot = 0, nFait = 0;
  for (const r of restos){
    const emps = S.employees
      .filter(e => e.restaurantId === r.id && (parEmp[e.id] || (e.active !== false && couvreMois(e, mk))))
      .sort(triNom);
    const hs = emps.map(e => ({e, h: (parEmp[e.id] || {}).hsTotal || 0}));
    const abs = [];
    emps.forEach(e => absencePeriodes(e, mk).forEach(p => abs.push(p)));
    abs.sort((a,b)=> triNom(a.emp, b.emp) || a.du.localeCompare(b.du));
    const aSaisir = hs.filter(x => x.h > 0).length + abs.length;
    const faites = hs.filter(x => x.h > 0 && Store.coche(mk,"hs",x.e.id)).length
                 + abs.filter(p => Store.coche(mk,"abs",p.cle)).length;
    nTot += aSaisir; nFait += faites;
    blocs.push({r, hs, abs, aSaisir, faites});
  }

  /* 3. avancement */
  const barre = el("div",{class:"progbar"}, el("i",{style:"width:"+(nTot?Math.round(nFait/nTot*100):0)+"%"}));
  wrap.appendChild(el("div",{class:"card noprint",style:"padding:13px 16px;margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"},
    el("div",{style:"margin-right:auto;min-width:220px"},
      el("div",{style:"font-family:var(--display);font-weight:600"},
        nTot ? nFait+" ligne"+(nFait>1?"s":"")+" sur "+nTot+" saisie"+(nFait>1?"s":"")+" dans Staff & Go"
             : "Rien à saisir sur "+moisLabel(mk)),
      barre),
    nFait ? el("button",{class:"btn sm",onclick: async ()=>{
      if (await ask("Décocher les "+nFait+" ligne(s) déjà pointées sur "+moisLabel(mk)+" ?","Tout décocher"))
        await Store.videCloture(mk);
    }},"Tout décocher") : null));

  if (!payRestosSel().length){
    wrap.appendChild(el("div",{class:"card empty"},
      el("h3",null,"Aucun établissement sélectionné"),
      el("p",null,"Cochez au moins un établissement dans le filtre ci-dessus.")));
    return wrap;
  }
  if (!nTot && !rows.length){
    wrap.appendChild(el("div",{class:"card empty"},
      el("h3",null,"Aucune donnée sur "+moisLabel(mk)),
      el("p",null,"Construisez le planning de la période pour alimenter cette page.")));
    return wrap;
  }

  /* 4. un bloc par établissement */
  const vides = [], sansEquipe = []; let cartes = 0;
  for (const b of blocs){
    /* trois états distincts, aucun établissement ne disparaît en silence */
    if (!b.hs.length && !b.abs.length){ sansEquipe.push(b.r.name); continue; }
    if (!b.aSaisir){ vides.push(b.r.name); continue; }
    const box = el("div",{class:"card saisiebloc"+(cartes++ ? "" : " bloc-premier"),style:"padding:16px;margin-bottom:14px"});
    box.appendChild(el("div",{class:"row",style:"gap:10px;margin-bottom:12px;align-items:baseline"},
      el("h3",{style:"font-family:var(--display);font-size:15px;font-weight:600"}, b.r.name),
      el("span",{class:"printonly-inline",style:"color:var(--muted);font-size:12px"},
        "Saisie Staff & Go · "+moisLabel(mk)),
      el("span",{style:"margin-left:auto"}),
      el("span",{class:"pill "+(b.faites>=b.aSaisir?"ok":"warn")},
        b.faites+" / "+b.aSaisir+(b.faites>=b.aSaisir?" — terminé":" saisies")),
      el("button",{class:"btn sm noprint",title:"Imprimer ou enregistrer en PDF ce seul établissement",
        onclick:()=>imprimerBloc(box)},"PDF")));

    /* --- heures supplémentaires --- */
    box.appendChild(el("div",{class:"eyebrow",style:"margin-bottom:6px"},"Heures supplémentaires"));
    const avecHS = b.hs.filter(x => x.h > 0).length;
    if (!avecHS){
      box.appendChild(el("p",{class:"note",style:"margin:0 0 14px"},"Aucune heure supplémentaire ce mois-ci."));
    } else {
      const t = el("table");
      t.appendChild(el("thead",null,el("tr",null,
        el("th",{style:"width:34px"},""), el("th",null,"Salarié"), el("th",null,"Contrat"),
        el("th",{class:"num"},"Heures supplémentaires"))));
      const tb = el("tbody");
      for (const x of b.hs){
        const fait = x.h > 0 && Store.coche(mk,"hs",x.e.id);
        const tr = el("tr",{class: x.h>0 ? (fait?"faite":"") : "vide"});
        if (x.h > 0){
          const c = el("input",{type:"checkbox"}); c.checked = fait;
          c.onchange = ev => Store.cocher(mk,"hs",x.e.id, ev.target.checked);
          tr.appendChild(el("td",null,c));
        } else tr.appendChild(el("td",null,""));
        tr.append(
          el("td",{style:"font-weight:600"}, nomStaff(x.e)),
          el("td",{style:"font-size:12px;color:var(--muted)"},
            contratLabel(x.e.contractType)+" · "+(x.e.weeklyHours||0)+" h"),
          el("td",{class:"num"}, x.h > 0 ? valBtn(fmtStaff(x.h),"copyval big") : el("span",{style:"color:var(--muted)"},"—")));
        tb.appendChild(tr);
      }
      t.appendChild(tb);
      box.appendChild(el("div",{class:"tablewrap",style:"margin-bottom:14px"},t));
    }

    /* --- absences --- */
    box.appendChild(el("div",{class:"eyebrow",style:"margin-bottom:6px"},"Absences"));
    if (!b.abs.length){
      box.appendChild(el("p",{class:"note",style:"margin:0"},"Aucune absence ce mois-ci."));
    } else {
      const t = el("table");
      t.appendChild(el("thead",null,el("tr",null,
        el("th",{style:"width:34px"},""), el("th",null,"Salarié"), el("th",null,"Type d'absence"),
        el("th",null,"Date de début"), el("th",null,"Date de fin"), el("th",null,"Contrôle"))));
      const tb = el("tbody");
      for (const p of b.abs){
        const fait = Store.coche(mk,"abs",p.cle);
        const c = el("input",{type:"checkbox"}); c.checked = fait;
        c.onchange = ev => Store.cocher(mk,"abs",p.cle, ev.target.checked);
        const cheval = [];
        if (p.avant) cheval.push("commencée en "+moisLabel(monthKeyOf(p.du)));
        if (p.apres) cheval.push("se poursuit en "+moisLabel(monthKeyOf(p.au)));
        tb.appendChild(el("tr",{class: fait?"faite":""},
          el("td",null,c),
          el("td",{style:"font-weight:600"}, nomStaff(p.emp)),
          el("td",null, valBtn(absLabel(p.type))),
          el("td",null, valBtn(fr8(p.du))),
          el("td",null, valBtn(fr8(p.au))),
          el("td",{style:"font-size:12px;color:var(--muted)"},
            el("div",null, p.perdues+" j. de travail perdu"+(p.perdues>1?"s":"")),
            cheval.length ? el("div",{style:"margin-top:4px"},
              el("span",{class:"pill neutral"}, cheval.join(" · "))) : null)));
      }
      t.appendChild(tb);
      box.appendChild(el("div",{class:"tablewrap"},t));
    }
    wrap.appendChild(box);
  }
  const ligneEtat = (cls, titre, noms, aide) => el("div",{class:"card noprint",
      style:"padding:12px 16px;margin-bottom:14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"},
    el("span",{class:"pill "+cls}, titre),
    el("span",{style:"font-size:13px;color:var(--muted)"}, noms.join(" · ")),
    aide ? el("span",{class:"note",style:"width:100%;margin-top:4px"}, aide) : null);
  if (vides.length) wrap.appendChild(ligneEtat("ok","Rien à saisir", vides,
    "Ces établissements ont une équipe, mais aucune heure supplémentaire ni absence à déclarer sur "+moisLabel(mk)+"."));
  if (sansEquipe.length) wrap.appendChild(ligneEtat("neutral","Aucun salarié enregistré", sansEquipe,
    "Aucun salarié n'est rattaché à ces établissements : rien ne peut en sortir tant que l'équipe n'est pas saisie dans « Équipe & contrats »."));

  /* 5. archive */
  const absAll = [];
  S.employees.filter(e => payRestoMatch(e.restaurantId))
    .forEach(e => absencePeriodes(e, mk).forEach(p => absAll.push(p)));
  wrap.appendChild(el("div",{class:"row noprint",style:"margin-top:18px;gap:9px;flex-wrap:wrap"},
    el("div",{class:"note",style:"margin-right:auto"},
      "Exports limités à la période et aux établissements sélectionnés ci-dessus — "
      + moisLabel(mk) + ", " + (payRestosSel().length === S.restaurants.length
          ? "tous les établissements" : payRestosSel().map(r=>r.name).join(", "))

    el("button",{class:"btn primary",onclick:()=>imprimerBloc(null)},
      blocs.filter(b=>b.aSaisir).length > 1 ? "PDF — les "+blocs.filter(b=>b.aSaisir).length+" établissements" : "PDF"),
    el("button",{class:"btn",onclick:()=>exportCSV(rows)},"Heures (CSV)"),
    el("button",{class:"btn",onclick:()=>exportAbsCSV(absAll)},"Absences (CSV)")));

  wrap.appendChild(el("p",{class:"note",style:"margin-top:12px"},
    "Une seule colonne d'heures supplémentaires, comme dans Staff & Go : elle additionne les majorations à 25 % et à 50 % ainsi que les heures complémentaires des temps partiels, que la paie requalifie à l'édition du bulletin. Le détail par nature reste dans l'onglet Récapitulatif. Les dates d'absence sont calendaires — Staff & Go calcule lui-même la durée. Les journées d'école des alternants sont exclues : c'est du temps de travail payé, pas une absence."));
  return wrap;
}

/* ---------- export ---------- */
function recapMatrix(rows){
  const head = ["Mois","Restaurant","Nom","Prénom","Poste","Type contrat","Heures hebdo contrat","Jours travaillés","Heures planifiées","Heures réelles","Heures supplémentaires (à saisir)","HS 25%","HS 50%","Heures complémentaires","Jours absence","Journées de travail perdues","Détail absences","Fin de contrat"];
  const body = rows.map(r => [
    S.payMonth, restoName(r.e.restaurantId), r.e.lastName, r.e.firstName, r.e.role||"",
    contratLabel(r.e.contractType), r.e.weeklyHours||0, r.jours,
    round2(r.planned), round2(r.worked), round2(r.hsTotal), round2(r.hs25), round2(r.hs50), round2(r.compl),
    r.absDays, r.absPerdues, Object.entries(r.abs).map(([k,v])=>absLabel(k)+" x"+v).join(" / "), r.e.endDate||""
  ]);
  return {head, body};
}
const round2 = n => Math.round(n*100)/100;
function toCSV(m){
  const cell = v => {
    let s = String(v ?? "");
    if (typeof v === "number") s = s.replace(".",",");
    return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  return [m.head, ...m.body].map(r => r.map(cell).join(";")).join("\r\n");
}
function absMatrix(periodes){
  const head = ["Mois","\u00C9tablissement","Salari\u00E9","Type d'absence","Date de d\u00E9but","Date de fin","Jours de travail perdus","Remarque"];
  const body = periodes.slice()
    .sort((a,b)=> restoName(a.emp.restaurantId).localeCompare(restoName(b.emp.restaurantId))
                || triNom(a.emp,b.emp) || a.du.localeCompare(b.du))
    .map(p => [S.payMonth, restoName(p.emp.restaurantId), nomStaff(p.emp), absLabel(p.type),
      fr8(p.du), fr8(p.au), p.perdues,
      [p.avant?"commenc\u00E9e le mois pr\u00E9c\u00E9dent":"", p.apres?"se poursuit le mois suivant":""].filter(Boolean).join(" ; ")]);
  return {head, body};
}
async function exportAbsCSV(periodes){
  if (!periodes.length) return toast("Aucune absence \u00E0 exporter sur "+moisLabel(S.payMonth)+".");
  await telecharger("\uFEFF"+toCSV(absMatrix(periodes)), "absences-"+S.payMonth+suffixePaie()+".csv");
}
async function exportCSV(rows){
  await telecharger("\uFEFF"+toCSV(recapMatrix(rows)), "heures-"+S.payMonth+suffixePaie()+".csv");
}
async function telecharger(csv, filename){
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){ dl = null; }
  if (dl){
    try { await dl.save({filename, data:csv}); toast("Fichier "+filename+" prêt."); }
    catch(err){
      if (err && err.code === "declined") return;
      if (err && err.code === "rate_limited") return toast("Un téléchargement est déjà en cours, réessayez dans un instant.");
      fallbackCopy(csv, "Le téléchargement n'est pas disponible ici — le CSV a été copié dans le presse-papiers.");
    }
  } else {
    fallbackCopy(csv, "Téléchargement indisponible sur cette vue — le CSV a été copié dans le presse-papiers.");
  }
}
function copierRecap(rows){
  const m = recapMatrix(rows);
  const tsv = [m.head, ...m.body].map(r=>r.map(v=>typeof v==="number"?String(v).replace(".",","):String(v??"")).join("\t")).join("\n");
  fallbackCopy(tsv, "Tableau copié — collez-le dans votre tableur.");
}
function fallbackCopy(text, msg){
  const done = () => toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>legacyCopy(text,done));
  } else legacyCopy(text, done);
}
function legacyCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); }
  catch(e){ toast("Copie impossible dans ce contexte."); }
  ta.remove();
}
function downloadText(filename, data, mime){
  const blob = new Blob([data], {type: mime || "text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function exportBackup(){
  const filename = "planning-backup-" + ymd(new Date()) + ".json";
  downloadText(filename, Store.exportJSON(), "application/json;charset=utf-8");
  toast("Sauvegarde exportee.");
}
function importBackup(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      Store.importJSON(String(reader.result || ""));
      toast("Sauvegarde importee.");
      closeModal();
    } catch(err){
      toast("Fichier de sauvegarde invalide.");
    }
  };
  reader.readAsText(file);
}
