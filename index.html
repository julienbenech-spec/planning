<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning</title>
<meta name="description" content="Planning multi-restaurants pour la gestion d'equipe, des absences et des heures.">
<style>
  :root{color-scheme:light dark}
  body{margin:0;font:14px system-ui,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --surface-2:#EAEFF5; --surface-3:#DFE7F0;
  --border:#D9E1EA; --border-strong:#BDCBDA;
  --ink:#131C27; --ink-2:#3C4B5C; --muted:#6D7E90;
  --accent:#1F4FA3; --accent-soft:#E3ECFA; --accent-line:#B9CEEE; --accent-ink:#173D80; --on-accent:#FFFFFF;
  --renfort:#6B4A9E; --renfort-soft:#EEE7F9; --renfort-line:#D3C3EE;
  --ok:#1C6647; --ok-soft:#DFF0E7; --ok-line:#B3DCC7;
  --warn:#8A570A; --warn-soft:#FAEBD2; --warn-line:#EBCF9C;
  --crit:#A32C21; --crit-soft:#FBE4E1; --crit-line:#EFBDB6;
  --shadow-sm:0 1px 2px rgba(19,28,39,.07);
  --shadow-md:0 2px 4px rgba(19,28,39,.06),0 10px 30px -16px rgba(19,28,39,.30);
  --radius:10px;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141C; --surface:#151E28; --surface-2:#1C2733; --surface-3:#243140;
    --border:#293747; --border-strong:#3B4C5F;
    --ink:#E9EFF5; --ink-2:#BDCAD8; --muted:#8394A6;
    --accent:#7DA8EF; --accent-soft:#182A46; --accent-line:#2C4671; --accent-ink:#AFC8F7; --on-accent:#0D141C;
    --renfort:#B79BE8; --renfort-soft:#271E3C; --renfort-line:#3F3160;
    --ok:#6CC79A; --ok-soft:#122C20; --ok-line:#1F4A36;
    --warn:#E0B15F; --warn-soft:#332512; --warn-line:#54401C;
    --crit:#EF9082; --crit-soft:#371A16; --crit-line:#5A2C25;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 2px 4px rgba(0,0,0,.35),0 12px 34px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0D141C; --surface:#151E28; --surface-2:#1C2733; --surface-3:#243140;
  --border:#293747; --border-strong:#3B4C5F;
  --ink:#E9EFF5; --ink-2:#BDCAD8; --muted:#8394A6;
  --accent:#7DA8EF; --accent-soft:#182A46; --accent-line:#2C4671; --accent-ink:#AFC8F7; --on-accent:#0D141C;
  --renfort:#B79BE8; --renfort-soft:#271E3C; --renfort-line:#3F3160;
  --ok:#6CC79A; --ok-soft:#122C20; --ok-line:#1F4A36;
  --warn:#E0B15F; --warn-soft:#332512; --warn-line:#54401C;
  --crit:#EF9082; --crit-soft:#371A16; --crit-line:#5A2C25;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 4px rgba(0,0,0,.35),0 12px 34px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm)}
.topbar-in{max-width:1560px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:19px;font-weight:700}
.brand .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs{max-width:1560px;margin:0 auto;padding:0 22px;display:flex;gap:2px;flex-wrap:wrap}
.tabsbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:39}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:11px 14px;cursor:pointer;color:var(--muted);font-weight:500;font-family:var(--display);font-size:13.5px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1560px;margin:0 auto;padding:22px}
.section-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.section-head h2{font-size:17px;font-weight:600}
.section-head p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:64ch}

/* ---------- controls ---------- */
.btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{border-color:var(--crit-line);color:var(--crit);background:var(--crit-soft)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:7px 9px;font-size:13px;width:100%}
textarea{resize:vertical;min-height:64px;font-family:var(--body)}
label.fld{display:flex;flex-direction:column;gap:5px}
label.fld > span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
.seg button{appearance:none;border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- cards / pills ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:16px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-line)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border-color:var(--border)}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.renfort{background:var(--renfort-soft);color:var(--renfort);border-color:var(--renfort-line)}
.stat{display:flex;flex-direction:column;gap:3px}
.stat .v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.statrow > div{background:var(--surface);padding:14px 16px}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.subrow td{background:var(--surface-2);font-size:12px;color:var(--ink-2)}

/* ---------- planning grid ---------- */
.planwrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);max-height:none}
.plan{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px}
.plan th,.plan td{border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.plan th.day{background:var(--surface-2);padding:8px 10px;text-align:center;position:sticky;top:0;z-index:2}
.plan th.day .dn{font-family:var(--display);font-size:12.5px;font-weight:600;color:var(--ink);text-transform:capitalize}
.plan th.day .dd{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.plan th.day.today{background:var(--accent-soft)}
.plan th.day.today .dn{color:var(--accent)}
.plan th.corner{background:var(--surface-2);position:sticky;left:0;top:0;z-index:3;min-width:210px;text-align:left;padding:8px 12px}
.plan th.tot{background:var(--surface-2);position:sticky;right:0;top:0;z-index:3;min-width:112px;text-align:right;padding:8px 12px;border-right:0}
.plan td.emp{position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px;padding:7px 12px}
.plan td.total{position:sticky;right:0;background:var(--surface);z-index:1;text-align:right;padding:7px 12px;border-right:0}
.plan tr.grouphead td{background:var(--surface-3);font-family:var(--display);font-weight:600;font-size:12.5px;padding:6px 12px;position:sticky;left:0}
.plan td.cell{padding:4px;vertical-align:top;min-width:126px}
.empname{font-weight:600;font-size:13px;line-height:1.25}
.emprole{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cellbtn{width:100%;min-height:46px;border:1px dashed transparent;border-radius:7px;background:none;cursor:pointer;padding:3px;display:flex;flex-direction:column;gap:3px;text-align:left}
.cellbtn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.chip{border-radius:6px;padding:4px 6px;font-family:var(--mono);font-size:11px;line-height:1.35;font-weight:500;border:1px solid;display:block}
.chip.work{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip.renfort{background:var(--renfort-soft);border-color:var(--renfort-line);color:var(--renfort)}
.chip.abs{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.chip.abs.unpaid{background:var(--surface-2);border-color:var(--border-strong);color:var(--muted)}
.chip .tag{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.cellbtn .plus{color:var(--border-strong);font-size:16px;line-height:1;align-self:center;margin:auto}
.cellbtn:hover .plus{color:var(--accent)}
/* vue mois */
.plan.month{min-width:0}
.plan th.mday{min-width:36px;padding:6px 2px}
.plan th.mday .dn{font-size:10px;font-family:var(--mono);color:var(--muted);font-weight:500}
.plan th.mday .dd{font-family:var(--display);font-size:12px;font-weight:600;color:var(--ink)}
.plan th.mday.we{background:var(--surface-3)}
.plan td.mc{padding:2px;min-width:36px;width:36px}
.plan td.mc.we{background:var(--surface-2)}
.plan td.mc.today{background:var(--accent-soft)}
.mcell{width:100%;height:30px;border-radius:5px;border:1px solid transparent;background:none;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;font-weight:600;line-height:1;padding:0;color:var(--muted)}
.mcell:hover{border-color:var(--border-strong)}
.mcell.work{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.mcell.renfort{background:var(--renfort-soft);border-color:var(--renfort-line);color:var(--renfort)}
.mcell.abs{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn);font-size:9.5px}
.mcell.abs.unpaid{background:var(--surface-2);border-color:var(--border-strong);color:var(--muted)}
.plan tr.effectif td{background:var(--surface-2);border-top:1px solid var(--border-strong)}
.plan tr.effectif td.emp{background:var(--surface-2)}
.daytog{appearance:none;border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;
  width:32px;height:32px;cursor:pointer;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);padding:0}
.daytog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.daytog.locked{cursor:default;opacity:.9}
/* couverture des services */
.plan tr.couv td{background:var(--surface-2);border-top:1px solid var(--border-strong)}
.plan tr.couv td.emp{background:var(--surface-2)}
.plan td.cv{padding:4px 3px;text-align:center;vertical-align:middle}
.cvline{display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--mono);font-size:11px;line-height:1.5}
.cvline b{font-weight:600;font-size:9.5px;letter-spacing:.06em;color:var(--muted);width:12px;text-align:left}
.cvval{font-variant-numeric:tabular-nums;padding:1px 5px;border-radius:5px;border:1px solid transparent}
.cvval.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.cvval.bad{color:var(--crit);background:var(--crit-soft);border-color:var(--crit-line);font-weight:700}
.cvval.plus{color:var(--muted);background:var(--surface-3)}
.cvval.off{color:var(--border-strong)}
.gapcard{border-color:var(--crit-line)}
.gaprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border)}
.gaprow:last-child{border-bottom:0}
.gapwhen{font-family:var(--mono);font-size:12px;min-width:190px}
.tabbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:7px;
  border-radius:9px;background:var(--crit);color:var(--surface);font-family:var(--mono);font-size:10.5px;font-weight:700}
.cibletab{border-collapse:collapse;width:100%;font-size:12px}
.cibletab th{position:static;padding:6px 5px;text-align:center}
.cibletab td{padding:4px 5px;border-bottom:1px solid var(--border)}
.cibletab input[type=number]{width:48px;padding:4px 5px;text-align:center}
.cibletab .sep{border-left:1px solid var(--border-strong)}
/* journées hors contrat */
.plan td.hors{background-image:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--border) 5px,var(--border) 6px)}
.plan td.hors .cellbtn{opacity:.5}
.plan td.hors .cellbtn .plus{display:none}
.mcell.hors{opacity:.45}
.chip.hors,.mcell.horsviol{background:var(--crit-soft);border-color:var(--crit-line);color:var(--crit)}
/* dernier jour de contrat */
.chip.fin{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.plan td.fincontrat{box-shadow:inset -3px 0 0 var(--warn)}
.mcell.fincontrat{position:relative;box-shadow:inset 0 -3px 0 var(--warn)}
.mcell.fincontrat::after{content:"!";position:absolute;top:-1px;right:2px;font-size:9px;font-weight:700;color:var(--warn);line-height:1}
.hbar{height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-top:4px}
.hbar i{display:block;height:100%;background:var(--accent)}
.hbar i.over{background:var(--warn)}
.hbar i.under{background:var(--border-strong)}

/* ---------- misc ---------- */
.banner{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:var(--radius);border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn);font-size:13px;margin-bottom:16px}
.banner.info{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink)}
.empty{padding:44px 22px;text-align:center;color:var(--muted)}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;border:1px solid}
.note{font-size:12px;color:var(--muted);max-width:78ch}
hr.sep{border:0;border-top:1px solid var(--border);margin:22px 0}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,23,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-md);width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column}
.modal.wide{width:min(940px,100%)}
.modal header{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.modal header h3{font-size:16px;font-weight:600}
.modal header .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.modal .body{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.svcbox{border:1px solid var(--border);border-radius:9px;padding:11px;display:flex;flex-direction:column;gap:9px;background:var(--surface-2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;z-index:90;box-shadow:var(--shadow-md);max-width:min(520px,90vw)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}

@media(max-width:760px){
  .topbar-in,.tabs,main{padding-left:14px;padding-right:14px}
  .plan th.corner,.plan td.emp{min-width:148px;padding-left:10px;padding-right:10px}
  .plan th.tot,.plan td.total{position:static;min-width:96px}
  .plan td.cell{min-width:116px}
  .section-head h2{font-size:16px}
}
@media print{
  .topbar,.tabsbar,.noprint{display:none!important}
  body{background:#fff}
  .planwrap{border:0;overflow:visible}
  .plan{min-width:0;font-size:10px}
}
</style>

<header class="topbar noprint">
  <div class="topbar-in">
    <div class="brand">
      <h1>Planning</h1>
      <span class="sub" id="brandsub">8 restaurants</span>
    </div>
    <span id="modebadge" class="pill neutral">Chargement…</span>
    <button class="btn sm" id="btn-settings">Réglages</button>
  </div>
</header>
<div class="tabsbar noprint">
  <div class="tabs" role="tablist" id="tabs"></div>
</div>
<main id="view"></main>
<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="toast-root"></div>

<script>
"use strict";
/* ============================================================
   Planning — planification multi-restaurants
   ============================================================ */

/* ---------- utils : dates ---------- */
const JOURS = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const JOURS_ABR = ["Lu","Ma","Me","Je","Ve","Sa","Di"];
const MOIS  = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS_COURT = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const pad = n => String(n).padStart(2,"0");
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseYmd(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(d,n){ const x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d){ const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; return addDays(x,-w); }
function monthKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function monthKeyOf(s){ return s.slice(0,7); }
function frDate(s){ const d=parseYmd(s); return (d.getDate()===1?"1er":d.getDate())+" "+MOIS_COURT[d.getMonth()]+" "+d.getFullYear(); }
function frDateLong(s){ const d=parseYmd(s); return JOURS[(d.getDay()+6)%7]+" "+(d.getDate()===1?"1er":d.getDate())+" "+MOIS[d.getMonth()]+" "+d.getFullYear(); }
function isoWeekKey(d){
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay()+6)%7));
  const y = t.getFullYear();
  const jan4 = new Date(y,0,4);
  const wk = 1 + Math.round(((t - jan4)/86400000 - 3 + ((jan4.getDay()+6)%7))/7);
  return y+"-S"+pad(wk);
}
function daysBetween(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/86400000); }
function toMin(t){ const [h,m]=String(t||"0:0").split(":").map(Number); return (h||0)*60+(m||0); }
function fmtH(h){ if(h==null||isNaN(h)) return "—"; const s = Math.round(h*100)/100; return s.toFixed(2).replace(".",",")+" h"; }
function fmtHshort(h){ if(!h) return "0"; return (Math.round(h*100)/100).toString().replace(".",","); }
const uid = p => (p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- persistance ---------- */
const Store = {
  mode: "local",
  db: null,
  monthSubs: {},
  async init(){
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; }
    catch(e){ db = null; }
    if (db) { this.mode = "db"; this.db = db; this.wire(); }
    else { this.mode = "local"; this.loadLocal(); S.ready = true; render(); }
    paintMode();
  },
  wire(){
    const err = e => { console.warn("db", e); toast("Connexion aux données interrompue. Rechargez la page."); };
    this.db.collection("restaurants").onSnapshot(snap => {
      S.restaurants = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      S.restaurants.sort((a,b)=>(a.order||0)-(b.order||0) || a.name.localeCompare(b.name));
      S.ready = true; render();
    }, err);
    this.db.collection("employees").onSnapshot(snap => {
      S.employees = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      S.ready = true; render();
    }, err);
    this.db.collection("recrutements").onSnapshot(snap => {
      S.recrutements = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      render();
    }, err);
    this.syncMonths();
  },
  neededMonths(){
    const set = new Set([S.payMonth, S.planMonth]);
    const ws = parseYmd(S.weekStart);
    for (let i=-7;i<14;i++) set.add(monthKey(addDays(ws,i)));
    /* mois voisins de la période de paie : les semaines à cheval en dépendent */
    const [py,pm] = S.payMonth.split("-").map(Number);
    set.add(monthKey(new Date(py, pm-2, 15)));
    set.add(monthKey(new Date(py, pm, 15)));
    return [...set];
  },
  syncMonths(){
    if (this.mode !== "db") return;
    const need = this.neededMonths();
    for (const k of Object.keys(this.monthSubs)) {
      if (!need.includes(k)) { this.monthSubs[k](); delete this.monthSubs[k]; }
    }
    for (const k of need) {
      if (this.monthSubs[k]) continue;
      this.monthSubs[k] = this.db.collection("periods/"+k+"/employees").onSnapshot(snap => {
        const m = {};
        snap.docs.forEach(d => { m[d.id] = d.data() || {days:{}}; });
        S.months[k] = m;
        render();
      }, e => console.warn("periods", e));
    }
  },
  /* --- lectures --- */
  dayOf(empId, date){
    const m = S.months[monthKeyOf(date)];
    if (!m || !m[empId] || !m[empId].days) return null;
    return m[empId].days[date] || null;
  },
  /* --- écritures --- */
  async saveResto(r){
    if (!r.id) r.id = uid("r");
    const p = restoById(r.id) || {};
    const pick = (a, b, d) => a !== undefined ? a : (b !== undefined ? b : d);
    const body = {
      name:  pick(r.name,  p.name,  ""),
      order: pick(r.order, p.order, 0),
      city:  pick(r.city,  p.city,  ""),
      midiStart: pick(r.midiStart, p.midiStart, "11:00"),
      midiEnd:   pick(r.midiEnd,   p.midiEnd,   "15:00"),
      soirStart: pick(r.soirStart, p.soirStart, "18:00"),
      soirEnd:   pick(r.soirEnd,   p.soirEnd,   "23:30"),
      cible: pick(r.cible, p.cible, {})
    };
    if (this.mode==="db") await this.db.doc("restaurants/"+r.id).set(body);
    else { const i=S.restaurants.findIndex(x=>x.id===r.id); const o=Object.assign({id:r.id},body); i<0?S.restaurants.push(o):S.restaurants[i]=o; this.saveLocal(); render(); }
    return r.id;
  },
  async removeResto(id){
    if (this.mode==="db") await this.db.doc("restaurants/"+id).delete();
    else { S.restaurants = S.restaurants.filter(r=>r.id!==id); this.saveLocal(); render(); }
  },
  async saveEmp(e){
    if (!e.id) e.id = uid("e");
    const body = {
      firstName:e.firstName||"", lastName:e.lastName||"", restaurantId:e.restaurantId||"",
      role:e.role||"", pole:e.pole||"", contractType:e.contractType||"CDI", weeklyHours:Number(e.weeklyHours)||0,
      startDate:e.startDate||"", endDate:e.endDate||"", phone:e.phone||"",
      canReplace: e.canReplace !== false, active: e.active !== false, note:e.note||""
    };
    if (this.mode==="db") await this.db.doc("employees/"+e.id).set(body);
    else { const i=S.employees.findIndex(x=>x.id===e.id); const o=Object.assign({id:e.id},body); i<0?S.employees.push(o):S.employees[i]=o; this.saveLocal(); render(); }
    return e.id;
  },
  async saveRecrut(r){
    if (!r.id) r.id = uid("k");
    const body = {
      restaurantId:r.restaurantId||"", role:r.role||"", pole:r.pole||"",
      contractType:r.contractType||"CDD", weeklyHours:Number(r.weeklyHours)||0,
      dateBesoin:r.dateBesoin||"", origine:r.origine||"", note:r.note||"",
      statut:r.statut||"ouvert", sourceEmpId:r.sourceEmpId||"", cree:r.cree||new Date().toISOString().slice(0,10)
    };
    if (this.mode==="db") await this.db.doc("recrutements/"+r.id).set(body);
    else { const i=S.recrutements.findIndex(x=>x.id===r.id); const o=Object.assign({id:r.id},body);
           i<0?S.recrutements.push(o):S.recrutements[i]=o; this.saveLocal(); render(); }
    return r.id;
  },
  async removeRecrut(id){
    if (this.mode==="db") await this.db.doc("recrutements/"+id).delete();
    else { S.recrutements = S.recrutements.filter(r=>r.id!==id); this.saveLocal(); render(); }
  },
  async removeEmp(id){
    if (this.mode==="db") await this.db.doc("employees/"+id).delete();
    else { S.employees = S.employees.filter(e=>e.id!==id); this.saveLocal(); render(); }
  },
  async setDay(empId, date, entry){
    const mk = monthKeyOf(date);
    S.months[mk] = S.months[mk] || {};
    S.months[mk][empId] = S.months[mk][empId] || {days:{}};
    const days = Object.assign({}, S.months[mk][empId].days || {});
    if (entry) days[date] = entry; else delete days[date];
    S.months[mk][empId] = {days};
    if (this.mode==="db"){
      const ref = this.db.doc("periods/"+mk+"/employees/"+empId);
      try {
        if (entry) await ref.update({days:{[date]:entry}});
        else await ref.set({days});
      } catch(err){ await ref.set({days}); }
    } else { this.saveLocal(); }
    render();
  },
  /* écriture groupée : tout un mois pour un salarié en un seul enregistrement */
  async setDays(empId, mk, daysObj){
    S.months[mk] = S.months[mk] || {};
    let base = (S.months[mk][empId] || {}).days;
    /* mois non chargé : relire le serveur avant d'écrire, sinon on l'écraserait */
    if (base === undefined && this.mode === "db"){
      try {
        const snap = await this.db.doc("periods/"+mk+"/employees/"+empId).get();
        base = snap.exists ? ((snap.data()||{}).days || {}) : {};
      } catch(e){ base = {}; }
    }
    const days = Object.assign({}, base || {}, daysObj);
    S.months[mk][empId] = {days};
    if (this.mode==="db") await this.db.doc("periods/"+mk+"/employees/"+empId).set({days});
    else this.saveLocal();
  },
  /* suppression groupée sur un mois */
  async removeDays(empId, mk, dates){
    const rec = (S.months[mk]||{})[empId];
    if (!rec || !rec.days) return 0;
    const days = Object.assign({}, rec.days);
    let n = 0;
    for (const d of dates) if (days[d]) { delete days[d]; n++; }
    if (!n) return 0;
    S.months[mk][empId] = {days};
    if (this.mode==="db") await this.db.doc("periods/"+mk+"/employees/"+empId).set({days});
    else this.saveLocal();
    return n;
  },
  async wipe(){
    if (this.mode==="db"){
      const cols = ["restaurants","employees","recrutements"];
      for (const c of cols){
        const snap = await this.db.collection(c).get();
        for (const d of snap.docs) await this.db.collection(c).doc(d.id).delete();
      }
      for (const mk of Object.keys(S.months)){
        const snap = await this.db.collection("periods/"+mk+"/employees").get();
        for (const d of snap.docs) await this.db.collection("periods/"+mk+"/employees").doc(d.id).delete();
      }
      S.months = {}; S.recrutements = [];
    } else {
      S.restaurants=[]; S.employees=[]; S.months={}; S.recrutements=[]; this.saveLocal(); render();
    }
  },
  /* --- mode local --- */
  KEY:"tds-v1",
  loadLocal(){
    try{
      const raw = localStorage.getItem(this.KEY);
      if(raw){ const d = JSON.parse(raw); S.restaurants=d.restaurants||[]; S.employees=d.employees||[];
               S.months=d.months||{}; S.recrutements=d.recrutements||[]; }
    }catch(e){}
  },
  saveLocal(){
    if (this.mode!=="local") return;
    try{ localStorage.setItem(this.KEY, JSON.stringify({restaurants:S.restaurants, employees:S.employees, months:S.months, recrutements:S.recrutements})); }catch(e){}
  }
};

/* ---------- calculs ---------- */
function dayPlannedHours(day){
  if (!day || day.kind !== "work" || !Array.isArray(day.services)) return 0;
  let t = 0;
  for (const s of day.services){
    let d = toMin(s.end) - toMin(s.start);
    if (d < 0) d += 1440;
    d -= Number(s.breakMin||0);
    if (d > 0) t += d;
  }
  return t/60;
}
function dayActualHours(day){
  if (!day || day.kind !== "work") return 0;
  return (day.actual === null || day.actual === undefined || day.actual === "") ? dayPlannedHours(day) : Number(day.actual);
}
function dayIsValidated(day){ return !!(day && day.kind==="work" && day.validated); }
function dayRestaurants(day){
  if (!day || day.kind!=="work") return [];
  return [...new Set((day.services||[]).map(s=>s.restaurantId).filter(Boolean))];
}
function empById(id){ return S.employees.find(e=>e.id===id); }
function restoById(id){ return S.restaurants.find(r=>r.id===id); }
function restoName(id){ const r = restoById(id); return r ? r.name : "—"; }
function empName(e){ return (e.firstName+" "+e.lastName).trim() || "Sans nom"; }
function activeEmployees(){ return S.employees.filter(e=>e.active!==false); }

function weekDates(startStr){ const s = parseYmd(startStr); return Array.from({length:7},(_,i)=>ymd(addDays(s,i))); }

function contractStatus(e){
  if (!e.endDate) return {key:"cdi", label:"Sans terme", cls:"neutral"};
  const today = ymd(new Date());
  const n = daysBetween(today, e.endDate);
  if (n < 0)  return {key:"past", label:"Échu", cls:"neutral", days:n};
  if (n <= 7) return {key:"crit", label:"Fin dans "+n+" j", cls:"crit", days:n};
  if (n <= 30)return {key:"warn", label:"Fin dans "+n+" j", cls:"warn", days:n};
  return {key:"ok", label:"Fin le "+frDate(e.endDate), cls:"neutral", days:n};
}

/* le contrat couvre-t-il cette date ? */
function contratCouvre(e, date){
  if (!e) return true;
  if (e.startDate && date < e.startDate) return false;
  if (e.endDate && date > e.endDate) return false;
  return true;
}
/* un salarié n'apparaît sur une période que si son contrat la couvre,
   ou s'il y a quand même quelque chose de saisi (pour ne rien masquer d'anormal) */
function visibleSurPeriode(e, dates){
  if (S.showEchus) return true;
  for (const d of dates) if (contratCouvre(e, d)) return true;
  for (const d of dates) if (Store.dayOf(e.id, d)) return true;
  return false;
}
/* fins de contrat tombant dans la période affichée, ou dans les 30 jours qui suivent */
const HORIZON_DEPART = 30;
function departsPeriode(dates){
  if (!dates.length) return [];
  const debut = dates[0];
  const limite = ymd(addDays(parseYmd(dates[dates.length-1]), HORIZON_DEPART));
  const out = [];
  for (const e of activeEmployees()){
    if (!e.endDate) continue;
    if (e.endDate < debut || e.endDate > limite) continue;
    if (S.filterResto !== "all" && e.restaurantId !== S.filterResto) continue;
    if (!matchPole(e)) continue;
    out.push({e, fin:e.endDate, apres: ymd(addDays(parseYmd(e.endDate), 1)),
              dansPeriode: e.endDate <= dates[dates.length-1]});
  }
  return out.sort((a,b)=> a.fin.localeCompare(b.fin) || empName(a.e).localeCompare(empName(b.e)));
}
function estDernierJour(e, date){ return !!e.endDate && e.endDate === date; }

function raisonHorsContrat(e, date){
  if (!e) return null;
  if (e.startDate && date < e.startDate) return "Entrée dans l'effectif le "+frDate(e.startDate);
  if (e.endDate && date > e.endDate) return contratLabel(e.contractType)+" terminé le "+frDate(e.endDate);
  return null;
}

/* ---------- effectif requis / couverture des services ---------- */
const SERVICES = [{id:"midi", label:"Midi"}, {id:"soir", label:"Soir"}];
function fenetres(r){
  r = r || {};
  return [
    {id:"midi", label:"Midi", start:r.midiStart || "11:00", end:r.midiEnd || "15:00"},
    {id:"soir", label:"Soir", start:r.soirStart || "18:00", end:r.soirEnd || "23:30"}
  ];
}
function cibleDe(r, jour, servId){
  const c = ((r && r.cible) || {})[String(jour)] || {};
  const v = c[servId] || {};
  return {cui:Number(v.cui)||0, sal:Number(v.sal)||0, ferme:!!v.ferme};
}
function cibleDefinie(r){
  if (!r || !r.cible) return false;
  for (const j in r.cible) for (const s in r.cible[j]){
    const v = r.cible[j][s];
    if (Number(v.cui) || Number(v.sal) || v.ferme) return true;
  }
  return false;
}
/* un service compte pour la fenêtre s'il la chevauche d'au moins une heure */
function chevauche(svc, fen){
  const s = Math.max(toMin(svc.start), toMin(fen.start));
  const e = Math.min(toMin(svc.end), toMin(fen.end));
  return (e - s) >= 60;
}
function couvertureBrute(restoId, date, fen){
  const presents = [];
  for (const e of activeEmployees()){
    const day = Store.dayOf(e.id, date);
    if (!day || day.kind !== "work") continue;
    if ((day.services||[]).some(s => (s.restaurantId||"") === restoId && chevauche(s, fen))) presents.push(e);
  }
  return {
    presents: presents.length,
    cui: presents.filter(e => poleOf(e) === "cuisine").length,
    sal: presents.filter(e => poleOf(e) === "salle").length,
    equipe: presents
  };
}
function ecartService(r, date, fen){
  const jour = (parseYmd(date).getDay()+6)%7;
  const c = cibleDe(r, jour, fen.id);
  const cov = couvertureBrute(r.id, date, fen);
  if (c.ferme) return {r, date, fen, c, cov, ferme:true, requis:0, mc:0, ms:0,
                       manque:0, exces:0, incomplet:false};
  if (!c.cui && !c.sal) return null;   /* service non paramétré */
  const mc = Math.max(0, c.cui - cov.cui), ms = Math.max(0, c.sal - cov.sal);
  const requis = c.cui + c.sal;
  return {r, date, fen, c, cov, ferme:false, mc, ms, requis,
          manque: mc + ms, exces: Math.max(0, cov.presents - requis),
          incomplet: !!(mc || ms)};
}
function manquesPeriode(dates, restoFilter){
  const out = [];
  for (const r of S.restaurants){
    if (restoFilter !== "all" && r.id !== restoFilter) continue;
    if (!cibleDefinie(r)) continue;
    for (const d of dates)
      for (const fen of fenetres(r)){
        const ec = ecartService(r, d, fen);
        if (ec && ec.incomplet) out.push(ec);
      }
  }
  return out.sort((a,b)=> a.date.localeCompare(b.date) || (a.fen.id==="midi"?0:1)-(b.fen.id==="midi"?0:1));
}
function libelleManque(ec){
  const bits = [];
  if (ec.mc) bits.push(ec.mc+" en cuisine");
  if (ec.ms) bits.push(ec.ms+" en salle");
  return "manque " + bits.join(" et ");
}
/* proposition d'équipe type à partir des semaines déjà chargées */
function deduireCible(restoId){
  const r = restoById(restoId);
  const cible = {};
  const auj = new Date();
  const median = a => { if (!a.length) return 0; const b = a.slice().sort((x,y)=>x-y); return Math.round(b[Math.floor(b.length/2)]); };
  for (let j=0; j<7; j++){
    cible[j] = {};
    for (const fen of fenetres(r)){
      const cs = [], ss = [];
      for (let k=0; k<=8 && cs.length < 4; k++){
        const d = ymd(addDays(startOfWeek(addDays(auj, -7*k)), j));
        const cov = couvertureBrute(restoId, d, fen);
        if (!cov.presents) continue;
        cs.push(cov.cui); ss.push(cov.sal);
      }
      const ouvert = cs.length > 0;
      cible[j][fen.id] = ouvert ? {cui:median(cs), sal:median(ss), ferme:false} : {cui:0, sal:0, ferme:true};
    }
  }
  return cible;
}

/* heures d'une semaine ISO pour un salarié (toutes dates de la semaine) */
function weekHours(empId, mondayStr){
  const dates = weekDates(mondayStr);
  let planned=0, actual=0, days=0;
  for (const d of dates){
    const day = Store.dayOf(empId, d);
    if (!day) continue;
    if (day.kind === "work"){ planned += dayPlannedHours(day); actual += dayActualHours(day); days++; }
  }
  return {planned, actual, days};
}
function overtimeSplit(actualH, contractH){
  const base = Number(contractH)||0;
  const hs = Math.max(0, actualH - SEUIL_LEGAL);
  const hs25 = Math.min(hs, 8);
  const hs50 = Math.max(0, hs - 8);
  const compl = base < SEUIL_LEGAL ? Math.max(0, Math.min(actualH, SEUIL_LEGAL) - base) : 0;
  return {hs25, hs50, compl, hs};
}

const TABS = [
  {id:"planning",  label:"Planning"},
  {id:"equipe",    label:"Équipe & contrats"},
  {id:"remplace",  label:"Remplacements"},
  {id:"heures",    label:"Heures & absences"},
  {id:"paie",      label:"Récap paie"},
  {id:"recrut",    label:"Recrutements"}
];
function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  let nbManques = 0;
  try { if (S.ready && S.restaurants.length) nbManques = manquesPeriode(weekDates(S.weekStart), "all").length; } catch(e){}
  for (const t of TABS){
    const b = document.createElement("button");
    b.className="tab"; b.type="button"; b.role="tab"; b.textContent=t.label;
    b.setAttribute("aria-selected", S.tab===t.id ? "true":"false");
    if (t.id === "planning" && nbManques){
      const badge = document.createElement("span");
      badge.className = "tabbadge";
      badge.textContent = nbManques > 99 ? "99+" : String(nbManques);
      badge.title = nbManques+" service(s) incomplet(s) sur la semaine affichée, tous restaurants confondus";
      b.appendChild(badge);
    }
    if (t.id === "recrut"){
      const n = recrutOuverts().length;
      if (n){
        const badge = document.createElement("span");
        badge.className = "tabbadge";
        badge.style.background = "var(--warn)";
        badge.textContent = String(n);
        badge.title = n+" besoin(s) de recrutement ouvert(s)";
        b.appendChild(badge);
      }
    }
    b.onclick = () => { S.tab = t.id; render(); window.scrollTo({top:0}); };
    el.appendChild(b);
  }
}
function render(){
  renderTabs();
  document.getElementById("brandsub").textContent =
    S.restaurants.length ? S.restaurants.length + (S.restaurants.length>1?" restaurants · ":" restaurant · ") + activeEmployees().length + " salariés" : "";
  const v = document.getElementById("view");
  v.innerHTML = "";
  if (!S.ready){ v.innerHTML = '<div class="empty">Chargement des données…</div>'; return; }
  if (!S.restaurants.length){ v.appendChild(viewOnboarding()); return; }
  if (S.tab==="planning") v.appendChild(viewPlanning());
  else if (S.tab==="equipe") v.appendChild(viewEquipe());
  else if (S.tab==="remplace") v.appendChild(viewRemplacements());
  else if (S.tab==="heures") v.appendChild(viewHeures());
  else if (S.tab==="paie") v.appendChild(viewPaie());
  else if (S.tab==="recrut") v.appendChild(viewRecrutements());
}
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k==="class") n.className = attrs[k];
    else if (k==="html") n.innerHTML = attrs[k];
    else if (k.startsWith("on")) n[k] = attrs[k];
    else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    n.appendChild(typeof kid === "string" || typeof kid === "number" ? document.createTextNode(String(kid)) : kid);
  }
  return n;
}

function viewPlanningSemaine(){
  const wrap = el("div");
  const dates = weekDates(S.weekStart);
  const today = ymd(new Date());

  /* barre de contrôle */
  const bar = el("div",{class:"row noprint",style:"margin-bottom:16px"},
    el("div",{class:"row",style:"gap:4px"},
      el("button",{class:"btn sm",title:"Semaine précédente",onclick:()=>{S.weekStart=ymd(addDays(parseYmd(S.weekStart),-7));Store.syncMonths();render();}},"◀"),
      el("button",{class:"btn sm",onclick:()=>{S.weekStart=ymd(startOfWeek(new Date()));Store.syncMonths();render();}},"Cette semaine"),
      el("button",{class:"btn sm",title:"Semaine suivante",onclick:()=>{S.weekStart=ymd(addDays(parseYmd(S.weekStart),7));Store.syncMonths();render();}},"▶")
    ),
    el("div",{style:"margin-right:auto"},
      el("div",{class:"eyebrow"},"Semaine "+isoWeekKey(parseYmd(S.weekStart)).split("-S")[1]),
      el("div",{style:"font-family:var(--display);font-weight:600;font-size:15px"},
        frDate(dates[0])+" → "+frDate(dates[6]))
    ),
    viewSwitch(),
    poleSeg(),
    restoSelect(S.filterResto, v=>{S.filterResto=v;render();}, true),
    el("button",{class:"btn sm",title:"Recopier les services de la semaine précédente sur les journées encore vides",onclick:()=>dupliquerSemaine()},"Copier la semaine précédente"),
    el("button",{class:"btn sm",onclick:()=>window.print()},"Imprimer")
  );
  wrap.appendChild(bar);

  /* lignes */
  const tous = activeEmployees().filter(e => (S.filterResto==="all" || e.restaurantId===S.filterResto) && matchPole(e));
  const list = tous.filter(e => visibleSurPeriode(e, dates));
  wrap.appendChild(encartDeparts(dates));
  wrap.appendChild(barreMasques(tous.length - list.length, "cette semaine"));
  const extra = [];
  if (S.filterResto !== "all"){
    for (const e of activeEmployees()){
      if (e.restaurantId === S.filterResto || !matchPole(e)) continue;
      const works = dates.some(d => dayRestaurants(Store.dayOf(e.id,d)).includes(S.filterResto));
      if (works) extra.push(e);
    }
  }
  if (!list.length && !extra.length){
    wrap.appendChild(el("div",{class:"card empty"},
      el("h3",null,"Aucun salarié pour ce filtre"),
      el("p",null,"Ajoutez votre équipe dans l'onglet « Équipe & contrats »."),
      el("button",{class:"btn primary",style:"margin-top:10px",onclick:()=>{S.tab="equipe";render();}},"Aller à l'équipe")));
    return wrap;
  }

  const table = el("table",{class:"plan"});
  const thead = el("thead");
  const hr = el("tr");
  hr.appendChild(el("th",{class:"corner"}, el("span",{class:"eyebrow"},"Salarié")));
  for (const d of dates){
    const dd = parseYmd(d);
    hr.appendChild(el("th",{class:"day"+(d===today?" today":"")},
      el("div",{class:"dn"}, JOURS[(dd.getDay()+6)%7]),
      el("div",{class:"dd"}, dd.getDate()+"/"+pad(dd.getMonth()+1))));
  }
  hr.appendChild(el("th",{class:"tot"}, el("span",{class:"eyebrow"},"Semaine")));
  thead.appendChild(hr); table.appendChild(thead);

  const tbody = el("tbody");
  const groups = S.filterResto==="all"
    ? S.restaurants.map(r => ({title:r.name, restoId:r.id, emps:list.filter(e=>e.restaurantId===r.id)}))
        .concat([{title:"Sans restaurant", emps:list.filter(e=>!restoById(e.restaurantId))}])
    : [{title:restoName(S.filterResto), emps:list},
       {title:"Renforts d'autres restaurants", emps:extra}];

  let anyRow = false;
  for (const g of groups){
    if (!g.emps.length) continue;
    anyRow = true;
    const gr = el("tr",{class:"grouphead"});
    gr.appendChild(el("td",{colspan:9}, g.title+" · "+g.emps.length));
    tbody.appendChild(gr);
    g.emps.sort((a,b)=>empName(a).localeCompare(empName(b)));
    for (const e of g.emps) tbody.appendChild(planRow(e, dates));
    if (g.restoId){
      const r = restoById(g.restoId);
      if (r && cibleDefinie(r)) tbody.appendChild(ligneCouverture(r, dates));
    }
  }
  if (S.filterResto !== "all"){
    const r = restoById(S.filterResto);
    if (r && cibleDefinie(r)) tbody.appendChild(ligneCouverture(r, dates));
  }
  if (!anyRow) tbody.appendChild(el("tr",null,el("td",{colspan:9,class:"empty"},"Aucun salarié.")));
  table.appendChild(tbody);
  wrap.appendChild(el("div",{class:"planwrap"}, table));
  wrap.appendChild(encartManques(dates));

  wrap.appendChild(el("div",{class:"legend noprint"},
    lg("work","Service"), lg("renfort","Renfort dans un autre restaurant"),
    lg("abs","Absence"),
    el("span",null,"Cliquez sur une case pour saisir un service, un repos ou une absence. Le motif d'absence se saisit dans la fenêtre et se retrouve dans « Heures & absences » et le récap de paie.")));
  return wrap;
}

function ligneCouverture(r, dates){
  const tr = el("tr",{class:"couv"});
  tr.appendChild(el("td",{class:"emp"},
    el("div",{class:"eyebrow"},"Couverture"),
    el("div",{class:"mono",style:"font-size:10px;color:var(--muted)"},
      fenetres(r).map(f=>f.label.charAt(0)+" "+f.start+"–"+f.end).join(" · "))));
  for (const d of dates){
    const td = el("td",{class:"cell cv"});
    for (const fen of fenetres(r)){
      const ec = ecartService(r, d, fen);
      const ligne = el("div",{class:"cvline"}, el("b",null,fen.label.charAt(0)));
      if (!ec){
        ligne.appendChild(el("span",{class:"cvval off",title:"Service non paramétré ce jour-là"},"—"));
      } else if (ec.ferme){
        ligne.appendChild(ec.cov.presents
          ? el("span",{class:"cvval plus",style:"color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)",
              title:"Service marqué fermé, mais "+ec.cov.presents+" personne(s) y sont planifiées"},
              "fermé · "+ec.cov.presents)
          : el("span",{class:"cvval off",title:r.name+" est fermé sur ce service"},"fermé"));
      } else {
        const cls = ec.incomplet ? "bad" : (ec.exces ? "plus" : "ok");
        const detail = ec.incomplet
          ? libelleManque(ec)
          : (ec.exces ? ec.exces+" de plus que l'équipe type" : "équipe au complet");
        ligne.appendChild(el("span",{class:"cvval "+cls,
          title: r.name+" · "+fen.label.toLowerCase()+" du "+frDate(d)+" — "+detail},
          ec.cov.presents+"/"+ec.requis));
      }
      td.appendChild(ligne);
    }
    tr.appendChild(td);
  }
  tr.appendChild(el("td",{class:"total"}));
  return tr;
}

    el("div",{class:"row",style:"margin-bottom:8px"},
      el("span",{class:"eyebrow",style:"color:var(--crit)"},"Services incomplets"),
      el("span",{class:"pill crit"}, manques.length + (S.filterResto==="all" ? " cette semaine" : " sur "+restoName(S.filterResto)))));

  for (const ec of manques.slice(0,20)){

      el("span",{style:"color:var(--crit);font-weight:600"}, libelleManque(ec)),

        "cuisine "+ec.cov.cui+"/"+ec.c.cui+" · salle "+ec.cov.sal+"/"+ec.c.sal),

function chercherRenfort(ec){
  R.restoId = ec.r.id;
  R.date = ec.date;
  R.start = ec.fen.start;
  R.end = ec.fen.end;
  S.filterPole = ec.mc ? "cuisine" : (ec.ms ? "salle" : "all");

  render();
  window.scrollTo({top:0});
  toast("Recherche de renfort — "+ec.r.name+", "+ec.fen.label.toLowerCase()+" du "+frDate(ec.date)+".");

function lg(cls,txt){
  const s = el("span");
  const sw = el("span",{class:"swatch chip "+cls,style:"padding:0"});
  s.append(sw, document.createTextNode(txt));
  return s;
}
function planRow(e, dates){
  const tr = el("tr");
  const home = restoById(e.restaurantId);
  const st = contractStatus(e);
  const nameCell = el("td",{class:"emp"},
    el("div",{class:"empname"}, empName(e)),
    el("div",{class:"emprole"}, (e.role||"—") + " · " + contratLabel(e.contractType) + " " + (e.weeklyHours||0) + "h"),
    (st.cls==="crit"||st.cls==="warn") ? el("span",{class:"pill "+st.cls,style:"margin-top:4px"}, st.label) : null
  );
  tr.appendChild(nameCell);

  let planned = 0;
  for (const d of dates){
    const day = Store.dayOf(e.id, d);
    if (day && day.kind==="work") planned += dayPlannedHours(day);
    tr.appendChild(planCell(e, d, day, home));
  }
  const contract = Number(e.weeklyHours)||0;
  const pct = contract ? Math.min(100, planned/contract*100) : 0;
  const over = contract && planned > contract + .01;
  const under = contract && planned < contract - .01;
  const tot = el("td",{class:"total"},
    el("div",{class:"mono",style:"font-weight:600;font-size:13px"}, fmtHshort(planned)+" h"),
    el("div",{class:"mono",style:"font-size:10.5px;color:var(--muted)"}, "/ "+contract+" h"),
    contract ? el("div",{class:"hbar"}, el("i",{class:over?"over":(under?"under":""),style:"width:"+(over?100:pct)+"%"})) : null
  );
  tr.appendChild(tot);
  return tr;
}
function planCell(e, date, day, home){
  const hors = raisonHorsContrat(e, date);
  const td = el("td",{class:"cell"+(hors?" hors":"")});
  const btn = el("button",{class:"cellbtn",onclick:()=>openDayModal(e,date)});
  btn.setAttribute("aria-label", empName(e)+" — "+frDateLong(date)+(hors?" — hors contrat":""));
  if (hors) { btn.title = "Hors contrat — "+hors; td.classList.toggle("hors", !day); }
  if (estDernierJour(e, date)){
    td.classList.add("fincontrat");
    btn.title = "Dernier jour de contrat — "+contratLabel(e.contractType)+" terminé le "+frDate(e.endDate);
    btn.appendChild(el("span",{class:"chip fin"},
      el("span",{class:"tag"},"! Dernier jour"), contratLabel(e.contractType)+" terminé"));
  }
  if (!day){ btn.appendChild(el("span",{class:"plus"},"+")); }
  else if (day.kind === "absence"){
    /* le motif est enregistré mais volontairement masqué sur le planning */
    btn.appendChild(el("span",{class:"chip abs"}, "Absence"));
  } else {
    if (hors) btn.appendChild(el("span",{class:"chip hors"},
      el("span",{class:"tag"},"Hors contrat"), hors));
    for (const s of (day.services||[])){
      const ailleurs = s.restaurantId && home && s.restaurantId !== home.id;
      const chip = el("span",{class:"chip "+(ailleurs?"renfort":"work")});
      if (ailleurs) chip.appendChild(el("span",{class:"tag"},"↔ "+restoName(s.restaurantId)));
      chip.appendChild(document.createTextNode(s.start+"–"+s.end + (s.breakMin?" ·"+s.breakMin+"m":"")));
      btn.appendChild(chip);
    }
    if (day.actual !== null && day.actual !== undefined && day.actual !== ""){
      const diff = Number(day.actual) - dayPlannedHours(day);
      btn.appendChild(el("span",{class:"mono",style:"font-size:10px;color:"+(Math.abs(diff)<.01?"var(--muted)":"var(--warn)")},
        "réel "+fmtHshort(Number(day.actual))+" h"+(Math.abs(diff)>=.01?(diff>0?" (+"+fmtHshort(diff)+")":" ("+fmtHshort(diff)+")"):"")));
    }
  }
  td.appendChild(btn);
  return td;
}

/* ---------- modale : équipe type d'un restaurant ---------- */
function openCibleModal(restoId){
  const r = restoById(restoId);
  if (!r) return toast("Choisissez d'abord un restaurant.");
  const d = {
    midiStart: r.midiStart || "11:00", midiEnd: r.midiEnd || "15:00",
    soirStart: r.soirStart || "18:00", soirEnd: r.soirEnd || "23:30",
    cible: JSON.parse(JSON.stringify(r.cible || {}))
  };
  const val = (j, s, k) => { const v = ((d.cible[String(j)]||{})[s]||{}); return v[k]; };
  const set = (j, s, k, x) => {
    d.cible[String(j)] = d.cible[String(j)] || {};

/* ---------- vue : planning au mois ---------- */
function dayCode(day, homeId){
  if (!day) return null;
  /* le motif est enregistré mais volontairement masqué sur le planning */
  if (day.kind === "absence") return {txt:"ABS", cls:"abs", title:"Absence"};
  const svc = day.services || [];
  if (!svc.length) return null;
  const ailleurs = svc.some(s => s.restaurantId && s.restaurantId !== homeId);
  const txt = svc.length >= 2 ? "C" : (toMin(svc[0].start) < 15*60 ? "M" : "S");
  const detail = svc.map(s => s.start+"–"+s.end + (s.restaurantId!==homeId ? " @"+restoName(s.restaurantId) : "")).join(" / ");
  return {txt, cls: ailleurs ? "renfort" : "work", title: detail+" · "+fmtHshort(dayPlannedHours(day))+" h"};
}
function monthDates(mk){
  const [y,m] = mk.split("-").map(Number);
  const n = new Date(y, m, 0).getDate();
  return Array.from({length:n}, (_,i) => y+"-"+pad(m)+"-"+pad(i+1));
}

        absN ? el("div",{class:"mono",style:"font-size:10px;color:var(--warn)"}, absN+" j abs.") : null));
      tbody.appendChild(tr);

  const ftr = el("tr",{class:"effectif"});

}

/* ---------- copier la semaine précédente ---------- */
async function dupliquerSemaine(){
  const cible = weekDates(S.weekStart);
  const source = weekDates(ymd(addDays(parseYmd(S.weekStart), -7)));
  const concernes = activeEmployees().filter(e => S.filterResto==="all" || e.restaurantId===S.filterResto);
  let n = 0, ignores = 0, horsC = 0;
  const plan = [];
  for (const e of concernes){
    const byMonth = {};
    for (let i=0;i<7;i++){
      const src = Store.dayOf(e.id, source[i]);
      if (!src || src.kind !== "work") continue;
      if (!contratCouvre(e, cible[i])) { horsC++; continue; }
      if (Store.dayOf(e.id, cible[i])) { ignores++; continue; }
      const mk = monthKeyOf(cible[i]);
      (byMonth[mk] = byMonth[mk] || {})[cible[i]] = {
        kind:"work", services: JSON.parse(JSON.stringify(src.services||[])),
        actual:null, validated:false, note: src.note||"", absenceType:""
      };
      n++;
    }
    if (Object.keys(byMonth).length) plan.push({e, byMonth});
  }
  if (!n) return toast(ignores ? "Rien à copier : ces journées sont déjà remplies."
    : horsC ? "Rien à copier : ces journées tombent hors contrat."
    : "Aucun service à copier sur la semaine précédente.");
  const ok = await ask(n+" journée"+(n>1?"s":"")+" seront recopiées depuis la semaine du "+frDate(source[0])+"."+
    (ignores ? " "+ignores+" journée(s) déjà remplie(s) seront laissées telles quelles." : "")+
    (horsC ? " "+horsC+" journée(s) hors contrat seront ignorées." : ""), "Copier");
  if (!ok) return;
  for (const p of plan) for (const mk of Object.keys(p.byMonth)) await Store.setDays(p.e.id, mk, p.byMonth[mk]);
  render();
  toast(n+" journée"+(n>1?"s":"")+" copiée"+(n>1?"s":"")+(horsC ? " — "+horsC+" hors contrat ignorée(s)." : "."));
}

/* ---------- modale : journée ---------- */
function openDayModal(e, date){
  const existing = Store.dayOf(e.id, date);
  const state = existing
    ? JSON.parse(JSON.stringify(existing))
    : {kind:"work", services:[{start:"11:00", end:"15:00", breakMin:0, restaurantId:e.restaurantId}], actual:null, validated:false, absenceType:"CP", note:""};
  if (!state.services || !state.services.length) state.services=[{start:"11:00",end:"15:00",breakMin:0,restaurantId:e.restaurantId}];

  const horsContrat = raisonHorsContrat(e, date);
  const body = el("div");
  if (horsContrat){
    body.appendChild(el("div",{class:"banner",style:"border-color:var(--crit-line);background:var(--crit-soft);color:var(--crit)"},
      el("div",null,
        el("strong",null,"Journée hors contrat."), " ", horsContrat, ". ",
        "Planifier ce jour-là reste possible, mais la saisie vous demandera confirmation. ",
        el("button",{class:"btn sm",style:"margin-left:4px",onclick:()=>{closeModal();openEmpModal(e);}},"Modifier le contrat"))));
  }
  const kindSeg = el("div",{class:"seg"});
  const kinds = [["work","Service"],["absence","Absence"],["off","Repos"]];
  const curKind = existing ? (existing.kind==="absence"?"absence":"work") : "work";
  let kind = curKind;
  function paint(){
    [...kindSeg.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.k===kind ? "true":"false"));
    workBox.hidden = kind!=="work";
    absBox.hidden  = kind!=="absence";
    offBox.hidden  = kind!=="off";
  }
  for (const [k,l] of kinds){
    const b = el("button",{type:"button",onclick:()=>{kind=k;paint();}}, l);
    b.dataset.k = k; kindSeg.appendChild(b);
  }

  /* services */
  const svcList = el("div",{style:"display:flex;flex-direction:column;gap:10px"});
  function renderSvc(){
    svcList.innerHTML="";
    state.services.forEach((s,i)=>{
      const box = el("div",{class:"svcbox"});
      box.append(el("div",{class:"row",style:"justify-content:space-between"},
        el("span",{class:"eyebrow"}, i===0?"Service 1":"Service "+(i+1)+" (coupure)"),
        state.services.length>1 ? el("button",{class:"btn ghost sm",onclick:()=>{state.services.splice(i,1);renderSvc();}},"Retirer") : null
      ));
      const g = el("div",{class:"grid3"});
      g.append(
        fld("Début", inp("time", s.start, v=>s.start=v)),
        fld("Fin", inp("time", s.end, v=>s.end=v)),
        fld("Pause (min)", inp("number", s.breakMin||0, v=>s.breakMin=Number(v)||0))
      );
      box.append(g);
      const sel = el("select",{onchange:ev=>{s.restaurantId=ev.target.value;}});
      S.restaurants.forEach(r=>{
        const o=el("option",{value:r.id}, r.name + (r.id===e.restaurantId?" (rattachement)":""));
        if ((s.restaurantId||e.restaurantId)===r.id) o.selected=true;
        sel.appendChild(o);
      });
      box.append(fld("Restaurant", sel));
      svcList.appendChild(box);
    });
  }
  renderSvc();
  /* répétition sur plusieurs jours / semaines */
  const jourIdx = (parseYmd(date).getDay()+6)%7;
  const rep = {jours:new Set([jourIdx]), semaines:1};
  const repDays = el("div",{class:"row",style:"gap:4px"});
  JOURS.forEach((j,i)=>{
    const b = el("button",{type:"button",class:"daytog","aria-pressed": i===jourIdx?"true":"false",
      title: j.charAt(0).toUpperCase()+j.slice(1)}, JOURS_ABR[i]);
    b.onclick = () => {
      if (i===jourIdx) return;
      if (rep.jours.has(i)) rep.jours.delete(i); else rep.jours.add(i);
      b.setAttribute("aria-pressed", rep.jours.has(i)?"true":"false");
      majCount();
    };
    if (i===jourIdx) b.classList.add("locked");
    repDays.appendChild(b);

  const semInp = el("input",{type:"number",min:"1",max:"12",value:"1",style:"width:76px"});
  semInp.onchange = () => { rep.semaines = Math.max(1, Math.min(12, Number(semInp.value)||1)); semInp.value = rep.semaines; majCount(); };
  const repCount = el("div",{class:"note"});
  function repDates(){
    const monday = startOfWeek(parseYmd(date));
    const out = [];
    for (let w=0; w<rep.semaines; w++)
      for (const j of [...rep.jours].sort((a,b)=>a-b))
        out.push(ymd(addDays(monday, w*7 + j)));
    return [...new Set(out)];

  function majCount(){
    const d = repDates();

      ? d.length+" journées enregistrées d'un coup"+(remplaces ? " — dont "+remplaces+" déjà remplie"+(remplaces>1?"s":"")+" qui ser"+(remplaces>1?"ont":"a")+" remplacée"+(remplaces>1?"s":"")+"." : ".")
      : "Cette journée uniquement.")

      return el("div",{class:"grid2"}, fld("Heures réellement effectuées", actInp), el("div",{style:"display:flex;align-items:flex-end"}, lab));
    })(),

  );

  const absSel = el("select");
  ABSENCES.forEach(a=>{ const o=el("option",{value:a.id}, a.label+(a.paid?" (payée)":"")); if(state.absenceType===a.id)o.selected=true; absSel.appendChild(o); });
  absSel.onchange = ev => state.absenceType = ev.target.value;

  const offBox = el("div",{class:"note"},"Le salarié n'est pas planifié ce jour-là. Enregistrer effacera le service ou l'absence existant.");

  const noteInp = el("textarea",{placeholder:"Remarque (optionnel)"}); noteInp.value = state.note||"";
  noteInp.oninput = ev => state.note = ev.target.value;

  body.append(kindSeg, el("div",{style:"height:14px"}), workBox, absBox, offBox, el("div",{style:"height:2px"}), fld("Note", noteInp));
  paint();

  openModal({
    title: empName(e),
    sub: frDateLong(date) + " · " + (restoName(e.restaurantId)),
    body,
    actions: [
      existing ? {label:"Effacer", cls:"btn danger", act: async close => { await Store.setDay(e.id, date, null); close(); toast("Journée effacée."); }} : null,

        if (kind==="absence"){
          const n = Math.max(1, Math.min(60, Number(absSpread.value)||1));
          const jours = [], ignores = [];
          for (let i=0;i<n;i++){
            const d = ymd(addDays(parseYmd(date), i));
            (contratCouvre(e, d) ? jours : ignores).push(d);
          }
          if (!jours.length){
            if (!await ask("Aucune de ces journées n'est couverte par le contrat de "+empName(e)+" ("+horsContrat+"). Enregistrer quand même ?","Enregistrer")) return;
            jours.push(...ignores); ignores.length = 0;
          }
          for (const d of jours)
            await Store.setDay(e.id, d, {kind:"absence", absenceType:state.absenceType, note:state.note||"", services:[], actual:0, validated:true});
          close();
          return toast((jours.length>1 ? jours.length+" jours d'absence enregistrés" : "Absence enregistrée")
            + (ignores.length ? " — "+ignores.length+" journée(s) hors contrat ignorée(s)." : "."));
        }
        for (const s of state.services){
          if (!s.start || !s.end) return toast("Renseignez les heures de début et de fin.");
          if (!s.restaurantId) s.restaurantId = e.restaurantId;
        }
        const entry = {kind:"work", services:state.services, actual: state.actual, validated: !!state.validated, note: state.note||"", absenceType:""};
        const toutes = repDates();
        if (toutes.length <= 1){
          if (horsContrat && !await ask(
            "Le contrat de "+empName(e)+" ne couvre pas le "+frDateLong(date)+" ("+horsContrat+"). Planifier ce service quand même ?","Planifier")) return;
          await Store.setDay(e.id, date, entry);
          close(); return toast("Service enregistré.");
        }
        const cibles = toutes.filter(d => contratCouvre(e, d));
        const hors = toutes.length - cibles.length;
        if (!cibles.length){
          if (!await ask("Aucune de ces journées n'est couverte par le contrat de "+empName(e)+". Enregistrer quand même ?","Enregistrer")) return;
          cibles.push(...toutes);
        }
        /* la journée éditée garde ses heures réelles ; les autres repartent à zéro */
        const byMonth = {};
        for (const d of cibles){
          const mk = monthKeyOf(d);
          (byMonth[mk] = byMonth[mk] || {})[d] = d === date
            ? entry
            : {kind:"work", services: JSON.parse(JSON.stringify(state.services)), actual:null, validated:false, note: state.note||"", absenceType:""};
        }
        for (const mk of Object.keys(byMonth)) await Store.setDays(e.id, mk, byMonth[mk]);
        render();
        close(); toast(cibles.length+" journées enregistrées"+(hors ? " — "+hors+" journée(s) hors contrat ignorée(s)." : "."));
      }}
    ].filter(Boolean)
  });
}
function fld(label, input){ return el("label",{class:"fld"}, el("span",null,label), input); }
function inp(type, val, onchange){
  const i = el("input",{type});
  i.value = (val===null||val===undefined) ? "" : val;
  i.oninput = ev => onchange(ev.target.value);
  return i;
}
function restoSelect(value, onchange, withAll){
  const s = el("select",{style:"width:auto;min-width:190px"});
  if (withAll){ const o=el("option",{value:"all"},"Tous les restaurants"); if(value==="all")o.selected=true; s.appendChild(o); }
  S.restaurants.forEach(r=>{ const o=el("option",{value:r.id}, r.name); if(value===r.id)o.selected=true; s.appendChild(o); });
  s.onchange = ev => onchange(ev.target.value);
  return s;
}

async function archiver(e){
  if (!await ask("Archiver "+empName(e)+" ? Il disparaîtra du planning, des remplacements et du récap de paie. "+
    "Son historique est conservé et vous pourrez le réactiver depuis sa fiche.", "Archiver")) return;
  await Store.saveEmp(Object.assign({}, e, {active:false}));
  render(); toast(empName(e)+" archivé.");
}
async function archiverTous(liste){
  if (!await ask("Archiver "+liste.length+" salarié(s) dont le contrat est arrivé à terme ? "+
    "Leur historique est conservé.", "Tout archiver")) return;
  for (const e of liste) await Store.saveEmp(Object.assign({}, e, {active:false}));
  render(); toast(liste.length+" salarié(s) archivé(s).");
}

async function retirerHorsContrat(e, dates){
  if (!await ask("Retirer "+dates.length+" service(s) du planning de "+empName(e)+
    ", planifié(s) en dehors de son contrat ?", "Retirer")) return;
  const parMois = {};
  for (const d of dates) (parMois[monthKeyOf(d)] = parMois[monthKeyOf(d)] || []).push(d);
  let n = 0;
  for (const mk of Object.keys(parMois)) n += await Store.removeDays(e.id, mk, parMois[mk]);
  render();
  toast(n+" service(s) retiré(s) du planning.");
}

    el("div",{class:"row",style:"gap:20px"},
      el("label",{class:"row",style:"gap:8px;cursor:pointer"}, chkR, el("span",null,"Peut renforcer un autre restaurant")),
      el("label",{class:"row",style:"gap:8px;cursor:pointer"}, chkA, el("span",null,"Salarié actif")))
  );

  openModal({

    body,
    actions: [
      isNew ? null : {label:"Supprimer", cls:"btn danger", act: async close=>{
        if (!await ask("Supprimer définitivement "+empName(d)+" ? Ses plannings passés resteront enregistrés mais ne seront plus rattachés.","Supprimer")) return;
        await Store.removeEmp(d.id); close(); toast("Salarié supprimé.");
      }},
      {label:"Annuler", cls:"btn", act: c=>c()},

        await Store.saveEmp(d); close(); toast("Fiche enregistrée.");
      }}
    ].filter(Boolean)
  });
}

/* ============================================================
   Planning d'alternance : rythme, import de fichier, texte collé
   ============================================================ */
const MOIS_ABR = {"janv":0,"jan":0,"févr":1,"fev":1,"fév":1,"mars":2,"avr":3,"mai":4,"juin":5,
  "juil":6,"jui":6,"août":7,"aout":7,"sept":8,"sep":8,"oct":9,"nov":10,"déc":11,"dec":11};

/* Repère toutes les dates d'un texte, dans l'ordre de lecture.
   L'année manquante est déduite du contexte : dès qu'un mois recule par rapport
   au précédent, on bascule sur l'année suivante — un calendrier scolaire qui va
   de septembre à juin est donc réparti correctement sur deux années civiles.
   Une ligne contenant deux dates et un marqueur d'intervalle est développée. */
function parseDatesFromText(text, anneeDefaut){
  const MOISPAT = "janv|jan|févr|fev|fév|mars|avr|mai|juin|juil|jui|août|aout|sept|sep|oct|nov|déc|dec";
  const RE_PLAGE = new RegExp("(\\d{1,2})(?:er)?\\s*(?:au|à|-|–|—|→|->)\\s*(\\d{1,2})(?:er)?\\s+("+MOISPAT+")[a-zéû.]*\\.?\\s*(\\d{4})?", "gi");
  const RE_MOIS  = new RegExp("(\\d{1,2})(?:er)?\\s+("+MOISPAT+")[a-zéû.]*\\.?\\s*(\\d{4})?", "gi");
  const RE_ISO   = /\b(\d{4})-(\d{2})-(\d{2})\b/g;
  const RE_NUM   = /(?<![\d\/.\-])(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/g;
  const RE_NUM2  = /(?<![\d\/.\-])(\d{1,2})[\/\-.](\d{1,2})(?![\/\-.]?\d)/g;

  const etat = {annee: Number(anneeDefaut) || new Date().getFullYear(), dernierMois: null};
  const resoudre = (mois, anneeExplicite) => {
    if (anneeExplicite) etat.annee = anneeExplicite;
    else if (etat.dernierMois !== null && mois < etat.dernierMois) etat.annee++;
    etat.dernierMois = mois;
    return etat.annee;
  };
  const out = new Set();
  const ajouter = (annee, mois, jour) => {
    if (jour < 1 || jour > 31 || mois < 0 || mois > 11) return;
    const dt = new Date(annee, mois, jour);
    if (dt.getMonth() !== mois || dt.getDate() !== jour) return; /* 30 février, etc. */
    out.add(ymd(dt));
  };

  for (const ligne of String(text||"").split(/[\r\n]+/)){
    let m, traiteParPlage = false;

    RE_PLAGE.lastIndex = 0;
    while ((m = RE_PLAGE.exec(ligne))){
      const mois = MOIS_ABR[m[3].toLowerCase()];
      if (mois === undefined) continue;
      const j1 = Number(m[1]), j2 = Number(m[2]);
      if (j2 < j1) continue;
      const a = resoudre(mois, m[4] ? Number(m[4]) : null);
      for (let j = j1; j <= j2; j++) ajouter(a, mois, j);
      traiteParPlage = true;
    }
    if (traiteParPlage) continue;

    const jetons = [], couvert = [];
    RE_ISO.lastIndex = 0;
    while ((m = RE_ISO.exec(ligne))){
      jetons.push({pos:m.index, jour:Number(m[3]), mois:Number(m[2])-1, annee:Number(m[1])});
      couvert.push([m.index, m.index + m[0].length]);
    }
    RE_NUM.lastIndex = 0;
    while ((m = RE_NUM.exec(ligne))){
      let a = Number(m[3]); if (a < 100) a += a < 70 ? 2000 : 1900;
      jetons.push({pos:m.index, jour:Number(m[1]), mois:Number(m[2])-1, annee:a});
      couvert.push([m.index, m.index + m[0].length]);
    }
    RE_NUM2.lastIndex = 0;
    while ((m = RE_NUM2.exec(ligne))){
      if (couvert.some(([d0,f0]) => m.index >= d0 && m.index < f0)) continue;
      jetons.push({pos:m.index, jour:Number(m[1]), mois:Number(m[2])-1, annee:null});
    }
    RE_MOIS.lastIndex = 0;
    while ((m = RE_MOIS.exec(ligne))){
      const mois = MOIS_ABR[m[2].toLowerCase()];
      if (mois === undefined) continue;
      if (couvert.some(([d0,f0]) => m.index >= d0 && m.index < f0)) continue;
      jetons.push({pos:m.index, jour:Number(m[1]), mois, annee: m[3] ? Number(m[3]) : null});
    }

    const propres = [];
    jetons.sort((a,b)=>a.pos-b.pos);
    for (const j of jetons){
      if (j.jour < 1 || j.jour > 31 || j.mois < 0 || j.mois > 11) continue;
      if (propres.some(p => Math.abs(p.pos - j.pos) < 2)) continue;
      propres.push(j);
    }
    if (!propres.length) continue;

    const marqueur = /\b(?:au|à|jusqu\w*)\b|->|→|–|—|\s-\s/i.test(ligne);
    if (marqueur && propres.length >= 2){
      const p0 = propres[0], p1 = propres[propres.length-1];
      const a0 = resoudre(p0.mois, p0.annee);
      const a1 = resoudre(p1.mois, p1.annee);
      let d = new Date(a0, p0.mois, p0.jour);
      const fin = new Date(a1, p1.mois, p1.jour);
      let garde = 0;
      while (d <= fin && garde++ < 400){ out.add(ymd(d)); d = addDays(d,1); }
    } else {
      for (const p of propres) ajouter(resoudre(p.mois, p.annee), p.mois, p.jour);
    }
  }
  return [...out].sort();
}

/* Regroupe une liste de dates en plages lisibles */
function grouperPlages(dates){
  const out = [];
  let i = 0;
  while (i < dates.length){
    let j = i;
    while (j+1 < dates.length && daysBetween(dates[j], dates[j+1]) === 1) j++;
    out.push(i === j ? frDate(dates[i]) : "du "+frDate(dates[i])+" au "+frDate(dates[j]));
    i = j+1;
  }
  return out;
}

function openAlternanceModal(empPre){

    mode: "rythme",
    dates: [],
    source: "",
    debut: ymd(new Date()),
    fin: ymd(new Date(new Date().getFullYear()+1, 5, 30)),
    jours: new Set([0,1]),
    anneeBase: new Date().getFullYear(),
