<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>:root{color-scheme:light dark}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --surface-2:#EAEFF5; --surface-3:#DFE7F0;
  --border:#D9E1EA; --border-strong:#BDCBDA;
  --ink:#131C27; --ink-2:#3C4B5C; --muted:#6D7E90;
  --accent:#1F4FA3; --accent-soft:#E3ECFA; --accent-line:#B9CEEE; --accent-ink:#173D80; --on-accent:#FFFFFF;
  --renfort:#6B4A9E; --renfort-soft:#EEE7F9; --renfort-line:#D3C3EE;
  --ok:#1C6647; --ok-soft:#DFF0E7; --ok-line:#B3DCC7;
  --warn:#8A570A; --warn-soft:#FAEBD2; --warn-line:#EBCF9C;
  --crit:#A32C21; --crit-soft:#FBE4E1; --crit-line:#EFBDB6;
  --shadow-sm:0 1px 2px rgba(19,28,39,.07);
  --shadow-md:0 2px 4px rgba(19,28,39,.06),0 10px 30px -16px rgba(19,28,39,.30);
  --radius:10px;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141C; --surface:#151E28; --surface-2:#1C2733; --surface-3:#243140;
    --border:#293747; --border-strong:#3B4C5F;
    --ink:#E9EFF5; --ink-2:#BDCAD8; --muted:#8394A6;
    --accent:#7DA8EF; --accent-soft:#182A46; --accent-line:#2C4671; --accent-ink:#AFC8F7; --on-accent:#0D141C;
    --renfort:#B79BE8; --renfort-soft:#271E3C; --renfort-line:#3F3160;
    --ok:#6CC79A; --ok-soft:#122C20; --ok-line:#1F4A36;
    --warn:#E0B15F; --warn-soft:#332512; --warn-line:#54401C;
    --crit:#EF9082; --crit-soft:#371A16; --crit-line:#5A2C25;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 2px 4px rgba(0,0,0,.35),0 12px 34px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0D141C; --surface:#151E28; --surface-2:#1C2733; --surface-3:#243140;
  --border:#293747; --border-strong:#3B4C5F;
  --ink:#E9EFF5; --ink-2:#BDCAD8; --muted:#8394A6;
  --accent:#7DA8EF; --accent-soft:#182A46; --accent-line:#2C4671; --accent-ink:#AFC8F7; --on-accent:#0D141C;
  --renfort:#B79BE8; --renfort-soft:#271E3C; --renfort-line:#3F3160;
  --ok:#6CC79A; --ok-soft:#122C20; --ok-line:#1F4A36;
  --warn:#E0B15F; --warn-soft:#332512; --warn-line:#54401C;
  --crit:#EF9082; --crit-soft:#371A16; --crit-line:#5A2C25;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 4px rgba(0,0,0,.35),0 12px 34px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm)}
.topbar-in{max-width:1560px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:19px;font-weight:700}
.brand .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs{max-width:1560px;margin:0 auto;padding:0 22px;display:flex;gap:2px;flex-wrap:wrap}
.tabsbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:39}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:11px 14px;cursor:pointer;color:var(--muted);font-weight:500;font-family:var(--display);font-size:13.5px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1560px;margin:0 auto;padding:22px}
.section-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.section-head h2{font-size:17px;font-weight:600}
.section-head p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:64ch}

/* ---------- controls ---------- */
.btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{border-color:var(--crit-line);color:var(--crit);background:var(--crit-soft)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{background-color:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:7px 9px;font-size:13px;width:100%;min-height:36px;line-height:20px;box-shadow:none}
select,input[type=text],input[type=date],input[type=time],input[type=number]{height:36px}
select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select::-ms-expand{display:none}
input[type=date],input[type=time]{appearance:none;-webkit-appearance:none}
input:disabled,select:disabled,textarea:disabled{background-color:var(--surface-2);color:var(--muted);opacity:1}
textarea{resize:vertical;min-height:64px;font-family:var(--body)}
label.fld{display:flex;flex-direction:column;gap:5px}
label.fld > span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
.seg button{appearance:none;border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.checkgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:620px}
.empname-btn{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);
  font:inherit;font-weight:600;font-size:13px;line-height:1.25;border-bottom:1px dashed transparent}
.empname-btn:hover{color:var(--accent);border-bottom-color:var(--accent-line)}
.fichecal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.fichecal-head{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  text-align:center;padding:4px 0 6px}
.fichecal-cell{display:flex;flex-direction:column;gap:3px;min-height:92px;padding:6px;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;font:inherit;color:var(--ink)}
.fichecal-cell:hover:not(:disabled){border-color:var(--accent-line);background:var(--accent-soft)}
.fichecal-cell.hors-mois{background:var(--surface-2);border-style:dashed;opacity:.4;cursor:default}
.fichecal-cell.hc{background-image:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--border) 5px,var(--border) 6px)}
.fichecal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}
.fichecal-num{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
.fichecal-cell.today .fichecal-num{color:var(--accent)}
.fichecal-h{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:auto}
.fichecal-repos{font-size:11px;color:var(--border-strong);margin:auto auto}
input.rechemp{width:200px;min-width:160px;flex:0 0 auto}
.restodrop{position:relative;display:inline-block}
.restodrop-btn{display:inline-flex;align-items:center;gap:9px;min-width:190px;justify-content:space-between}
.restodrop-caret{font-size:9px;color:var(--muted);line-height:1}
.restodrop-panel{position:absolute;top:calc(100% + 4px);left:0;z-index:50;min-width:260px;max-height:340px;overflow:auto;
  background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-md);padding:6px}
.restodrop-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap}
.restodrop-item:hover{background:var(--surface-2)}
.restodrop-item input{width:auto;margin:0}
.restodrop-item.tous{font-weight:600;border-bottom:1px solid var(--border);border-radius:7px 7px 0 0;margin-bottom:4px}
.restodrop-foot{display:flex;gap:4px;align-items:center;border-top:1px solid var(--border);margin-top:4px;padding-top:6px}
.checkchip{display:inline-flex;align-items:center;gap:6px;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);padding:0 9px;font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.checkchip:hover{border-color:var(--border-strong);color:var(--ink)}
.checkchip input{width:14px;height:14px;margin:0;accent-color:var(--accent)}
.checkchip:has(input:checked){background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

/* ---------- cards / pills ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:16px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-line)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border-color:var(--border)}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.renfort{background:var(--renfort-soft);color:var(--renfort);border-color:var(--renfort-line)}
.stat{display:flex;flex-direction:column;gap:3px}
.stat .v{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.statrow > div{background:var(--surface);padding:14px 16px}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.subrow td{background:var(--surface-2);font-size:12px;color:var(--ink-2)}

/* ---------- planning grid ---------- */
.planwrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);max-height:none}
.plan{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px}
.plan th,.plan td{border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.plan th.day{background:var(--surface-2);padding:8px 10px;text-align:center;position:sticky;top:0;z-index:2}
.plan th.day .dn{font-family:var(--display);font-size:12.5px;font-weight:600;color:var(--ink);text-transform:capitalize}
.plan th.day .dd{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.plan th.day.today{background:var(--accent-soft)}
.plan th.day.today .dn{color:var(--accent)}
.plan th.corner{background:var(--surface-2);position:sticky;left:0;top:0;z-index:3;min-width:210px;text-align:left;padding:8px 12px}
.plan th.tot{background:var(--surface-2);position:sticky;right:0;top:0;z-index:3;min-width:112px;text-align:right;padding:8px 12px;border-right:0}
.plan td.emp{position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px;padding:7px 12px}
.plan td.total{position:sticky;right:0;background:var(--surface);z-index:1;text-align:right;padding:7px 12px;border-right:0}
.plan tr.grouphead td{background:var(--surface-3);font-family:var(--display);font-weight:600;font-size:12.5px;padding:6px 12px;position:sticky;left:0}
.plan td.cell{padding:4px;vertical-align:top;min-width:126px}
.empname{font-weight:600;font-size:13px;line-height:1.25}
.emprole{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cellbtn{width:100%;min-height:46px;border:1px dashed transparent;border-radius:7px;background:none;cursor:pointer;padding:3px;display:flex;flex-direction:column;gap:3px;text-align:left}
.cellbtn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.chip{border-radius:6px;padding:4px 6px;font-family:var(--mono);font-size:11px;line-height:1.35;font-weight:500;border:1px solid;display:block}
.chip.work{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip.renfort{background:var(--renfort-soft);border-color:var(--renfort-line);color:var(--renfort)}
.chip.abs{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.chip.abs.unpaid{background:var(--surface-2);border-color:var(--border-strong);color:var(--muted)}
.chip .tag{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.cellbtn .plus{color:var(--border-strong);font-size:16px;line-height:1;align-self:center;margin:auto}
.reposhab{margin:auto;font-size:11px;color:var(--border-strong);font-style:italic}
.fichecal-repos.hab{font-style:italic}
.cellbtn:hover .plus{color:var(--accent)}
/* vue mois */
.plan.month{min-width:0}
.plan th.mday{min-width:36px;padding:6px 2px}
.plan th.mday .dn{font-size:10px;font-family:var(--mono);color:var(--muted);font-weight:500}
.plan th.mday .dd{font-family:var(--display);font-size:12px;font-weight:600;color:var(--ink)}
.plan th.mday.we{background:var(--surface-3)}
.plan td.mc{padding:2px;min-width:36px;width:36px}
.plan td.mc.we{background:var(--surface-2)}
.plan td.mc.today{background:var(--accent-soft)}
.mcell{width:100%;height:30px;border-radius:5px;border:1px solid transparent;background:none;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;font-weight:600;line-height:1;padding:0;color:var(--muted)}
.mcell:hover{border-color:var(--border-strong)}
.mcell.work{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.mcell.renfort{background:var(--renfort-soft);border-color:var(--renfort-line);color:var(--renfort)}
.mcell.abs{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn);font-size:9.5px}
.mcell.abs.unpaid{background:var(--surface-2);border-color:var(--border-strong);color:var(--muted)}
.plan tr.effectif td{background:var(--surface-2);border-top:1px solid var(--border-strong)}
.plan tr.effectif td.emp{background:var(--surface-2)}
.daytog{appearance:none;border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;
  width:32px;height:32px;cursor:pointer;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);padding:0}
.daytog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.daytog.locked{cursor:default;opacity:.9}
/* couverture des services */
.plan tr.couv td{background:var(--surface-2);border-top:1px solid var(--border-strong)}
.plan tr.couv td.emp{background:var(--surface-2)}
.plan td.cv{padding:4px 3px;text-align:center;vertical-align:middle}
.cvline{display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--mono);font-size:11px;line-height:1.5}
.cvline b{font-weight:600;font-size:9.5px;letter-spacing:.06em;color:var(--muted);width:12px;text-align:left}
.cvval{font-variant-numeric:tabular-nums;padding:1px 5px;border-radius:5px;border:1px solid transparent}
.cvval.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.cvval.bad{color:var(--crit);background:var(--crit-soft);border-color:var(--crit-line);font-weight:700}
.cvval.plus{color:var(--muted);background:var(--surface-3)}
.cvval.off{color:var(--border-strong)}
.gapcard{border-color:var(--crit-line)}
.gaprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border)}
.gaprow:last-child{border-bottom:0}
.gaprow.tight{padding:5px 0;gap:8px;font-size:12.5px}
.gaprow.tight:last-of-type{border-bottom:0}
.gapwhen{font-family:var(--mono);font-size:12px;min-width:190px}
.tabbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:7px;
  border-radius:9px;background:var(--crit);color:var(--surface);font-family:var(--mono);font-size:10.5px;font-weight:700}
.cibletab{border-collapse:collapse;width:100%;font-size:12px}
.cibletab th{position:static;padding:6px 5px;text-align:center}
.cibletab td{padding:4px 5px;border-bottom:1px solid var(--border)}
.cibletab input[type=number]{width:48px;padding:4px 5px;text-align:center}
.cibletab .sep{border-left:1px solid var(--border-strong)}
/* journées hors contrat */
.plan td.hors{background-image:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--border) 5px,var(--border) 6px)}
.plan td.hors .cellbtn{opacity:.5}
.plan td.hors .cellbtn .plus{display:none}
.mcell.hors{opacity:.45}
.chip.hors,.mcell.horsviol{background:var(--crit-soft);border-color:var(--crit-line);color:var(--crit)}
/* dernier jour de contrat */
.chip.fin{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.plan td.fincontrat{box-shadow:inset -3px 0 0 var(--warn)}
.mcell.fincontrat{position:relative;box-shadow:inset 0 -3px 0 var(--warn)}
.mcell.fincontrat::after{content:"!";position:absolute;top:-1px;right:2px;font-size:9px;font-weight:700;color:var(--warn);line-height:1}
.hbar{height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-top:4px}
.hbar i{display:block;height:100%;background:var(--accent)}
.hbar i.over{background:var(--warn)}
.hbar i.under{background:var(--border-strong)}

/* ---------- misc ---------- */

<script>
"use strict";
/* ============================================================
   Planning — planification multi-restaurants
   ============================================================ */

/* ---------- utils : dates ---------- */
const JOURS = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const JOURS_ABR = ["Lu","Ma","Me","Je","Ve","Sa","Di"];
const MOIS  = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS_COURT = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const pad = n => String(n).padStart(2,"0");
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseYmd(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(d,n){ const x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d){ const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; return addDays(x,-w); }
function monthKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function monthKeyOf(s){ return s.slice(0,7); }
function frDate(s){ const d=parseYmd(s); return (d.getDate()===1?"1er":d.getDate())+" "+MOIS_COURT[d.getMonth()]+" "+d.getFullYear(); }
function frDateLong(s){ const d=parseYmd(s); return JOURS[(d.getDay()+6)%7]+" "+(d.getDate()===1?"1er":d.getDate())+" "+MOIS[d.getMonth()]+" "+d.getFullYear(); }
function isoWeekKey(d){
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay()+6)%7));
  const y = t.getFullYear();
  const jan4 = new Date(y,0,4);
  const wk = 1 + Math.round(((t - jan4)/86400000 - 3 + ((jan4.getDay()+6)%7))/7);
  return y+"-S"+pad(wk);
}
function daysBetween(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/86400000); }
function toMin(t){ const [h,m]=String(t||"0:0").split(":").map(Number); return (h||0)*60+(m||0); }
function fmtH(h){ if(h==null||isNaN(h)) return "—"; const s = Math.round(h*100)/100; return s.toFixed(2).replace(".",",")+" h"; }
function fmtHshort(h){ if(!h) return "0"; return (Math.round(h*100)/100).toString().replace(".",","); }
const uid = p => (p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const GITHUB_SYNC = {
  owner: "julienbenech-spec",
  repo: "planning",
  branch: "main",
  path: "data/planning-data.json",
  enabledKey: "tds-github-sync-enabled",
  tokenKey: "tds-github-token"
};
const TEAM_SYNC = {
  apiUrl: "https://planning-sync.julien-benech.workers.dev",
  apiUrlKey: "tds-team-sync-api-url",
  accessKeyKey: "tds-team-sync-access-key"
};
function githubApiUrl(){
  return "https://api.github.com/repos/" + GITHUB_SYNC.owner + "/" + GITHUB_SYNC.repo + "/contents/" + encodeURIComponent(GITHUB_SYNC.path).replace(/%2F/g,"/");
}
function teamSyncDefaultUrl(){ return TEAM_SYNC.apiUrl; }
/* Fichier de données publié à côté de la page (hébergement statique).
   Chemin relatif : fonctionne à la racine comme dans un sous-dossier GitHub Pages. */
const SEED_URL = "data/planning-data.json";
function encUtf8(s){ return btoa(unescape(encodeURIComponent(s))); }
function decUtf8(s){ return decodeURIComponent(escape(atob(String(s || "").replace(/\s/g,"")))); }

/* ---------- référentiels ---------- */
const CONTRATS = [
  {id:"CDI",   label:"CDI"},
  {id:"CDD",   label:"CDD"},
  {id:"EXTRA", label:"Extra"},
  {id:"APPR",  label:"Apprenti"},
  {id:"STAGE", label:"Stage"},
  {id:"INTER", label:"Intérim"}
];
/* calendaire : la période s'enregistre en entier, repos compris (dates fixées par un tiers).
   Sinon, seules les journées travaillées sont marquées. */
/* Libellés alignés sur la liste « Type d'absence » de Staff & Go.
   interne:true = mécanique interne au planning, jamais à saisir en paie. */
const ABSENCES = [
  {id:"CP",   label:"Congés payés",                       paid:true,  calendaire:false},
  {id:"MAL",  label:"Arrêt maladie",                      paid:false, calendaire:true},
  {id:"AT",   label:"Accident du travail / trajet",       paid:false, calendaire:true},
  {id:"CSS",  label:"Congé sans solde",                   paid:false, calendaire:false},
  {id:"ANRA", label:"Absence non rémunérée autorisée",    paid:false, calendaire:false},
  {id:"INJ",  label:"Absence non rémunérée non autorisée",paid:false, calendaire:false},
  {id:"FAM",  label:"Événement familial",                 paid:true,  calendaire:false},
  {id:"MAT",  label:"Congé maternité",                    paid:false, calendaire:true},
  {id:"PAT",  label:"Congé paternité",                    paid:false, calendaire:true},
  {id:"FORM", label:"Formation / école",                  paid:true,  calendaire:false, interne:true}
];
const absInterne = id => !!(ABSENCES.find(a=>a.id===id)||{}).interne;
const absCalendaire = id => !!(ABSENCES.find(a=>a.id===id)||{}).calendaire;
const POLES = [{id:"cuisine", label:"Cuisine"}, {id:"salle", label:"Salle"}];
const POSTES = [
  {label:"Kitchen Leader",     pole:"cuisine"},
  {label:"Kitchen Assistant",  pole:"cuisine"},
  {label:"Assistant Manager",  pole:"salle"},
  {label:"Employé polyvalent", pole:"salle"}
];
/* rattrapage pour d'anciens intitulés saisis en texte libre */
const POLE_LEGACY = {"Chef de cuisine":"cuisine","Chef de partie":"cuisine","Cuisinier":"cuisine","Commis":"cuisine",
  "Plongeur":"cuisine","Second de cuisine":"cuisine","Manager":"salle","Chef de rang":"salle","Serveur":"salle",
  "Serveuse":"salle","Runner":"salle","Barman":"salle","Barmaid":"salle","Hôte d'accueil":"salle"};
const poleLabel = id => (POLES.find(p=>p.id===id)||{label:"—"}).label;
function poleOf(e){
  if (e && e.pole) return e.pole;
  const p = POSTES.find(x => x.label === (e||{}).role);
  if (p) return p.pole;
  return POLE_LEGACY[(e||{}).role] || "";
}
const absLabel = id => (ABSENCES.find(a=>a.id===id)||{label:id}).label;
const contratLabel = id => (CONTRATS.find(c=>c.id===id)||{label:id}).label;
const SEUIL_LEGAL = 35;

/* ---------- état ---------- */
const S = {
  restaurants: [],
  employees: [],
  recrutements: [],
  recrutFiltre: "ouvert",
  clotures: {},               // "YYYY-MM" -> { hs:{empId:true}, abs:{cle:true} }
  months: {},                 // "YYYY-MM" -> { empId: {days:{...}} }
  tab: "planning",
  payView: "saisie",
  planView: "semaine",
  weekStart: ymd(startOfWeek(new Date())),
  planMonth: monthKey(new Date()),
  payMonth: monthKey(new Date()),
  filterResto: "all",
  filterRestos: ["all"],
  restoDropOpen: false,
  payRestos: ["all"],
  payDropOpen: false,
  ficheEmpId: null,
  ficheFrom: null,
  ficheMonth: monthKey(new Date()),
  rechercheEmp: "",
  filterPole: "all",
  showEchus: false,
  hoursFilter: "todo",
  lastSavedAt: "",
  syncStatus: "",
  ready: false
};

/* ---------- persistance ---------- */
const Store = {
  mode: "local",
  seeded: false,
  db: null,
  monthSubs: {},
  fileVersion: 2,
  remoteSha: "",
  remoteSaving: false,
  remoteDirty: false,
  remoteTimer: null,
  async init(){
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; }
    catch(e){ db = null; }
    if (db) { this.mode = "db"; this.db = db; this.wire(); }
    else if (this.teamSyncUrl()) await this.loadTeamSync();
    else await this.loadGithub();
    paintMode();
  },
  wire(){
    const err = e => { console.warn("db", e); toast("Connexion aux données interrompue. Rechargez la page."); };
    this.db.collection("restaurants").onSnapshot(snap => {
      S.restaurants = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      S.restaurants.sort((a,b)=>(a.order||0)-(b.order||0) || a.name.localeCompare(b.name));
      S.ready = true; render();
    }, err);
    this.db.collection("employees").onSnapshot(snap => {
      S.employees = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      S.ready = true; render();
    }, err);
    this.db.collection("recrutements").onSnapshot(snap => {
      S.recrutements = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      render();
    }, err);
    this.db.collection("clotures").onSnapshot(snap => {
      const c = {};
      snap.docs.forEach(d => { c[d.id] = d.data() || {}; });
      S.clotures = c; render();
    }, e => console.warn("clotures", e));
    this.syncMonths();
  },
  neededMonths(){
    const set = new Set([S.payMonth, S.planMonth]);
    if (S.ficheEmpId) set.add(S.ficheMonth);
    const ws = parseYmd(S.weekStart);
    for (let i=-7;i<14;i++) set.add(monthKey(addDays(ws,i)));
    /* mois voisins de la période de paie : les semaines à cheval en dépendent */
    const [py,pm] = S.payMonth.split("-").map(Number);
    set.add(monthKey(new Date(py, pm-2, 15)));
    set.add(monthKey(new Date(py, pm, 15)));
    return [...set];
  },
  syncMonths(){
    if (this.mode !== "db") return;
    const need = this.neededMonths();
    for (const k of Object.keys(this.monthSubs)) {
      if (!need.includes(k)) { this.monthSubs[k](); delete this.monthSubs[k]; }
    }
    for (const k of need) {
      if (this.monthSubs[k]) continue;
      this.monthSubs[k] = this.db.collection("periods/"+k+"/employees").onSnapshot(snap => {
        const m = {};
        snap.docs.forEach(d => { m[d.id] = d.data() || {days:{}}; });
        S.months[k] = m;
        render();
      }, e => console.warn("periods", e));
    }
  },
  /* --- lectures --- */
  dayOf(empId, date){
    const m = S.months[monthKeyOf(date)];
    if (!m || !m[empId] || !m[empId].days) return null;
    return m[empId].days[date] || null;
  },
  /* --- écritures --- */
  async saveResto(r){
    if (!r.id) r.id = uid("r");
    const p = restoById(r.id) || {};
    const pick = (a, b, d) => a !== undefined ? a : (b !== undefined ? b : d);
    const body = {
      name:  pick(r.name,  p.name,  ""),
      order: pick(r.order, p.order, 0),
      city:  pick(r.city,  p.city,  ""),
      midiStart: pick(r.midiStart, p.midiStart, "11:00"),
      midiEnd:   pick(r.midiEnd,   p.midiEnd,   "15:00"),
      soirStart: pick(r.soirStart, p.soirStart, "18:00"),
      soirEnd:   pick(r.soirEnd,   p.soirEnd,   "23:30"),
      cible: pick(r.cible, p.cible, {})
    };
    if (this.mode==="db") await this.db.doc("restaurants/"+r.id).set(body);
    else { const i=S.restaurants.findIndex(x=>x.id===r.id); const o=Object.assign({id:r.id},body); i<0?S.restaurants.push(o):S.restaurants[i]=o; this.saveLocal(); render(); }
    return r.id;
  },
  async removeResto(id){
    if (this.mode==="db") await this.db.doc("restaurants/"+id).delete();
    else { S.restaurants = S.restaurants.filter(r=>r.id!==id); this.saveLocal(); render(); }
  },
  async saveEmp(e){
    if (!e.id) e.id = uid("e");
    const body = {
      firstName:e.firstName||"", lastName:e.lastName||"", restaurantId:e.restaurantId||"",
      role:e.role||"", pole:e.pole||"", contractType:e.contractType||"CDI", weeklyHours:Number(e.weeklyHours)||0,
      startDate:e.startDate||"", endDate:e.endDate||"", essaiFin:e.essaiFin||"", essaiValideLe:e.essaiValideLe||"", phone:e.phone||"",
      joursTravailles: Array.isArray(e.joursTravailles) ? e.joursTravailles.slice().sort() : [],
      canReplace: e.canReplace !== false, active: e.active !== false, note:e.note||""
    };
    if (this.mode==="db") await this.db.doc("employees/"+e.id).set(body);
    else { const i=S.employees.findIndex(x=>x.id===e.id); const o=Object.assign({id:e.id},body); i<0?S.employees.push(o):S.employees[i]=o; this.saveLocal(); render(); }
    return e.id;
  },
  async saveRecrut(r){
    if (!r.id) r.id = uid("k");
    const body = {
      restaurantId:r.restaurantId||"", role:r.role||"", pole:r.pole||"",
      contractType:r.contractType||"CDD", weeklyHours:Number(r.weeklyHours)||0,
      dateBesoin:r.dateBesoin||"", origine:r.origine||"", note:r.note||"",
      statut:r.statut||"ouvert", sourceEmpId:r.sourceEmpId||"", cree:r.cree||new Date().toISOString().slice(0,10)
    };
    if (this.mode==="db") await this.db.doc("recrutements/"+r.id).set(body);
    else { const i=S.recrutements.findIndex(x=>x.id===r.id); const o=Object.assign({id:r.id},body);
           i<0?S.recrutements.push(o):S.recrutements[i]=o; this.saveLocal(); render(); }
    return r.id;
  },
  async removeRecrut(id){
    if (this.mode==="db") await this.db.doc("recrutements/"+id).delete();
    else { S.recrutements = S.recrutements.filter(r=>r.id!==id); this.saveLocal(); render(); }
  },
  /* --- clôture de mois : ce qui a déjà été saisi dans Staff & Go --- */
  coche(mk, groupe, cle){ return !!(((S.clotures[mk]||{})[groupe]||{})[cle]); },
  async cocher(mk, groupe, cle, on){
    const cur = S.clotures[mk] || {};
    const grp = Object.assign({}, cur[groupe] || {});
    if (on) grp[cle] = true; else delete grp[cle];
    const body = Object.assign({}, cur, {[groupe]: grp});
    delete body.id;
    S.clotures[mk] = body;
    if (this.mode==="db") await this.db.doc("clotures/"+mk).set(body);
    else this.saveLocal();
    render();
  },
  async videCloture(mk){
    const body = {hs:{}, abs:{}};
    S.clotures[mk] = body;
    if (this.mode==="db") await this.db.doc("clotures/"+mk).set(body);
    else this.saveLocal();
    render();
  },
  async removeEmp(id){
    if (this.mode==="db") await this.db.doc("employees/"+id).delete();
    else { S.employees = S.employees.filter(e=>e.id!==id); this.saveLocal(); render(); }
  },
  async setDay(empId, date, entry){
    const mk = monthKeyOf(date);
    S.months[mk] = S.months[mk] || {};
    S.months[mk][empId] = S.months[mk][empId] || {days:{}};
    const days = Object.assign({}, S.months[mk][empId].days || {});
    if (entry) days[date] = entry; else delete days[date];
    S.months[mk][empId] = {days};
    if (this.mode==="db"){
      const ref = this.db.doc("periods/"+mk+"/employees/"+empId);
      try {
        if (entry) await ref.update({days:{[date]:entry}});
        else await ref.set({days});
      } catch(err){ await ref.set({days}); }
    } else { this.saveLocal(); }
    render();
  },
  /* écriture groupée : tout un mois pour un salarié en un seul enregistrement */
  async setDays(empId, mk, daysObj){
    S.months[mk] = S.months[mk] || {};
    let base = (S.months[mk][empId] || {}).days;
    /* mois non chargé : relire le serveur avant d'écrire, sinon on l'écraserait */
    if (base === undefined && this.mode === "db"){
      try {
        const snap = await this.db.doc("periods/"+mk+"/employees/"+empId).get();
        base = snap.exists ? ((snap.data()||{}).days || {}) : {};
      } catch(e){ base = {}; }
    }
    const days = Object.assign({}, base || {}, daysObj);
    S.months[mk][empId] = {days};
    if (this.mode==="db") await this.db.doc("periods/"+mk+"/employees/"+empId).set({days});
    else this.saveLocal();
  },
  /* suppression groupée sur un mois */
  async removeDays(empId, mk, dates){
    const rec = (S.months[mk]||{})[empId];
    if (!rec || !rec.days) return 0;
    const days = Object.assign({}, rec.days);
    let n = 0;
    for (const d of dates) if (days[d]) { delete days[d]; n++; }
    if (!n) return 0;
    S.months[mk][empId] = {days};
    if (this.mode==="db") await this.db.doc("periods/"+mk+"/employees/"+empId).set({days});
    else this.saveLocal();
    return n;
  },
  async wipe(){
    if (this.mode==="db"){
      const cols = ["restaurants","employees","recrutements"];
      for (const c of cols){
        const snap = await this.db.collection(c).get();
        for (const d of snap.docs) await this.db.collection(c).doc(d.id).delete();
      }
      for (const mk of Object.keys(S.months)){
        const snap = await this.db.collection("periods/"+mk+"/employees").get();
        for (const d of snap.docs) await this.db.collection("periods/"+mk+"/employees").doc(d.id).delete();
      }
      S.months = {}; S.recrutements = [];
    } else {
      S.restaurants=[]; S.employees=[]; S.months={}; S.recrutements=[]; this.saveLocal(); render();
    }
  },
  /* --- mode equipe --- */
  teamSyncUrl(){
    try { return (localStorage.getItem(TEAM_SYNC.apiUrlKey) || teamSyncDefaultUrl()).replace(/\/+$/,""); }
    catch(e){ return teamSyncDefaultUrl(); }
  },
  teamAccessKey(){
    try { return localStorage.getItem(TEAM_SYNC.accessKeyKey) || ""; }
    catch(e){ return ""; }
  },
  teamHeaders(){
    const headers = {Accept:"application/json"};
    const key = this.teamAccessKey();
    if (key) headers.Authorization = "Bearer " + key;
    return headers;
  },
  async loadTeamSync(){
    this.mode = "team";
    this.loadLocal();
    const localSnapshot = this.snapshot();
    S.syncStatus = "Chargement équipe";
    paintSaveState();
    try{
      const res = await fetch(this.teamSyncUrl() + "/snapshot", {
        headers: this.teamHeaders(),
        cache: "no-store"
      });
      if (!res.ok) throw new Error("Team sync " + res.status);
      const remoteSnapshot = await res.json();
      if (!this.snapshotHasContent(remoteSnapshot) && this.snapshotHasContent(localSnapshot)){
        S.syncStatus = "Sauvegarde équipe";
        paintSaveState();
        const saveRes = await fetch(this.teamSyncUrl() + "/snapshot", {
          method: "PUT",
          headers: Object.assign({"Content-Type":"application/json"}, this.teamHeaders()),
          body: JSON.stringify(localSnapshot, null, 2)
        });
        if (!saveRes.ok) throw new Error("Team sync " + saveRes.status);
      } else {
        this.applySnapshot(remoteSnapshot);
        localStorage.setItem(this.KEY, JSON.stringify(this.snapshot()));
      }
      S.ready = true;
      S.syncStatus = "Synchronisé équipe";
      render();
      paintSaveState();
    }catch(e){
      console.warn("team sync", e);
      await this.replierLocal("Synchronisation équipe indisponible");
    }
  },
  /* Lit le fichier de données publié à côté de la page. null si absent
     ou vide — dans l'artefact la requête est bloquée, on retombe donc
     silencieusement sur le stockage local. */
  async loadSeed(url){
    try{
      const res = await fetch(url || SEED_URL, {cache:"no-store"});
      if (!res.ok) return null;
      const raw = await res.json();
      return this.snapshotHasContent(raw) ? raw : null;
    }catch(e){ return null; }
  },
  /* Repli hors ligne. Règle : le travail déjà présent sur ce navigateur
     n'est JAMAIS écrasé par le fichier publié — celui-ci ne sert qu'à
     amorcer un poste vierge. Pour le réimposer, Réglages → Recharger. */
  async replierLocal(raison){
    this.mode = "local";
    S.syncStatus = "";
    this.loadLocal();
    if (!this.snapshotHasContent(this.snapshot())){
      const seed = await this.loadSeed();
      if (seed){
        this.applySnapshot(seed);
        this.seeded = true;
        this.saveLocal();
        S.ready = true; render(); paintMode();
        return toast(raison + " — données publiées chargées. Vos modifications resteront sur ce navigateur.");
      }
    }
    S.ready = true; render(); paintMode();
    toast(raison + " — mode local, vos modifications restent sur ce navigateur.");
  },
  /* Remplace explicitement les données locales par le fichier publié. */
  async rechargerSeed(){
    const seed = await this.loadSeed();
    if (!seed) return toast("Aucun fichier de données publié trouvé à côté de la page (" + SEED_URL + ").");
    this.applySnapshot(seed);
    this.seeded = true;
    this.saveLocal();
    S.ready = true; render(); paintMode();
    toast("Données publiées rechargées : " + S.restaurants.length + " restaurant(s), " + S.employees.length + " salarié(s).");
  },
  queueTeamSave(){
    if (this.mode !== "team") return;
    S.syncStatus = "En attente équipe";
    paintSaveState();
    clearTimeout(this.remoteTimer);
    this.remoteTimer = setTimeout(() => this.flushTeamSave(), 650);
  },
  async flushTeamSave(){
    if (this.mode !== "team") return;
    if (this.remoteSaving){ this.remoteDirty = true; return; }
    this.remoteSaving = true;
    S.syncStatus = "Sauvegarde équipe";
    paintSaveState();
    try{
      const res = await fetch(this.teamSyncUrl() + "/snapshot", {
        method: "PUT",
        headers: Object.assign({"Content-Type":"application/json"}, this.teamHeaders()),
        body: this.exportJSON()
      });
      if (!res.ok) throw new Error("Team sync " + res.status);
      S.syncStatus = "Synchronisé équipe";
    }catch(e){
      console.warn("team save", e);
      S.syncStatus = "Erreur équipe";
      toast("Sauvegarde équipe impossible. Les données restent en local.");
    }finally{
      this.remoteSaving = false;
      paintSaveState();
      if (this.remoteDirty){
        this.remoteDirty = false;
        this.queueTeamSave();
      }
    }
  },
  /* --- mode GitHub --- */
  githubEnabled(){
    try { return localStorage.getItem(GITHUB_SYNC.enabledKey) === "1"; }
    catch(e){ return false; }
  },
  githubToken(){
    try { return localStorage.getItem(GITHUB_SYNC.tokenKey) || ""; }
    catch(e){ return ""; }
  },
  async loadGithub(){
    this.mode = "github";
    this.loadLocal();
    S.syncStatus = "Chargement GitHub";
    paintSaveState();
    try{
      const token = this.githubToken();
      const headers = {Accept:"application/vnd.github+json"};
      if (token) headers.Authorization = "Bearer " + token;
      const res = await fetch(githubApiUrl() + "?ref=" + encodeURIComponent(GITHUB_SYNC.branch), {headers, cache:"no-store"});
      if (res.ok){
        const meta = await res.json();
        this.remoteSha = meta.sha || "";
        this.applySnapshot(JSON.parse(decUtf8(meta.content || "")));
        S.ready = true;
        S.syncStatus = token ? "Synchronisé GitHub" : "Lecture GitHub";
        localStorage.setItem(this.KEY, JSON.stringify(this.snapshot()));
        render();
        paintSaveState();
        return;
      }
      if (res.status === 404 && token){
        S.ready = true;
        S.syncStatus = "Nouveau fichier GitHub";
        render();
        this.queueGithubSave();
        return;
      }
      throw new Error("GitHub " + res.status);
    }catch(e){
      console.warn("github sync", e);
      await this.replierLocal("Synchronisation GitHub indisponible");
    }
  },
  queueGithubSave(){
    if (this.mode !== "github") return;
    if (!this.githubToken()){
      S.syncStatus = "Token GitHub requis";
      paintSaveState();
      return;
    }
    S.syncStatus = "En attente GitHub";
    paintSaveState();
    clearTimeout(this.remoteTimer);
    this.remoteTimer = setTimeout(() => this.flushGithubSave(), 900);
  },
  async flushGithubSave(){
    if (this.mode !== "github") return;
    if (this.remoteSaving){ this.remoteDirty = true; return; }
    const token = this.githubToken();
    if (!token){ S.syncStatus = "Token GitHub requis"; paintSaveState(); return; }
    this.remoteSaving = true;
    S.syncStatus = "Sauvegarde GitHub";
    paintSaveState();
    try{
      const body = {
        message: "Autosave planning " + new Date().toISOString(),
        content: encUtf8(this.exportJSON()),
        branch: GITHUB_SYNC.branch
      };
      if (this.remoteSha) body.sha = this.remoteSha;
      const res = await fetch(githubApiUrl(), {
        method: "PUT",
        headers: {
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify(body)
      });
      if (res.status === 409){
        await this.refreshGithubSha(token);
        this.remoteDirty = true;
      } else if (!res.ok) {
        throw new Error("GitHub " + res.status);
      } else {
        const json = await res.json();
        this.remoteSha = json && json.content && json.content.sha ? json.content.sha : this.remoteSha;
        S.syncStatus = "Synchronisé GitHub";
      }
    }catch(e){
      console.warn("github save", e);
      S.syncStatus = "Erreur GitHub";
      toast("Sauvegarde GitHub impossible. Les données restent en local.");
    }finally{
      this.remoteSaving = false;
      paintSaveState();
      if (this.remoteDirty){
        this.remoteDirty = false;
        this.queueGithubSave();
      }
    }
  },
  async refreshGithubSha(token){
    const res = await fetch(githubApiUrl() + "?ref=" + encodeURIComponent(GITHUB_SYNC.branch), {
      headers: {Accept:"application/vnd.github+json", Authorization:"Bearer " + token},
      cache: "no-store"
    });
    if (res.ok){
      const meta = await res.json();
      this.remoteSha = meta.sha || "";
    }
  },
  /* --- mode local --- */
  KEY:"tds-v1",
  snapshot(){
    return {
      version: this.fileVersion,
      savedAt: new Date().toISOString(),
      data: {
        restaurants: S.restaurants,
        employees: S.employees,
        months: S.months,
        recrutements: S.recrutements,
        clotures: S.clotures
      }
    };
  },
  snapshotHasContent(raw){
    const payload = raw && raw.data ? raw.data : raw;
    if (!payload || typeof payload !== "object") return false;
    if (Array.isArray(payload.restaurants) && payload.restaurants.length) return true;
    if (Array.isArray(payload.employees) && payload.employees.length) return true;
    if (Array.isArray(payload.recrutements) && payload.recrutements.length) return true;
    return !!(payload.months && typeof payload.months === "object" && Object.keys(payload.months).length);
  },
  applySnapshot(raw){
    const payload = raw && raw.data ? raw.data : raw;
    S.restaurants = payload && Array.isArray(payload.restaurants) ? payload.restaurants : [];
    S.employees = payload && Array.isArray(payload.employees) ? payload.employees : [];
    S.months = payload && payload.months && typeof payload.months === "object" ? payload.months : {};
    S.recrutements = payload && Array.isArray(payload.recrutements) ? payload.recrutements : [];
    S.clotures = payload && payload.clotures && typeof payload.clotures === "object" ? payload.clotures : {};
    S.lastSavedAt = raw && raw.savedAt ? raw.savedAt : "";
  },
  loadLocal(){
    try{
      const raw = localStorage.getItem(this.KEY);
      if(raw) this.applySnapshot(JSON.parse(raw));
    }catch(e){}
    paintSaveState();
  },
  saveLocal(){
    if (this.mode!=="local" && this.mode!=="github" && this.mode!=="team") return;
    try{
      const snap = this.snapshot();
      localStorage.setItem(this.KEY, JSON.stringify(snap));
      S.lastSavedAt = snap.savedAt;
    }catch(e){}
    if (this.mode==="github") this.queueGithubSave();
    if (this.mode==="team") this.queueTeamSave();
    paintSaveState();
  },
  exportJSON(){
    return JSON.stringify(this.snapshot(), null, 2);
  },
  importJSON(text){
    const parsed = JSON.parse(text);
    this.applySnapshot(parsed);
    this.saveLocal();
    render();
  }
};

function paintMode(){
  const el = document.getElementById("modebadge");
  if (Store.mode === "db"){ el.className="pill ok"; el.textContent="Données partagées"; el.title="Les données sont enregistrées et visibles par les personnes avec qui vous partagez la page."; }
  else if (Store.mode === "team"){ el.className="pill ok"; el.textContent="Sync équipe"; el.title="Les données sont synchronisées via le serveur d'équipe."; }
  else if (Store.mode === "github"){ el.className="pill ok"; el.textContent="GitHub sync"; el.title="Les données sont chargées depuis GitHub et les modifications sont sauvegardées automatiquement."; }
  else if (Store.seeded){ el.className="pill warn"; el.textContent="Données publiées (local)";
    el.title="Chargées depuis le fichier publié avec la page. Vos modifications sont enregistrées dans ce navigateur uniquement et ne sont pas partagées."; }
  else { el.className="pill warn"; el.textContent="Données locales"; el.title="Sauvegarde dans ce navigateur uniquement — le partage entre managers n'est pas actif sur cette vue."; }
  paintSaveState();
}
function paintSaveState(){
  const el = document.getElementById("savebadge");
  if (!el) return;
  if (Store.mode === "db"){
    el.className = "pill ok";
    el.textContent = "Autosave partage";
    el.title = "Chaque modification est enregistree sur la base partagee.";
    return;
  }
  if (Store.mode === "team"){
    const ok = S.syncStatus === "Synchronisé équipe";
    const bad = S.syncStatus === "Erreur équipe";
    el.className = "pill " + (ok ? "ok" : (bad ? "warn" : "neutral"));
    el.textContent = S.syncStatus || "Sync équipe";
    el.title = "Sauvegarde automatique via le serveur d'équipe.";
    return;
  }
  if (Store.mode === "github"){
    const ok = S.syncStatus === "Synchronisé GitHub" || S.syncStatus === "Lecture GitHub";
    const bad = S.syncStatus === "Erreur GitHub" || S.syncStatus === "Token GitHub requis";
    el.className = "pill " + (ok ? "ok" : (bad ? "warn" : "neutral"));
    el.textContent = S.syncStatus || "GitHub sync";
    el.title = "Fichier GitHub: " + GITHUB_SYNC.path;
    return;
  }
  if (!S.lastSavedAt){
    el.className = "pill neutral";
    el.textContent = "Autosave local";
    el.title = "Les donnees seront enregistrees automatiquement dans ce navigateur.";
    return;
  }
  const d = new Date(S.lastSavedAt);
  const hh = pad(d.getHours());
  const mm = pad(d.getMinutes());
  el.className = "pill ok";
  el.textContent = "Sauve " + hh + ":" + mm;
  el.title = "Derniere sauvegarde automatique locale le " + d.toLocaleString("fr-FR");
}

/* ---------- calculs ---------- */
function dayPlannedHours(day){
  if (!day || day.kind !== "work" || !Array.isArray(day.services)) return 0;
  let t = 0;
  for (const s of day.services){
    let d = toMin(s.end) - toMin(s.start);
    if (d < 0) d += 1440;
    d -= Number(s.breakMin||0);
    if (d > 0) t += d;
  }
  return t/60;
}
function dayActualHours(day){
  if (!day || day.kind !== "work") return 0;
  return (day.actual === null || day.actual === undefined || day.actual === "") ? dayPlannedHours(day) : Number(day.actual);
}
function dayIsValidated(day){ return !!(day && day.kind==="work" && day.validated); }
function dayRestaurants(day){
  if (!day || day.kind!=="work") return [];
  return [...new Set((day.services||[]).map(s=>s.restaurantId).filter(Boolean))];
}
function empById(id){ return S.employees.find(e=>e.id===id); }
function restoById(id){ return S.restaurants.find(r=>r.id===id); }
function restoName(id){ const r = restoById(id); return r ? r.name : "—"; }
function empName(e){ return (e.firstName+" "+e.lastName).trim() || "Sans nom"; }
function activeEmployees(){ return S.employees.filter(e=>e.active!==false); }

function weekDates(startStr){ const s = parseYmd(startStr); return Array.from({length:7},(_,i)=>ymd(addDays(s,i))); }

function contractStatus(e){
  if (!e.endDate) return {key:"cdi", label:"Sans terme", cls:"neutral"};
  const today = ymd(new Date());
  const n = daysBetween(today, e.endDate);
  if (n < 0)  return {key:"past", label:"Échu", cls:"neutral", days:n};
  if (n <= 7) return {key:"crit", label:"Fin dans "+n+" j", cls:"crit", days:n};
  if (n <= 30)return {key:"warn", label:"Fin dans "+n+" j", cls:"warn", days:n};
  return {key:"ok", label:"Fin le "+frDate(e.endDate), cls:"neutral", days:n};
}

/* le contrat couvre-t-il cette date ? */
function contratCouvre(e, date){
  if (!e) return true;
  if (e.startDate && date < e.startDate) return false;
  if (e.endDate && date > e.endDate) return false;
  return true;
}
/* un salarié n'apparaît sur une période que si son contrat la couvre,
   ou s'il y a quand même quelque chose de saisi (pour ne rien masquer d'anormal) */
function visibleSurPeriode(e, dates){
  if (S.showEchus) return true;
  for (const d of dates) if (contratCouvre(e, d)) return true;
  for (const d of dates) if (Store.dayOf(e.id, d)) return true;
  return false;
}
function filtreRestosAll(){
  if (!Array.isArray(S.filterRestos) || !S.filterRestos.length) return true;
  return S.filterRestos.includes("all");
}
function restosSelectionnes(){
  if (filtreRestosAll()) return S.restaurants.slice();
  const ids = new Set(S.filterRestos);
  return S.restaurants.filter(r => ids.has(r.id));
}
function idsRestosSelectionnes(){
  return restosSelectionnes().map(r => r.id);
}
function matchRestoPlanning(restoId){
  if (filtreRestosAll()) return true;
  return S.filterRestos.includes(restoId);
}
function filtreRestoManques(){
  return filtreRestosAll() ? "all" : idsRestosSelectionnes();
}
function libelleFiltreRestos(){
  if (filtreRestosAll()) return "cette semaine";
  const rs = restosSelectionnes();
  if (rs.length === 1) return "sur "+rs[0].name;
  return "sur "+rs.length+" restaurants";
}
/* fins de contrat tombant dans la période affichée, ou dans les 30 jours qui suivent */
const HORIZON_DEPART = 30;
function departsPeriode(dates){
  if (!dates.length) return [];
  const debut = dates[0];
  const limite = ymd(addDays(parseYmd(dates[dates.length-1]), HORIZON_DEPART));
  const out = [];
  for (const e of activeEmployees()){
    if (!e.endDate) continue;
    if (e.endDate < debut || e.endDate > limite) continue;
    if (!matchRestoPlanning(e.restaurantId)) continue;
    if (!matchPole(e)) continue;
    out.push({e, fin:e.endDate, apres: ymd(addDays(parseYmd(e.endDate), 1)),
              dansPeriode: e.endDate <= dates[dates.length-1]});
  }
  return out.sort((a,b)=> a.fin.localeCompare(b.fin) || empName(a.e).localeCompare(empName(b.e)));
}
/* périodes d'essai s'achevant dans la période affichée ou dans les 30 jours qui suivent */
function essaisPeriode(dates){
  if (!dates.length) return [];
  const debut = dates[0];
  const limite = ymd(addDays(parseYmd(dates[dates.length-1]), HORIZON_DEPART));
  const out = [];
  for (const e of activeEmployees()){
    if (!e.essaiFin) continue;
    if (e.essaiFin < debut || e.essaiFin > limite) continue;
    if (!matchRestoPlanning(e.restaurantId)) continue;
    if (!matchPole(e)) continue;
    out.push({e, fin:e.essaiFin, dansPeriode: e.essaiFin <= dates[dates.length-1]});
  }
  return out.sort((a,b)=> a.fin.localeCompare(b.fin) || empName(a.e).localeCompare(empName(b.e)));
}
function enEssai(e){
  return !!e.essaiFin && ymd(new Date()) <= e.essaiFin;
}
async function validerEssai(e){
  if (!await ask("Valider la période d'essai de "+empName(e)+" ? Son contrat se poursuit normalement et l'alerte disparaît.","Valider l'essai")) return;
  await Store.saveEmp(Object.assign({}, e, {essaiFin:"", essaiValideLe: ymd(new Date())}));
  render(); toast("Période d'essai validée pour "+empName(e)+".");
}
function rompreEssai(e){

  body.append(

/* jours travaillés habituels : [] = non renseigné, on ne présume rien */
function joursTrav(e){ return Array.isArray(e && e.joursTravailles) ? e.joursTravailles : []; }
function estJourTravaille(e, date){
  const p = joursTrav(e);
  if (!p.length) return null;
  return p.includes((parseYmd(date).getDay()+6)%7);
}
function reposHabituel(e, date){ return estJourTravaille(e, date) === false; }

/* journées d'une période d'absence : calendaires retenues, journées de travail perdues */
function joursPeriodeAbsence(e, du, au, toutePeriode){
  const out = {calendaires:[], perdues:0, horsContrat:0, remplaces:0, reposIgnores:0, reposInclus:0};
  if (!du || !au || au < du) return out;
  let d = parseYmd(du); const fin = parseYmd(au); let garde = 0;
  while (d <= fin && garde++ < 400){
    const ds = ymd(d);
    if (!contratCouvre(e, ds)) out.horsContrat++;
    else {
      const jour = Store.dayOf(e.id, ds);
      const aService = jour && jour.kind === "work";
      const repos = estJourTravaille(e, ds) === false;   /* repos explicite de la trame */
      const travaille = aService || !repos;              /* sans trame ni service : on ne présume pas un repos */
      if (!toutePeriode && repos && !aService){ out.reposIgnores++; d = addDays(d,1); continue; }
      if (aService) out.remplaces++;
      if (travaille) out.perdues++; else out.reposInclus++;
      out.calendaires.push({date: ds, perdue: travaille});
    }
    d = addDays(d, 1);
  }
  return out;
}


function estDernierJour(e, date){ return !!e.endDate && e.endDate === date; }

function raisonHorsContrat(e, date){
  if (!e) return null;
  if (e.startDate && date < e.startDate) return "Entrée dans l'effectif le "+frDate(e.startDate);
  if (e.endDate && date > e.endDate) return contratLabel(e.contractType)+" terminé le "+frDate(e.endDate);
  return null;
}

/* ---------- effectif requis / couverture des services ---------- */
const SERVICES = [{id:"midi", label:"Midi"}, {id:"soir", label:"Soir"}];
function fenetres(r){

  return [
    {id:"midi", label:"Midi", start:r.midiStart || "11:00", end:r.midiEnd || "15:00"},
    {id:"soir", label:"Soir", start:r.soirStart || "18:00", end:r.soirEnd || "23:30"}

}
/* un service jamais ouvert de la semaine n'a pas d'horaires à afficher ni à saisir */
function serviceOuvert(r, servId){
  const cible = (r && r.cible) || {};
  for (let j=0; j<7; j++){
    const v = (cible[String(j)] || {})[servId];
    if (!v) return true;              /* jour non paramétré : on ne présume pas la fermeture */
    if (!v.ferme) return true;
  }
  return false;
}
function fenetresOuvertes(r){ return fenetres(r).filter(f => serviceOuvert(r, f.id)); }
function cibleDe(r, jour, servId){
  const c = ((r && r.cible) || {})[String(jour)] || {};
  const v = c[servId] || {};
  return {cui:Number(v.cui)||0, sal:Number(v.sal)||0, ferme:!!v.ferme};
}
function cibleDefinie(r){
  if (!r || !r.cible) return false;
  for (const j in r.cible) for (const s in r.cible[j]){
    const v = r.cible[j][s];
    if (Number(v.cui) || Number(v.sal) || v.ferme) return true;
  }
  return false;
}
/* un service compte pour la fenêtre s'il la chevauche d'au moins une heure */
function chevauche(svc, fen){
  const s = Math.max(toMin(svc.start), toMin(fen.start));
  const e = Math.min(toMin(svc.end), toMin(fen.end));
  return (e - s) >= 60;
}
function couvertureBrute(restoId, date, fen){
  const presents = [];
  for (const e of activeEmployees()){
    const day = Store.dayOf(e.id, date);
    if (!day || day.kind !== "work") continue;
    if ((day.services||[]).some(s => (s.restaurantId||"") === restoId && chevauche(s, fen))) presents.push(e);
  }
  return {
    presents: presents.length,
    cui: presents.filter(e => poleOf(e) === "cuisine").length,
    sal: presents.filter(e => poleOf(e) === "salle").length,
    equipe: presents
  };
}
function ecartService(r, date, fen){
  const jour = (parseYmd(date).getDay()+6)%7;
  const c = cibleDe(r, jour, fen.id);
  const cov = couvertureBrute(r.id, date, fen);
  if (c.ferme) return {r, date, fen, c, cov, ferme:true, requis:0, mc:0, ms:0,
                       manque:0, exces:0, incomplet:false};
  if (!c.cui && !c.sal) return null;   /* service non paramétré */
  const mc = Math.max(0, c.cui - cov.cui), ms = Math.max(0, c.sal - cov.sal);
  const requis = c.cui + c.sal;
  return {r, date, fen, c, cov, ferme:false, mc, ms, requis,
          manque: mc + ms, exces: Math.max(0, cov.presents - requis),
          incomplet: !!(mc || ms)};
}
function manquesPeriode(dates, restoFilter){
  const out = [];
  const ids = Array.isArray(restoFilter) ? new Set(restoFilter) : null;
  for (const r of S.restaurants){
    if (ids ? !ids.has(r.id) : (restoFilter !== "all" && r.id !== restoFilter)) continue;
    if (!cibleDefinie(r)) continue;
    for (const d of dates)
      for (const fen of fenetres(r)){
        const ec = ecartService(r, d, fen);
        if (ec && ec.incomplet) out.push(ec);
      }
  }
  return out.sort((a,b)=> a.date.localeCompare(b.date) || (a.fen.id==="midi"?0:1)-(b.fen.id==="midi"?0:1));
}
function libelleManque(ec){
  const bits = [];
  if (ec.mc) bits.push(ec.mc+" en cuisine");
  if (ec.ms) bits.push(ec.ms+" en salle");
  return "manque " + bits.join(" et ");
}
/* proposition d'équipe type à partir des semaines déjà chargées */
function deduireCible(restoId){
  const r = restoById(restoId);
  const cible = {};
  const auj = new Date();
  const median = a => { if (!a.length) return 0; const b = a.slice().sort((x,y)=>x-y); return Math.round(b[Math.floor(b.length/2)]); };
  for (let j=0; j<7; j++){
    cible[j] = {};
    for (const fen of fenetres(r)){
      const cs = [], ss = [];
      for (let k=0; k<=8 && cs.length < 4; k++){
        const d = ymd(addDays(startOfWeek(addDays(auj, -7*k)), j));
        const cov = couvertureBrute(restoId, d, fen);
        if (!cov.presents) continue;
        cs.push(cov.cui); ss.push(cov.sal);
      }
      const ouvert = cs.length > 0;
      cible[j][fen.id] = ouvert ? {cui:median(cs), sal:median(ss), ferme:false} : {cui:0, sal:0, ferme:true};
    }
  }
  return cible;
}

/* heures d'une semaine ISO pour un salarié (toutes dates de la semaine) */
function weekHours(empId, mondayStr){
  const dates = weekDates(mondayStr);
  let planned=0, actual=0, days=0;
  for (const d of dates){
    const day = Store.dayOf(empId, d);
    if (!day) continue;
    if (day.kind === "work"){ planned += dayPlannedHours(day); actual += dayActualHours(day); days++; }
  }
  return {planned, actual, days};
}
function overtimeSplit(actualH, contractH){
  const base = Number(contractH)||0;
  const hs = Math.max(0, actualH - SEUIL_LEGAL);
  const hs25 = Math.min(hs, 8);
  const hs50 = Math.max(0, hs - 8);
  const compl = base < SEUIL_LEGAL ? Math.max(0, Math.min(actualH, SEUIL_LEGAL) - base) : 0;
  return {hs25, hs50, compl, hs};
}

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k==="class") n.className = attrs[k];
    else if (k==="html") n.innerHTML = attrs[k];
    else if (k.startsWith("on")) n[k] = attrs[k];
    else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    n.appendChild(typeof kid === "string" || typeof kid === "number" ? document.createTextNode(String(kid)) : kid);
  }
  return n;
}

        e.endDate ? el("div",{style:"margin-top:6px"}, el("span",{class:"pill "+st.cls},
          (st.key==="past" ? "Contrat échu le " : "Fin de contrat le ")+frDate(e.endDate))) : null,
        enEssai(e) ? el("div",{class:"row noprint",style:"margin-top:8px;gap:6px"},
          el("span",{class:"pill accent"},"Période d'essai jusqu'au "+frDate(e.essaiFin)),
          el("button",{class:"btn sm primary",onclick:()=>validerEssai(e)},"Valider l'essai"),
          el("button",{class:"btn sm danger",onclick:()=>rompreEssai(e)},"Rompre l'essai")) : null),
      el("div",{class:"row noprint",style:"gap:4px"},
        el("button",{class:"btn sm",onclick:()=>shift(-1),title:"Mois précédent"},"◀"),
        el("div",{style:"font-family:var(--display);font-weight:600;min-width:150px;text-align:center;text-transform:capitalize"},
          moisLabel(S.ficheMonth)),
        el("button",{class:"btn sm",onclick:()=>shift(1),title:"Mois suivant"},"▶")))));
  wrap.appendChild(el("div",{class:"printonly",style:"display:none;margin-bottom:10px;font-family:var(--display);font-weight:600;text-transform:capitalize"},
    moisLabel(S.ficheMonth)));

  /* totaux du mois */
  let planif=0, reel=0, jours=0, absN=0;
  const abs={}, perResto={};
  for (const d of dates){
    const day = Store.dayOf(e.id, d);
    if (!day) continue;
    if (day.kind==="absence"){ absN++; abs[day.absenceType]=(abs[day.absenceType]||0)+1; continue; }
    if (day.kind!=="work") continue;
    const p = dayPlannedHours(day), a = dayActualHours(day);
    planif+=p; reel+=a; jours++;
    for (const s of (day.services||[])){
      let d0=toMin(s.end)-toMin(s.start); if(d0<0)d0+=1440; d0-=Number(s.breakMin||0);
      perResto[s.restaurantId]=(perResto[s.restaurantId]||0)+Math.max(0,d0)/60;
    }
  }
  const cible = Math.round((Number(e.weeklyHours)||0) * dates.length / 7);
  const ecart = reel - cible;
  wrap.appendChild(el("div",{class:"statrow",style:"margin-bottom:16px"},
    stat(fmtHshort(planif)+" h","Heures planifiées"),
    stat(fmtHshort(reel)+" h","Heures réelles"),
    stat((ecart>0?"+":"")+fmtHshort(ecart)+" h","Écart au contrat (≈ "+cible+" h)"),
    stat(String(jours),"Jours travaillés"),
    stat(String(absN),"Jours d'absence")));

  /* calendrier du mois */
  const cal = el("div",{class:"fichecal"});
  JOURS.forEach(j => cal.appendChild(el("div",{class:"fichecal-head"}, j.charAt(0).toUpperCase()+j.slice(1,3))));
  const debut = startOfWeek(parseYmd(dates[0]));
  const fin = parseYmd(dates[dates.length-1]);
  let cur = debut, garde = 0;
  while (cur <= fin && garde++ < 45){
    for (let i=0;i<7;i++){
      const d = ymd(addDays(cur, i));
      const dansMois = d.slice(0,7) === S.ficheMonth;
      const day = dansMois ? Store.dayOf(e.id, d) : null;
      const hors = dansMois ? raisonHorsContrat(e, d) : null;
      const cell = el("button",{class:"fichecal-cell"+(dansMois?"":" hors-mois")+(d===today?" today":"")+(hors&&dansMois?" hc":""),
        disabled: !dansMois,
        title: dansMois ? (hors ? "Hors contrat — "+hors : frDateLong(d)) : "",
        onclick: dansMois ? (()=>openDayModal(e, d)) : null});
      cell.appendChild(el("div",{class:"fichecal-num"}, String(parseYmd(d).getDate())));
      if (day && day.kind==="absence"){
        const a = ABSENCES.find(x=>x.id===day.absenceType) || {label:day.absenceType||"Absence"};
        cell.appendChild(el("span",{class:"chip abs"}, a.label));
      } else if (day && day.kind==="work"){
        for (const s of (day.services||[])){
          const ailleurs = s.restaurantId && s.restaurantId !== e.restaurantId;
          cell.appendChild(el("span",{class:"chip "+(ailleurs?"renfort":"work")},
            ailleurs ? el("span",{class:"tag"},"↔ "+restoName(s.restaurantId)) : null,
            s.start+"–"+s.end+(s.breakMin?" ·"+s.breakMin+"m":"")));
        }
        cell.appendChild(el("div",{class:"fichecal-h"}, fmtHshort(dayPlannedHours(day))+" h"));
      } else if (dansMois && !hors){
        const rh = reposHabituel(e, d);
        cell.appendChild(el("div",{class:"fichecal-repos"+(rh?" hab":"")}, rh ? "repos" : ""));
      }
      cal.appendChild(cell);
    }
    cur = addDays(cur, 7);
  }
  wrap.appendChild(el("div",{class:"card",style:"padding:12px;margin-bottom:16px"}, cal));

  /* semaine par semaine */
  const semaines = [];
  let w = startOfWeek(parseYmd(dates[0])), g2 = 0;
  while (w <= fin && g2++ < 8){
    const lundi = ymd(w);
    const wk = weekHours(e.id, lundi);
    if (wk.actual > 0 || wk.planned > 0) semaines.push({lundi, wk, ot: overtimeSplit(wk.actual, e.weeklyHours)});
    w = addDays(w, 7);
  }
  if (semaines.length){
    const t = el("table");
    t.appendChild(el("thead",null,el("tr",null,
      el("th",null,"Semaine"), el("th",null,"Du"), el("th",{class:"num"},"Planifié"),
      el("th",{class:"num"},"Réel"), el("th",{class:"num"},"Contrat"), el("th",{class:"num"},"Écart"),
      el("th",{class:"num"},"HS 25 %"), el("th",{class:"num"},"HS 50 %"))));
    const tb = el("tbody");
    for (const s of semaines){
      const ec = s.wk.actual - (Number(e.weeklyHours)||0);
      tb.appendChild(el("tr",null,
        el("td",{class:"mono",style:"font-size:12px"}, "S"+isoWeekKey(parseYmd(s.lundi)).split("-S")[1]),
        el("td",{class:"mono",style:"font-size:12px;white-space:nowrap"}, frDate(s.lundi)),
        el("td",{class:"num"}, fmtHshort(s.wk.planned)),
        el("td",{class:"num",style:"font-weight:600"}, fmtHshort(s.wk.actual)),
        el("td",{class:"num"}, String(e.weeklyHours||0)),
        el("td",{class:"num",style:Math.abs(ec)<.01?"":"color:var(--warn);font-weight:600"},
          Math.abs(ec)<.01?"—":(ec>0?"+":"")+fmtHshort(ec)),
        el("td",{class:"num"}, s.ot.hs25?fmtHshort(s.ot.hs25):"—"),
        el("td",{class:"num"}, s.ot.hs50?fmtHshort(s.ot.hs50):"—")));
    }
    t.appendChild(tb);
    wrap.appendChild(el("div",null,
      el("div",{class:"eyebrow",style:"margin-bottom:8px"},"Semaine par semaine"),
      el("div",{class:"tablewrap"}, t)));
  }

  /* absences et renforts */
  const bas = el("div",{class:"row",style:"margin-top:16px;align-items:flex-start;gap:26px"});
  if (absN) bas.appendChild(el("div",null,
    el("div",{class:"eyebrow",style:"margin-bottom:6px"},"Absences du mois"),
    el("div",{class:"row",style:"gap:6px"},
      Object.entries(abs).map(([k,v]) => el("span",{class:"pill warn"}, (absLabel(k)||"Absence")+" ×"+v)))));
  const autres = Object.keys(perResto).filter(id => id !== e.restaurantId);
  if (autres.length) bas.appendChild(el("div",null,
    el("div",{class:"eyebrow",style:"margin-bottom:6px"},"Répartition par restaurant"),
    el("div",{class:"row",style:"gap:6px"},
      Object.entries(perResto).sort((a,b)=>b[1]-a[1]).map(([id,h]) =>
        el("span",{class:"pill "+(id===e.restaurantId?"neutral":"renfort")}, restoName(id)+" · "+fmtHshort(h)+" h")))));
  if (bas.children.length) wrap.appendChild(bas);

  wrap.appendChild(el("p",{class:"note noprint",style:"margin-top:14px"},
    "Cliquez sur une journée pour la modifier. Les journées grisées ne sont pas couvertes par le contrat."));
  return wrap;
}
