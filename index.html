async function loadDemo(){
  if (S.restaurants.length && !await ask("Ajouter un jeu de démonstration par-dessus les données existantes ?","Charger la démo")) return;
  toast("Génération du jeu de démonstration…");
  const noms = ["Bastille","Nation","Batignolles","Saint-Michel","Confluence","Vieux-Port","Capitole","Chartrons"];
  /* équipe type de démonstration : plus de monde en fin de semaine */
  const cibleDemo = {};
  for (let j=0;j<7;j++){
    const fort = j >= 4;             /* vendredi, samedi, dimanche */
    cibleDemo[j] = {
      midi:{cui: 1,        sal: fort?2:1, ferme:false},
      soir:{cui: fort?2:1, sal: fort?3:2, ferme:false}
    };
  }
  const ids = [];
  for (let i=0;i<noms.length;i++)
    ids.push(await Store.saveResto({name:"ILIA "+noms[i], order:i,
      midiStart:"11:00", midiEnd:"15:00", soirStart:"18:00", soirEnd:"23:30", cible:cibleDemo}));
  const prenoms = ["Yanis","Léa","Karim","Sofia","Marc","Ines","Tom","Nour","Hugo","Rania","Paul","Emma","Sami","Clara","Adam","Jade"];
  const noms2 = ["Bertaud","Nguyen","Ferreira","Ait-Saada","Delcourt","Moreau","Bianchi","Haddad","Petit","Kowalski","Ricci","Sow","Lemaire","Vidal","Chen","Barbier"];
  const grille = [
    {role:"Assistant Manager",  pole:"salle",   ct:"CDI",   h:39},
    {role:"Kitchen Leader",     pole:"cuisine", ct:"CDI",   h:39},
    {role:"Kitchen Assistant",  pole:"cuisine", ct:"CDI",   h:35},
    {role:"Kitchen Assistant",  pole:"cuisine", ct:"APPR",  h:35},
    {role:"Employé polyvalent", pole:"salle",   ct:"CDI",   h:35},
    {role:"Employé polyvalent", pole:"salle",   ct:"CDD",   h:30},
    {role:"Employé polyvalent", pole:"salle",   ct:"EXTRA", h:12},
    {role:"Kitchen Assistant",  pole:"cuisine", ct:"CDD",   h:24}
  ];
  const today = new Date();
  const emps = [];
  let k = 0;
  for (const rid of ids){
    const n = 6 + (k % 3);
    for (let j=0;j<n;j++){
      const g = grille[j % grille.length];
      const fin = (g.ct==="CDD"||g.ct==="EXTRA"||g.ct==="APPR") ? ymd(addDays(today, 4 + ((k*7+j*11) % 120))) : "";
      const id = await Store.saveEmp({
        firstName: prenoms[k % prenoms.length], lastName: noms2[(k*3 + Math.floor(k/prenoms.length)) % noms2.length],
        restaurantId: rid, role: g.role, pole: g.pole, contractType: g.ct, weeklyHours: g.h,
        startDate: ymd(addDays(today, -(60 + ((k*13+j*7)%700)))), endDate: fin,
        canReplace: g.role !== "Assistant Manager", active:true
      });
      emps.push({id, rid, h:g.h, k});
      k++;
    }
  }
  /* trames de service : M = midi, S = soir, C = coupure (midi + soir) */
  const TRAME = h => h >= 39 ? ["C","C","C","C","S"]
                   : h >= 35 ? ["C","C","C","S","S"]
                   : h >= 28 ? ["C","C","C","M"]
                   : h >= 20 ? ["C","M","M","S"]
                   : ["C","M"];
  const svcFor = (t, rid) => t === "M" ? [{start:"10:30",end:"15:00",breakMin:30,restaurantId:rid}]
                          : t === "S" ? [{start:"18:30",end:"23:30",breakMin:0,restaurantId:rid}]
                          : [{start:"10:30",end:"14:30",breakMin:0,restaurantId:rid},
                             {start:"18:30",end:"23:00",breakMin:0,restaurantId:rid}];
  const monday = startOfWeek(today);
  const ecarts = [0, 0, 0.5, 0, 1, -0.5, 0, 0.25];
  for (const e of emps){
    const byMonth = {};
    const trame = TRAME(e.h);
    for (let w = 0; w < 2; w++){
      const rot = (e.k + w * 3) % 7;
      const jours = [0,1,2,3,4,5,6].map(i => (i + rot) % 7).slice(0, trame.length).sort((a,b)=>a-b);
      jours.forEach((jour, idx) => {
        const date = ymd(addDays(monday, w*7 + jour));
        const mk = monthKeyOf(date);
        let entry;
        /* quelques absences pour illustrer la saisie */
        if (w === 1 && e.k % 9 === 4 && idx < 3){
          entry = {kind:"absence", absenceType:"CP", services:[], actual:0, validated:true, note:""};
        } else if (w === 0 && e.k % 13 === 6 && idx < 2){
          entry = {kind:"absence", absenceType:"MAL", services:[], actual:0, validated:true, note:""};
        } else {
          /* quelques renforts dans un autre restaurant du groupe */
          const renfort = (w === 1 && e.k % 7 === 2 && idx === 1);
          const rid = renfort ? ids[(ids.indexOf(e.rid) + 3) % ids.length] : e.rid;
          const services = svcFor(trame[idx], rid);
          const validee = w === 0;
          const planif = services.reduce((s,x)=>{let d0=toMin(x.end)-toMin(x.start); if(d0<0)d0+=1440; return s+(d0-x.breakMin)/60;},0);
          const ec = ecarts[(e.k + idx) % ecarts.length];
          entry = {kind:"work", services, actual: validee ? Math.round((planif+ec)*100)/100 : null,
                   validated: validee, note: renfort ? "Renfort" : "", absenceType:""};
        }
        (byMonth[mk] = byMonth[mk] || {})[date] = entry;
      });
    }
    for (const mk of Object.keys(byMonth)) await Store.setDays(e.id, mk, byMonth[mk]);
  }
  toast("Jeu de démonstration chargé.");
  render();
}

/* ---------- modale générique + toast ---------- */
let modalPrevFocus = null;
function openModal({title, sub, body, actions, wide}){
  closeModal();
  modalPrevFocus = document.activeElement;
  const root = document.getElementById("modal-root");
  const scrim = el("div",{class:"scrim",role:"dialog","aria-modal":"true","aria-label":title});
  const modal = el("div",{class:"modal"+(wide?" wide":"")});
  modal.append(
    el("header",null, el("div",null, el("h3",null,title), sub?el("div",{class:"sub"},sub):null)),
    el("div",{class:"body"}, body));
  const foot = el("footer");
  for (const a of actions) foot.appendChild(a.el ? a.el : el("button",{class:a.cls, onclick:()=>a.act(closeModal)}, a.label));
  modal.appendChild(foot);
  scrim.appendChild(modal);
  scrim.onclick = ev => { if (ev.target === scrim) closeModal(); };
  root.appendChild(scrim);
  const f = modal.querySelector("input,select,textarea,button");
  if (f) f.focus();
}
function closeModal(){
  const root = document.getElementById("modal-root");
  if (root.firstChild) root.innerHTML = "";
  if (modalPrevFocus && modalPrevFocus.focus) { try{ modalPrevFocus.focus(); }catch(e){} modalPrevFocus = null; }
}
document.addEventListener("click", () => {
  if (S.restoDropOpen || S.payDropOpen){ S.restoDropOpen = false; S.payDropOpen = false; render(); }
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  if (S.restoDropOpen || S.payDropOpen){ S.restoDropOpen = false; S.payDropOpen = false; render(); return; }
  if (pendingAsk) { const f = pendingAsk; pendingAsk = null; f(false); return; }
  closeModal();
});
let pendingAsk = null;

/* confirmation maison : window.confirm peut être bloqué dans une page publiée */
function ask(message, confirmLabel){
  return new Promise(resolve => {
    const root = document.getElementById("confirm-root");
    root.innerHTML = "";
    const scrim = el("div",{class:"scrim",style:"z-index:95",role:"dialog","aria-modal":"true","aria-label":"Confirmation"});
    const done = v => { pendingAsk = null; root.innerHTML = ""; resolve(v); };
    pendingAsk = done;
    const modal = el("div",{class:"modal",style:"width:min(460px,100%)"},
      el("div",{class:"body"}, el("p",{style:"margin:0"}, message)),
      el("footer",null,
        el("button",{class:"btn",onclick:()=>done(false)},"Annuler"),
        el("button",{class:"btn danger",onclick:()=>done(true)}, confirmLabel||"Confirmer")));
    scrim.appendChild(modal);
    scrim.onclick = ev => { if (ev.target===scrim) done(false); };
    root.appendChild(scrim);
    modal.querySelector("footer button:last-child").focus();
  });
}

let toastTimer = null;
function toast(msg){
  const root = document.getElementById("toast-root");
  root.innerHTML = "";
  const t = el("div",{class:"toast",role:"status"}, msg);
  root.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ root.innerHTML=""; }, 3600);
}

/* ---------- démarrage ---------- */
render();
Store.init();
</script>
